async function jeton(ecriture) {
    var j = await gristAvecTimeout(grist.docApi.getAccessToken({ readOnly: !ecriture }), 15000);
    if (!j || !j.token || !j.baseUrl || !/^https:\/\//i.test(j.baseUrl)) {
        throw new Error('Jeton d\'accès indisponible');
    }
    return j;
}
async function fetchDelai(url, opts, delai) {
    var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
    var minuterie = ctrl ? setTimeout(function () { ctrl.abort(); }, delai || DELAI_API_MS) : null;
    try {
        return await fetch(url, Object.assign({}, opts, ctrl ? { signal: ctrl.signal } : {}));
    }
    finally {
        if (minuterie) {
            clearTimeout(minuterie);
        }
    }
}
function fichierPdfValide(f) { return !!f && (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)) && f.size > 0 && f.size <= TAILLE_MAX_PDF; }
async function deposerFichiers(fichiers) {
    if (!accesComplet()) {
        throw new Error('Accès complet non accordé au widget : not allowed');
    }
    var j = await jeton(true);
    var fd = new FormData();
    fichiers.forEach(function (f) { fd.append('upload', f, f.name); });
    var rep = await fetchDelai(j.baseUrl + '/attachments?auth=' + encodeURIComponent(j.token), { method: 'POST', headers: { 'X-Requested-With': 'XMLHttpRequest' }, body: fd }, 120000);
    if (!rep.ok) {
        throw new Error('Réponse ' + rep.status);
    }
    var ids = await rep.json();
    if (!Array.isArray(ids) || !ids.length || ids.some(function (x) { return typeof x !== 'number'; })) {
        throw new Error('Réponse inattendue au dépôt');
    }
    return ids;
}
var _nomsPieces = {};
async function lireNomsPieces() {

    }

function nomPiece(id, defaut) { return _nomsPieces[id] || defaut || ('piece-' + id + '.pdf'); }
async function telechargerPiece(id, nom) {
    try {
        afficherLoader('Téléchargement…');
        var j = await jeton(false);
        var rep = await fetchDelai(j.baseUrl + '/attachments/' + encodeURIComponent(id) + '/download?auth=' + encodeURIComponent(j.token), {}, 120000);
        if (!rep.ok) {
            throw new Error('Réponse ' + rep.status);
        }
        var blob = await rep.blob();
        var url = URL.createObjectURL(blob);
        var a = creer('a', { attrs: { href: url, download: nom || nomPiece(id) } });
        a.hidden = true;
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);
        masquerLoader();
    }
    catch (e) {
        masquerLoader();
        afficherErreur('Le fichier n\'a pas pu être téléchargé. Réessayez.', e);
    }
}
function listePieces(ids, prefixe, defaut) {
    if (!ids.length) {

        var nom = nomPiece(id, defaut);
        return creer('li', {}, [boutonLien(nom, function () { return telechargerPiece(id, nom); }, { id: prefixe + k, classe: 'bi-piece', aria: 'Télécharger ' + nom })]);

async function lienVoirEnTantQue(email) {
    var j = await jeton(false);
