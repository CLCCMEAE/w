    var sous = document.elementFromPoint(ev.clientX, ev.clientY);
    var cible = sous && sous.closest ? sous.closest('.w-el') : null;
    var idCible = cible ? Number(cible.getAttribute('data-id')) : 0;
    if (g.bouge && idCible && idCible !== g.source) { relayer(creerLien(g.source, idCible), 'Connecteur'); return; }
    if (!g.bouge) { etat.sourceLien = g.source; majSource(); annoncer('Départ choisi. Cliquez sur l\'élément d\'arrivée.'); }
  }
}

/* === SECTION : CLAVIER SUR LA TOILE === */
var _deplacementClavier = null;

function surToucheToile(ev) {
  /* Depuis la barre d'actions, les raccourcis Ctrl (copier, coller,
     dupliquer, annuler) restent actifs. */
  var depuisBarre = ev.target.closest && ev.target.closest('.w-ctx, .w-outils') && !ev.target.closest('.w-pop') && (ev.ctrlKey || ev.metaKey) && /^[cxvdzaCXVDZA]$/.test(ev.key);
  if (etat.edition || (!depuisBarre && ev.target.closest && ev.target.closest('.w-pop, .w-ctx, .w-outils'))) {
    if (ev.key === 'Escape' && etat.pop) { ev.preventDefault(); fermerPop(true); }
    return;
  }
  var mod = ev.ctrlKey || ev.metaKey;
  var k = ev.key;
  var sel = elementsSelectionnes();
  if (k === 'Escape') {
    if (etat.sourceLien) { etat.sourceLien = null; majSource(); }
    else if (etat.outil !== 'selection') { choisirOutil('selection'); }
    else if (etat.selection.length || etat.lienSel) { etat.selection = []; etat.lienSel = null; majSelectionVisuelle(); var t = document.getElementById('vToile'); if (t) { t.focus(); } }
    else { return; }
    ev.preventDefault(); return;
  }
  if (mod && (k === 'z' || k === 'Z')) { ev.preventDefault(); relayer(annulerDerniere(), 'Annuler'); return; }
  if (mod && (k === 'a' || k === 'A')) { ev.preventDefault(); selectionner(elementsDuTableau().map(function (e) { return e.id; }), true); annoncer('Tout est sélectionné.'); return; }
  if (mod && (k === 'c' || k === 'C')) { if (sel.length) { ev.preventDefault(); copierSelection(false); } return; }
  if (mod && (k === 'x' || k === 'X')) { if (sel.length && etat.peutModifier) { ev.preventDefault(); copierSelection(true); } return; }
  if (mod && (k === 'v' || k === 'V')) {
    /* Le collage passe par l'evenement « coller » (image du presse-papiers
       du systeme) ; a defaut, le presse-papiers du widget est colle. */
    _collageTraite = false;
    setTimeout(function () { if (!_collageTraite && lirePressePapier()) { relayer(collerPressePapier(), 'Coller'); } }, 150);
    return;
  }
  if (mod && (k === 'd' || k === 'D')) { ev.preventDefault(); if (etat.peutModifier && sel.length) { relayer(dupliquerSelection(), 'Dupliquer'); } return; }
  if ((k === 'Delete' || k === 'Backspace') && etat.peutModifier) {
    if (sel.length) { ev.preventDefault(); relayer(supprimerSelection(), 'Supprimer'); }
    else if (etat.lienSel) { ev.preventDefault(); relayer(supprimerLien(etat.lienParId[etat.lienSel]), 'Supprimer'); }
    return;
  }
  if ((k === 'Enter' || k === 'F2') && sel.length === 1) {
    ev.preventDefault();
    if (etat.peutModifier && !ev.shiftKey) { editerLibelle(sel[0].id); } else { ouvrirFiche(sel[0].id); }
    return;
  }
  if (k.indexOf('Arrow') === 0) {
    ev.preventDefault();
    var pas = ev.shiftKey ? 1 : (etat.affichage.grille ? PAS_GRILLE : 10);
    var dx = k === 'ArrowLeft' ? -pas : (k === 'ArrowRight' ? pas : 0), dy = k === 'ArrowUp' ? -pas : (k === 'ArrowDown' ? pas : 0);
    if (sel.length && etat.peutModifier) { deplacerAuClavier(dx, dy); }
    else { etat.cam.x -= dx * 4; etat.cam.y -= dy * 4; appliquerCamera(); memoriserCamera(); }
    return;
  }
  if (mod || ev.altKey) { return; }
  if (k === '+' || k === '=') { ev.preventDefault(); zoomerCentre(1.2); return; }
  if (k === '-') { ev.preventDefault(); zoomerCentre(1 / 1.2); return; }
  if (k === '0') { ev.preventDefault(); recentrer(); return; }
  if ((k === 'ContextMenu' || (k === 'F10' && ev.shiftKey)) && sel.length && etat.peutModifier) {
    ev.preventDefault();
    placerCtx();
    var c0 = document.querySelector('#vCtx button'); if (c0) { c0.focus(); }
    return;
  }
  if ((k === 'a' || k === 'A') && etat.peutModifier) { ev.preventDefault(); var ba = document.getElementById('bOutil_Ajouter'); if (ba) { ouvrirAjout(ba); } return; }
  var o = OUTILS.filter(function (x) { return x && x.touche.toLowerCase() === String(k).toLowerCase(); })[0];
  if (o && (!o.edition || etat.peutModifier)) { ev.preventDefault(); choisirOutil(o.cle); }
}

/* Deplacement aux fleches : affiche aussitot, ecrit apres une courte pause
   (une seule ecriture et un seul « Annuler » pour une rafale de touches). */
function deplacerAuClavier(dx, dy) {
  var tous = elementsDuTableau();
  var aDeplacer = {};
  elementsSelectionnes().forEach(function (e) {
    aDeplacer[e.id] = true;
    if (e.type === 'Section') { contenusDe(e, tous).forEach(function (x) { aDeplacer[x.id] = true; }); }
  });
  if (!_deplacementClavier) {
    var depart = {};
    Object.keys(aDeplacer).forEach(function (k) { depart[k] = { x: etat.parId[k].x, y: etat.parId[k].y }; });
    _deplacementClavier = { depart: depart, minuterie: null };
  }
  Object.keys(aDeplacer).forEach(function (k) {
    var e = etat.parId[k];
    if (!_deplacementClavier.depart[k]) { _deplacementClavier.depart[k] = { x: e.x, y: e.y }; }
    e.x += dx; e.y += dy;
    var d = divElement(k); if (d) { placerDiv(d, e); }
  });
  dessinerLiens();
  placerCtx();
  clearTimeout(_deplacementClavier.minuterie);
  _deplacementClavier.minuterie = setTimeout(function () {
    var dep = _deplacementClavier.depart;
    _deplacementClavier = null;
    relayer(enregistrerPositions(dep, 'Déplacement'), 'Déplacement au clavier');
  }, DELAI_SAUVEGARDE_MS);
}

/* === SECTION : ECRITURES ===
   Chaque ecriture met d'abord a jour l'affichage, puis le document ; un
   refus est explique et l'affichage est relu. « Annuler » reste propose
   quelques secondes en bas a droite (et Ctrl+Z). */
async function ecrire(actions, message, inverse) {
  try {
    var r = await agir(actions);
    if (message || inverse) { proposerAnnulation(message || 'Enregistré.', inverse || null); }
    planifierRafraichissement(300);
    return r;
  } catch (e) {
    erreurEcriture(e, 'La modification n\'a pas abouti.');
    etat.signature = '';
    await rafraichir(true);
    return null;
  }
}

function erreurEcriture(e, message) {
  if (estRefusDroits(e)) {
    etat.peutModifier = false; etat.peutParametrer = false;
    afficherErreur('Vos droits sur ce document ne permettent pas cette modification. WuitWorkflow passe en consultation seule.', e);
    if (etat.vue === 'principal') { rendrePrincipal(); }
    return;
  }
  afficherErreur(message, e);
}

/* Historique d'annulation (1.7.3) : pile de 50 modifications, sans limite
   de temps. Ctrl+Z et « Annuler » reprennent la plus recente. Une action
   sans inverse (vote, fiche...) ne vide plus la pile.
   inverse : fonction qui rend les actions d'annulation (ou une promesse). */
var MAX_ANNULATIONS = 50;
function proposerAnnulation(message, inverse) {
  if (!inverse) { if (message) { afficherToast(message); } return; }
  etat.annulations = etat.annulations || [];
  etat.annulations.push({ fn: inverse, tableau: etat.tableauId });
  if (etat.annulations.length > MAX_ANNULATIONS) { etat.annulations.shift(); }
  var b = bouton(/supprim/i.test(message || '') ? 'Annuler la suppression' : 'Annuler la modification', 'secondaire', 'arrow-go-back-line', function () { return annulerDerniere(); }, { petit: true, id: 'tAnnuler' });
  afficherToast(message, [b], DELAI_ANNULER_MS);
}

async function annulerDerniere() {
  var pile = etat.annulations || [];
  var i = pile.length - 1;
  while (i >= 0 && pile[i].tableau !== etat.tableauId) { i--; }
  var x = i >= 0 ? pile.splice(i, 1)[0] : null;
  masquerToast();
  if (!x) { annoncer('Rien à annuler.'); return; }
  try {
    var actions = await x.fn();
    if (actions && actions.length) { await agir(actions); }
    etat.signature = '';
    await rafraichir(true);
    afficherToast('Modification annulée.');
  } catch (e) { erreurEcriture(e, 'L\'annulation n\'a pas abouti.'); }
}

async function enregistrerPositions(depart, quoi) {
  var ids = Object.keys(depart).map(Number).filter(function (id) { return etat.parId[id]; });
  if (!ids.length) { return; }
  majSelectionVisuelle();
  majMinicarte();
  var actions = [['BulkUpdateRecord', etat.tables.el, ids, { POSITION_X: ids.map(function (id) { return etat.parId[id].x; }), POSITION_Y: ids.map(function (id) { return etat.parId[id].y; }) }]];
  await ecrire(actions, quoi === 'Déplacement' ? pluriel(ids.length, 'élément déplacé', 'éléments déplacés') + '.' : (quoi === 'Alignement' ? 'Éléments alignés.' : null), function () {
    return [['BulkUpdateRecord', etat.tables.el, ids, { POSITION_X: ids.map(function (id) { return depart[id].x; }), POSITION_Y: ids.map(function (id) { return depart[id].y; }) }]];
  });

function ordreMax() { return elementsDuTableau().reduce(function (m, e) { return Math.max(m, e.ordre || 0); }, 0); }

function couleurParDefaut(type) {
  var t = tableauCourant();
  if (type === 'Section') { return 'blanc'; }
  if (type === 'Texte') { return 'blanc'; }
  var leg = t ? t.legende : [];
  if (type === 'Post-it') {
    /* Un jaune de la legende (le dernier : « Commentaire » d'un logigramme),
       sinon sa premiere couleur. */
    var jaunes = leg.filter(function (x) { return x.couleur.indexOf('yellow') === 0; });
    if (jaunes.length) { return jaunes[jaunes.length - 1].couleur; }
    var autre = leg.filter(function (x) { return x.couleur !== 'blanc'; })[0];
    return autre ? autre.couleur : 'yellow-tournesol';
  }
  var blanc = leg.filter(function (x) { return x.couleur === 'blanc'; })[0];
  return blanc ? 'blanc' : (leg[0] ? leg[0].couleur : 'blanc');
}

async function creerElement(type, pos, editer, autres) {

  var champs = Object.assign({ TABLEAU: etat.tableauId, TYPE: type, FORME: type === 'Forme' ? 'Rectangle' : '', LIBELLE: '', COULEUR: couleurParDefaut(type),
    POSITION_X: pos.x, POSITION_Y: pos.y, LARGEUR: pos.w, HAUTEUR: pos.h, ORDRE: type === 'Section' ? 0 : ordreMax() + 1 }, type === 'Section' ? {} : prerempliPage(), autres || {});

    var id = r && r.retValues ? r.retValues[0] : null;

  await ecrire(sel.map(function (e) { return ['UpdateRecord', etat.tables.el, e.id, champs]; }), message, function () {
    return ids.map(function (id, i) { return ['UpdateRecord', etat.tables.el, id, avant[i]]; });

function valeurElement(e, col) {

    ORDRE: e.ordre, RESPONSABLE: e.responsable, STATUT: e.statut || null, VOTES: e.votes, FICHE_TABLE: e.ficheTable, FICHE_LIGNE: e.ficheLigne || 0, TABLEAU: e.tableau };
  return m[col];

function appliquerLocal(e, champs) {
  var m = { TYPE: 'type', FORME: 'forme', LIBELLE: 'libelle', DESCRIPTION: 'description', COULEUR: 'couleur', POSITION_X: 'x', POSITION_Y: 'y', LARGEUR: 'w', HAUTEUR: 'h',
    ORDRE: 'ordre', RESPONSABLE: 'responsable', STATUT: 'statut', VOTES: 'votes', FICHE_TABLE: 'ficheTable', FICHE_LIGNE: 'ficheLigne' };
  Object.keys(champs).forEach(function (k) { if (m[k]) { e[m[k]] = champs[k] === null ? '' : champs[k]; } });

function selectionnerDessous(id, x, y) {
  var ids = [];
  document.elementsFromPoint(x, y).forEach(function (n) {
    var d = n.closest ? n.closest('#vMonde .w-el') : null;
    if (d) { var k = Number(d.getAttribute('data-id')); if (ids.indexOf(k) === -1) { ids.push(k); } }
  });
  if (ids.length < 2) { return false; }
  var i = ids.indexOf(id);
  var suivant = ids[(i + 1) % ids.length];
  if (suivant === id) { return false; }

/* Premier plan et arriere-plan : chaque element change de rang parmi ceux de
   sa sorte ; les sections restent sous les autres elements, mais se
   superposent entre elles. */
async function changerPlan(premier) {
  var sel = elementsSelectionnes();
  if (!sel.length) { return; }
  var tous = elementsDuTableau();
  var avant = sel.map(function (e) { return e.ordre; });
  [true, false].forEach(function (section) {
    var lot = sel.filter(function (e) { return (e.type === 'Section') === section; });
    if (!lot.length) { return; }
    var memes = tous.filter(function (e) { return (e.type === 'Section') === section; });
    if (premier) {
      var max = memes.reduce(function (m, e) { return Math.max(m, e.ordre || 0); }, 0);
      lot.forEach(function (e, k) { e.ordre = max + 1 + k; });
    } else {
      var min = memes.reduce(function (m, e) { return Math.min(m, e.ordre || 0); }, Infinity);
      lot.forEach(function (e, k) { e.ordre = min - lot.length + k; });
    }
  });
  rendreMonde();
  await ecrire(sel.map(function (e) { return ['UpdateRecord', etat.tables.el, e.id, { ORDRE: e.ordre }]; }), premier ? 'Passé au premier plan.' : 'Passé à l\'arrière-plan.', function () {

/* Fiche liee : contenu de la ligne (premieres colonnes), choix de la ligne. */
function blocFicheLiee(e, t) {
  var tid = t.fiche.table;
  var bloc = creer('div', { classe: 'w-carte-liee' }, [creer('p', { classe: 'fr-mb-0 w-titre-colonne', texte: 'Fiche liée' })]);
  var existe = e.ficheTable === tid && ligneLieeExiste(e);
  if (e.ficheLigne && !existe) {
    bloc.appendChild(creer('p', { classe: 'w-mention', texte: e.ficheTable !== tid ? 'Reliée à une ligne d\'une autre table (' + libelleTable(e.ficheTable) + ').' : 'La ligne liée n\'existe plus.' }));
  }
  if (existe) {
    var f = etat.fiches[tid];
    var i = f.parId[e.ficheLigne];
    bloc.appendChild(creer('strong', { texte: texteLigneLiee(tid, e.ficheLigne, colonneAffichee(tid)) || ('Ligne ' + e.ficheLigne) }));
    bloc.appendChild(creer('span', { classe: 'w-mention', texte: 'Table ' + libelleTable(tid) }));
    var dl = creer('dl');
    colonnesVisibles(tid).slice(0, 12).forEach(function (c) {
      var v = texteLisible(f.d[c.colId] ? f.d[c.colId][i] : '');
      if (/^Date/.test(c.type) && typeof valeurCellule(f.d[c.colId][i]) === 'number') { v = formaterDate(f.d[c.colId][i]); }
      if (!v) { return; }
      dl.appendChild(creer('dt', { texte: c.label }));
      dl.appendChild(creer('dd', { texte: v.length > 300 ? v.slice(0, 297) + '…' : v }));
    });
    if (dl.childNodes.length) { bloc.appendChild(dl); }
  } else if (!e.ficheLigne) {
    bloc.appendChild(creer('p', { classe: 'w-mention', texte: 'Aucune ligne de « ' + libelleTable(tid) + ' » reliée.' }));
  }
  if (etat.peutModifier && etat.fiches[tid]) {
    var col = colonneAffichee(tid);
    var opts = etat.fiches[tid].d.id.map(function (rid) { return { valeur: rid, libelle: texteLigneLiee(tid, rid, col) || ('Ligne ' + rid) }; });
    opts.sort(function (a, b) { return a.libelle.localeCompare(b.libelle, 'fr'); });
    var sel = liste('fFicheLigne', opts, e.ficheTable === tid ? e.ficheLigne : '', { vide: 'Aucune' });
    sel.addEventListener('change', function () { relayer(relierFiche(e, sel.value ? tid : '', sel.value ? parseInt(sel.value, 10) : 0), 'Fiche liée'); });
    bloc.appendChild(groupeListe('Ligne reliée', sel));
  }
  return bloc;
}

/* === SECTION : PIECES JOINTES ===

var _infosPj = {};
async function lireInfosPj() {
  try {
    var d = await lireTable('_grist_Attachments');

    for (var i = 0; i < d.id.length; i++) { _infosPj[d.id[i]] = { nom: texteCellule(d, 'fileName', i) || ('Fichier ' + d.id[i]), taille: nombreCellule(d, 'fileSize', i, 0) }; }
  } catch (e) { logSecurite('INFO', 'Noms des pièces jointes illisibles', e); }
}

function tailleLisible(o) { return o > 1048576 ? (o / 1048576).toFixed(1).replace('.', ',') + ' Mo' : Math.max(1, Math.round(o / 1024)) + ' Ko'; }

function blocPiecesJointes(e) {
  var bloc = creer('div', { classe: 'fr-mb-2w' }, [creer('p', { classe: 'fr-label fr-mb-1v', texte: 'Pièces jointes' })]);

    ul.appendChild(creer('li', {}, [
      creer('button', { classe: 'w-lien-texte w-pj__nom', texte: info.nom + (info.taille ? ' (' + tailleLisible(info.taille) + ')' : ''), attrs: { 'aria-label': 'Télécharger ' + info.nom }, clic: function () { return relayer(telechargerPj(pid, info.nom), 'Téléchargement'); } }),
      etat.peutModifier ? bouton('Retirer ' + info.nom, 'discret', 'close-line', function () { return retirerPj(e, pid, info.nom); }, { petit: true, iconeSeule: true, classe: 'w-bulle--droite' }) : null]));
  });
  bloc.appendChild(ul);

    fichier.addEventListener('change', function () { if (fichier.files && fichier.files.length) { relayer(envoyerPj(e, Array.prototype.slice.call(fichier.files)), 'Envoi'); } });
    var lab = creer('label', { classe: 'fr-btn fr-btn--secondary fr-btn--sm fr-icon-attachment-line fr-btn--icon-left', attrs: { 'for': 'fPjFichier', tabindex: '0', role: 'button' }, texte: 'Ajouter un fichier' });
    lab.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); fichier.click(); } });

var _jetonComplet = false;
async function obtenirJeton(complet) {
  var j = await gristAvecTimeout(grist.docApi.getAccessToken({ readOnly: !complet }), 10000);
  return j;
}

async function telechargerPj(id, nom) {
  try {
    var j = await obtenirJeton(_jetonComplet);
    var rep = await fetch(j.baseUrl + '/attachments/' + id + '/download?auth=' + encodeURIComponent(j.token));
    if ((rep.status === 401 || rep.status === 403) && !_jetonComplet) {
      _jetonComplet = true;
      j = await obtenirJeton(true);
      rep = await fetch(j.baseUrl + '/attachments/' + id + '/download?auth=' + encodeURIComponent(j.token));
    }
    if (!rep.ok) { throw new Error('Téléchargement refusé : ' + rep.status); }
    var blob = await rep.blob();
    telechargerBlob(blob, nom);
  } catch (e) { afficherErreur('Le fichier n\'a pas pu être téléchargé.', e); }
}

function telechargerBlob(blob, nom) {
  var url = URL.createObjectURL(blob);
  var a = creer('a', { attrs: { href: url, download: nom } });
  a.hidden = true;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
}

async function envoyerPj(e, fichiers) {
  for (var i = 0; i < fichiers.length; i++) {
    var f = fichiers[i];
    var ext = String(f.name || '').split('.').pop().toLowerCase();
    if (EXTENSIONS_REFUSEES.indexOf(ext) !== -1) { signalerSaisie('« ' + f.name + ' » : ce type de fichier n\'est pas accepté.'); return; }
    if (f.size > TAILLE_MAX_PJ) { signalerSaisie('« ' + f.name + ' » dépasse ' + tailleLisible(TAILLE_MAX_PJ) + '.'); return; }
  }
  afficherLoader('Envoi des fichiers…');
  try {
    var ids = await televerser(fichiers);
    var tous = e.pj.concat(ids.filter(function (x) { return e.pj.indexOf(x) === -1; }));
    await agir([['UpdateRecord', etat.tables.el, e.id, { PIECES_JOINTES: ['L'].concat(tous) }]]);
    masquerLoader();
    await lireInfosPj();
    etat.signature = '';
    await rafraichir(true);
    afficherToast(pluriel(ids.length, 'fichier joint', 'fichiers joints') + '.');
  } catch (err) { masquerLoader(); erreurEcriture(err, 'L\'envoi des fichiers n\'a pas abouti.'); }
}

async function retirerPj(e, pid, nom) {
  var ok = await confirmer('Retirer le fichier « ' + nom + ' » ?', 'Le fichier est retiré de l\'élément.', 'Retirer le fichier');
  if (!ok) { return; }
  var avant = e.pj.slice();
  var apres = e.pj.filter(function (x) { return x !== pid; });
  e.pj = apres;
  rendreFiche();
  await ecrire([['UpdateRecord', etat.tables.el, e.id, { PIECES_JOINTES: ['L'].concat(apres) }]], 'Fichier retiré.', function () { return [['UpdateRecord', etat.tables.el, e.id, { PIECES_JOINTES: ['L'].concat(avant) }]]; });

/* === SECTION : SORTIES ===
   Impression et PDF par la fenetre d'impression (feuille A4 a l'italienne,
   toile ajustee a la page) ; image PNG construite a partir d'un SVG ; CSV des
   elements. */
function imprimer(pdf) {
  var t = tableauCourant();
  var p = document.getElementById('vPapier');
  if (p) { p.textContent = (t ? t.nom + ' - ' : '') + 'imprimé le ' + aujourdhui() + '. ' + (filtresActifs() ? 'Filtres appliqués : éléments estompés ou retirés.' : ''); }
  var style = document.getElementById('wStylePage');
  if (!style) { style = creer('style', { id: 'wStylePage' }); document.head.appendChild(style); }
  style.textContent = '@page { size: A4 landscape; margin: 10mm; }';
  var camAvant = etat.cam ? Object.assign({}, etat.cam) : null;
  var toile = document.getElementById('vToile');
  if (toile && etat.vueType === 'toile') {
    var b = boiteDe(elementsDuTableau());
    var lw = 1050, lh = 640;
    /* Place laissee a la legende en bas, si elle est affichee. */
    if (t && etat.affichage && etat.affichage.legende && t.legende.length) { lh -= t.legende.length * 22 + 50; }
    if (b) {
      var z = Math.min(1.2, lw / Math.max(1, b.x2 - b.x1 + 40), lh / Math.max(1, b.y2 - b.y1 + 40));
      etat.cam = { z: z, x: -b.x1 * z + 20 * z, y: -b.y1 * z + 30 * z };
    }
    toile.style.width = lw + 'px'; toile.style.height = lh + 'px'; toile.style.flex = 'none';
    appliquerCamera();
  }
  var fin = function () {
    window.removeEventListener('afterprint', fin);
    if (toile) { toile.style.width = ''; toile.style.height = ''; toile.style.flex = ''; }
    if (camAvant) { etat.cam = camAvant; appliquerCamera(); }
  };
  window.addEventListener('afterprint', fin);
  if (pdf) { afficherToast('Dans la fenêtre d\'impression, choisissez « Enregistrer au format PDF ».', null, 8000); }
  setTimeout(function () { window.print(); setTimeout(fin, 1500); }, pdf ? 400 : 50);
}

function champCsv(v) {
  var s = String(v === null || v === undefined ? '' : v);
  /* Une cellule qui commence par = + - @ tabulation ou retour chariot est
     neutralisee (injection de formule a l'ouverture dans un tableur), sauf
     un nombre pur. */
  if (/^[=+\-@\t\r]/.test(s) && !/^[-+]?\d+([.,]\d+)?$/.test(s)) { s = '\'' + s; }
  return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function nomFichier(ext) {
  var t = tableauCourant();
  var base = normaliserTexte(t ? t.nom : 'tableau blanc').replace(/ /g, '_') || 'tableau_blanc';
  return base + '_' + new Date().toISOString().slice(0, 10) + '.' + ext;
}

function exporterCsv() {
  var t = tableauCourant();
  var tous = elementsDuTableau();
  var lignes = [['Texte', 'Type', 'Forme', 'Couleur', 'Sens de la couleur', 'Section', 'Responsable', 'Statut', 'Votes', 'Fiche liée', 'Description', 'Connecteurs sortants', 'Commentaires'].join(';')];
  tous.filter(function (e) { return e.type !== 'Section'; }).sort(function (a, b) { return a.y - b.y || a.x - b.x; }).forEach(function (e) {
    var s = sectionDe(e, tous);
    var sortants = liensDuTableau().filter(function (l) { return l.de === e.id; }).map(function (l) { return (l.libelle ? l.libelle + ' : ' : '') + libelleCourt(etat.parId[l.vers]); }).join(' | ');
    var coms = commentairesDe(e.id).map(function (c) { return nomPersonne(c.auteur || c.creePar) + ' : ' + c.valeur; }).join(' | ');
    lignes.push([libelleAffiche(e), e.type, e.type === 'Forme' ? e.forme : '', nomCouleur(e.couleur), sensCouleur(e.couleur), s ? libelleCourt(s) : '', e.responsable, e.statut, compteVotes(e),
      e.ficheLigne ? texteLigneLiee(e.ficheTable, e.ficheLigne, colonneAffichee(e.ficheTable)) : '', e.description, sortants, coms].map(champCsv).join(';'));
  });
  telechargerBlob(new Blob(['﻿' + lignes.join('\r\n')], { type: 'text/csv;charset=utf-8' }), nomFichier('csv'));
  afficherToast(pluriel(lignes.length - 1, 'élément exporté', 'éléments exportés') + ' en CSV' + (t ? ' (« ' + t.nom + ' »)' : '') + '.');

/* Couleur calculee d'une variable du systeme de design : l'image PNG ne
   lit pas var(). */
function couleurResolue(expr) {
  var sonde = document.createElement('span');
  sonde.style.color = expr;
  sonde.hidden = true;
  document.body.appendChild(sonde);
  var c = getComputedStyle(sonde).color;
  document.body.removeChild(sonde);
  return c || 'rgb(0,0,0)';
}

function echapperXml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

/* Coupe un texte en lignes pour une largeur donnee (approximation de la
   largeur moyenne d'un caractere). */
function couperTexte(texte, largeur, taille) {
  var max = Math.max(4, Math.floor(largeur / (taille * 0.55)));
  var lignes = [];
  String(texte || '').split('\n').forEach(function (para) {
    var cour = '';
    para.split(/\s+/).forEach(function (m) {
      if (!m) { return; }
      if ((cour + ' ' + m).trim().length > max && cour) { lignes.push(cour); cour = m; } else { cour = (cour + ' ' + m).trim(); }
    });
    lignes.push(cour);
  });
  return lignes;
}

function construireSvgExport() {
  var tous = elementsDuTableau();
  var b = boiteDe(tous);
  if (!b) { return null; }
  var m = 30;
  var tl = tableauCourant(), basLeg = tl && etat.affichage && etat.affichage.legende && tl.legende.length ? tl.legende.length * 22 + 54 : 0;
  var W = Math.ceil(b.x2 - b.x1 + 2 * m), H = Math.ceil(b.y2 - b.y1 + 2 * m + basLeg);
  var ox = m - b.x1, oy = m - b.y1;
  var texte = couleurResolue('var(--text-default-grey)');
  var fondPage = couleurResolue('var(--background-alt-grey)');
  var parts = ['<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" font-family="Marianne, Arial, sans-serif">',
    '<rect width="' + W + '" height="' + H + '" fill="' + fondPage + '"/>',
    '<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="' + texte + '"/></marker></defs>'];
  var tries = tous.slice().sort(function (a, c) { return (a.type === 'Section' ? -1e9 : 0) + a.ordre - ((c.type === 'Section' ? -1e9 : 0) + c.ordre) || a.id - c.id; });
  var textes = [];
  var blancTxt = texte;

async function exporterImage() {
  var r = construireSvgExport();
  if (!r) { signalerSaisie('Le tableau blanc est vide : rien à exporter.'); return; }
  afficherLoader('Préparation de l\'image…');
  try {
    var echelle = Math.min(2, 8000 / Math.max(r.w, r.h));
    var url = URL.createObjectURL(new Blob([r.svg], { type: 'image/svg+xml' }));
    var img = new Image();
    await new Promise(function (ok, ko) { img.onload = ok; img.onerror = function () { ko(new Error('Image illisible')); }; img.src = url; });
    var cv = document.createElement('canvas');
    cv.width = Math.round(r.w * echelle); cv.height = Math.round(r.h * echelle);
    var ctx = cv.getContext('2d');
    ctx.scale(echelle, echelle);
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);
    var blob = await new Promise(function (ok) { cv.toBlob(ok, 'image/png'); });
    masquerLoader();
    if (!blob) { throw new Error('Image non produite'); }
    telechargerBlob(blob, nomFichier('png'));
    afficherToast('Image téléchargée.');
  } catch (e) { masquerLoader(); afficherErreur('L\'image n\'a pas pu être produite.', e); }
}

/* Plein ecran, ou « Agrandir » quand la plateforme le refuse. */
function basculerPleinEcran() {
  var dedans = !!document.fullscreenElement || etat.agrandi;
  if (dedans) {
    if (document.fullscreenElement && document.exitFullscreen) { relayer(document.exitFullscreen(), 'Plein écran'); }
    etat.agrandi = false;
    document.body.classList.remove('w-agrandi');
  } else {
    var ok = false;
    try { if (document.documentElement.requestFullscreen && document.fullscreenEnabled) { relayer(document.documentElement.requestFullscreen(), 'Plein écran'); ok = true; } }
    catch (e) { logSecurite('INFO', 'Plein écran refusé', e); }
    if (!ok) { etat.agrandi = true; document.body.classList.add('w-agrandi'); }
  }
  setTimeout(function () {
    var b = document.getElementById('bPlein');
    var actif = !!document.fullscreenElement || etat.agrandi;
    if (b) { b.setAttribute('data-bulle', actif ? 'Quitter le plein écran' : 'Plein écran'); var sr = b.querySelector('.fr-sr-only'); if (sr) { sr.textContent = actif ? 'Quitter le plein écran' : 'Plein écran'; } }
    appliquerCamera();

}

/* === SECTION : CONFIRMATION ===
   Confirmation dans la page. Resout true ou false. */
function elementsFocusables(racine) {
  return Array.prototype.filter.call(racine.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'),
    function (n) { return !n.disabled && n.offsetParent !== null; });
}

function fabriquerPiege(racine, fermer) {
  return function (e) {
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); fermer(); return; }
    if (e.key !== 'Tab') { return; }
    var f = elementsFocusables(racine);
    if (!f.length) { return; }
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  };
}

function confirmer(titre, message, libelleOui, opts) {
  opts = opts || {};
  return new Promise(function (resolve) {
    var ov = document.getElementById('wConfirmOverlay');
    if (_confirm.resolution) { _confirm.resolution(false); }
    _confirm.resolution = resolve;
    document.getElementById('wConfirmTitre').textContent = titre;
    document.getElementById('wConfirmMsg').textContent = message || '';
    var oui = document.getElementById('wConfirmOui');
    oui.textContent = libelleOui || 'Confirmer';
    oui.className = 'fr-btn' + (opts.danger ? ' w-btn-danger' : '');
    _confirm.retour = document.activeElement;
    ov.classList.add('actif');
    void ov.offsetHeight;
    if (_confirm.pieger) { ov.removeEventListener('keydown', _confirm.pieger); }
    _confirm.pieger = fabriquerPiege(ov, function () { terminerConfirmation(false); });
    ov.addEventListener('keydown', _confirm.pieger);
    document.getElementById(opts.danger || opts.destructif ? 'wConfirmNon' : 'wConfirmOui').focus();
  });
}

function terminerConfirmation(oui) {
  var ov = document.getElementById('wConfirmOverlay');
  ov.classList.remove('actif');
  if (_confirm.pieger) { ov.removeEventListener('keydown', _confirm.pieger); _confirm.pieger = null; }
  var r = _confirm.retour;
  _confirm.retour = null;
  if (r && document.body.contains(r) && typeof r.focus === 'function') { r.focus(); }
  var res = _confirm.resolution;
  _confirm.resolution = null;
  if (res) { res(!!oui); }
}

/* Contenu d'une etape en blocs numerotes (comme WuitOrganigramme) : sur
   fond gris, chaque rubrique titree devient une section blanche, son titre
   precede d'un numero. Les colonnes des editeurs sont decoupees a chaque
   titre. */
function enBlocs(noeuds, deux) {
  /* Mise en page commune de la serie : des colonnes explicites qui partent
     toutes du haut. Un tableau dans la liste = plusieurs blocs empiles dans

     l ordre, colonne par colonne ; un bloc large prend toute la largeur. */
  var n = 0;
  var groupes = [];
  noeuds.forEach(function (x) {
    if (!x) { return; }
    if (Array.isArray(x)) { groupes.push(x.filter(Boolean)); return; }
    if (x.classList.contains('w-grille-param')) { Array.prototype.slice.call(x.children).forEach(function (c) { groupes.push([c]); }); }
    else { groupes.push([x]); }
  });
  var estTitre = function (ch) { return !!(ch.firstChild && ch.firstChild.classList && ch.firstChild.classList.contains('w-titre-colonne-ligne')); };
  var nouvelle = function (titreDiv) {
    var sec = creer('section', { classe: 'w-section' });
    var h = titreDiv ? titreDiv.querySelector('.w-titre-colonne') : null;
    if (h) {
      n++;
      var libelle = h.textContent;
      h.insertBefore(creer('span', { classe: 'w-num', attrs: { 'aria-hidden': 'true' }, texte: String(n) }), h.firstChild);
      if (h.id) { sec.setAttribute('aria-labelledby', h.id); }

    var titres = enfants.filter(estTitre);
    if (titres.length <= 1) { var s1 = nouvelle(titres[0]); s1.appendChild(col); out.push(s1); return out; }
    var sec = null;
    enfants.forEach(function (ch) {
      if (estTitre(ch) || !sec) { sec = nouvelle(estTitre(ch) ? ch : null); out.push(sec); }
      sec.appendChild(ch);
    });
    return out;
  };
  var grille = function (cols, gab) {
    return creer('div', { classe: 'w-grille w-grille--' + gab }, cols.map(function (c) { return creer('div', { classe: 'w-grille__col' }, c); }));
  };
  if (groupes.length > 1) {
    var cols = groupes.map(function (g) { var l = []; g.forEach(function (c) { l = l.concat(sectionsDe(c)); }); return l; });
    return grille(cols, cols.length >= 3 ? '1-1-1' : (deux ? '2' : '1-1'));

  (groupes[0] || []).forEach(function (c) { secs = secs.concat(sectionsDe(c)); });

  var rangerLot = function () {
    if (!lot.length) { return; }
    var k = Math.min(lot.length, 3);
    var par = Math.ceil(lot.length / k);
    var cs = [];
    for (var i = 0; i < lot.length; i += par) { cs.push(lot.slice(i, i + par)); }
    bloc.appendChild(grille(cs, cs.length === 3 ? '1-1-1' : (cs.length === 2 ? '1-1' : '1')));
    lot = [];

  secs.forEach(function (s) {
    if (large(s)) { rangerLot(); bloc.appendChild(grille([[s]], '1')); }
    else { lot.push(s); }

  rangerLot();
  return bloc.children.length === 1 ? bloc.firstChild : bloc;

/* === SECTION : EDITEURS PARTAGES (creation et parametrage) ===

  };
  bloc.appendChild(titreColonne('Légende des couleurs', idBase + 'Titre', 'Le sens de chaque couleur : il s\'affiche sur la toile (case « Légende »), dans la fiche et dans la liste. On choisit la couleur d\'un élément dans sa barre d\'actions.'));
  var ul = creer('ul', { classe: 'w-legende-param', attrs: { 'aria-label': 'Couleurs de la légende' } });

    champ.addEventListener('input', function () { x.libelle = champ.value; apres(); majApercu(); });
    var sel = liste(idBase + 'Coul' + i, COULEURS.map(function (c) { return { valeur: c[0], libelle: c[1] }; }), x.couleur);
    sel.addEventListener('change', function () { x.couleur = sel.value; appliquerCouleur(pastille, sel.value); apres(); majApercu(); });
    var actions = creer('div', { classe: 'w-liste-cat__actions', attrs: { style: 'display:flex;gap:.25rem' } }, [
      bouton('Monter ' + (x.libelle || nomCouleur(x.couleur)), 'discret', 'arrow-up-line', function () { var t = cible.legende[i - 1]; cible.legende[i - 1] = x; cible.legende[i] = t; apres(); redessiner(idBase + 'Lib' + (i - 1)); }, { petit: true, iconeSeule: true, desactive: i === 0 }),
      bouton('Descendre ' + (x.libelle || nomCouleur(x.couleur)), 'discret', 'arrow-down-line', function () { var t = cible.legende[i + 1]; cible.legende[i + 1] = x; cible.legende[i] = t; apres(); redessiner(idBase + 'Lib' + (i + 1)); }, { petit: true, iconeSeule: true, desactive: i === cible.legende.length - 1 }),
      bouton('Retirer ' + (x.libelle || nomCouleur(x.couleur)), 'discret', 'delete-line', function () { cible.legende.splice(i, 1); apres(); redessiner(idBase + 'Ajouter'); }, { petit: true, iconeSeule: true, classe: 'w-bulle--droite' })]);
    ul.appendChild(creer('li', {}, [pastille, groupeChamp('Sens', champ), groupeListe('Couleur', sel), actions]));
  });
  if (!cible.legende.length) { ul.appendChild(creer('li', { classe: 'w-mention', texte: 'Aucune couleur dans la légende.' })); }
  bloc.appendChild(ul);
  bloc.appendChild(creer('div', {}, [bouton('Ajouter une couleur', 'secondaire', 'add-line', function () {
    var prises = cible.legende.map(function (x) { return x.couleur; });
    var libre = COULEURS.filter(function (c) { return prises.indexOf(c[0]) === -1; })[0];

/* Apercu en direct : une forme et un post-it par couleur de la legende. */
var _apercuCible = null;

    fiche: { table: '', colonne: '' }, source: { table: '', colonne: '', couleur: '' },
    affichage: Object.assign({}, AFFICHAGE_DEFAUT, MODELES[0].affichage), champs: Object.assign({}, CHAMPS_DEFAUT), filtres: Object.assign({}, FILTRES_DEFAUT) };
}

function ouvrirCreation(groupe) {
  if (!etat.peutParametrer) { return; }
  if (etat.edition) { terminerEdition(true); }
  etat.creation = nouveauReglage();
  var c = etat.creation;
  c.groupe = typeof groupe === 'string' ? groupe : '';
  if (c.groupe === 'vierge') { c.depart = 'modele'; choisirModele(c, 'vierge'); c.fiche = { table: '', colonne: '' }; c.etape = 1; }
  if (c.groupe === 'donnees') {
    var possibles = tablesUtilisatrice();
    if (possibles.length) {
      c.depart = 'donnees'; c.source.table = possibles[0]; c.source.colonne = colonneParDefaut(c.source.table);
      legendeDepuisSource(c); c.fiche = { table: c.source.table, colonne: c.source.colonne }; c.modele = 'donnees';
      c.affichage = Object.assign({}, AFFICHAGE_DEFAUT); c.traceDefaut = 'Droit';
    }
  }
  etat.vue = 'creation';
  rendreCreation();
  var t = document.getElementById('titreVue'); if (t) { t.focus(); }
  majAideEtape();
}

function choisirModele(c, cle) {
  var m = MODELES.filter(function (x) { return x.cle === cle; })[0];
  if (!m) { return; }
  c.modele = cle;
  c.legende = m.legende.map(function (x) { return { couleur: x[0], libelle: x[1] }; });
  c.jeu = '';
  appliquerJeuCreation(c, JEU_PAR_MODELE[cle] || '');
  c.affichage = Object.assign({}, AFFICHAGE_DEFAUT, m.affichage);
  c.traceDefaut = m.traceDefaut || 'Droit';
}

/* Jeu de couleurs en creation : legende du modele recoloree ; la
   correspondance sert aussi aux elements du modele (semer). */
function appliquerJeuCreation(c, cleJeu) {
  var m = MODELES.filter(function (x) { return x.cle === c.modele; })[0];
  var origine = m ? m.legende.map(function (x) { return x[0]; }) : (c.legendeOrigine || c.legende.map(function (x) { return x.couleur; }));
  if (!m && !c.legendeOrigine) { c.legendeOrigine = origine.slice(); }
  var carte = carteJeu(origine, cleJeu);
  c.jeu = cleJeu;
  c.carteCouleurs = carte;
  c.legende.forEach(function (x, i) { var o = origine[i]; if (o && carte[o]) { x.couleur = carte[o]; } else if (o && !cleJeu) { x.couleur = o; } });
}

    if (i > 0 && c.depart === 'donnees' && !c.source.table) { signalerSaisie('Choisissez la table de vos données.'); return; }

       plus loin sans lui. */

function nomPersonne(auteur) {

  if (a.indexOf('anonyme:') === 0) { return 'Invité ' + a.slice(-4).toUpperCase(); }

  try {
    var id = lirePref('presence:' + etat.tableauId, null);
    var existe = id && etat.participations.some(function (p) { return p.id === id && p.type === 'Présence'; });
    if (!existe || !etat.moi) { await assurerIdentite(); }
    else { await agir([['UpdateRecord', etat.tables.pa, id, { DATE: Date.now() }]]); }
  } catch (e) { logSecurite('INFO', 'Signal de présence non envoyé', e); }
  finally { _presenceEnCours = false; majPresents(); }
}

function presents() {
  var limite = Date.now() - DUREE_PRESENCE_MS;
  var vus = {}, l = [];
  participationsDu('Présence').forEach(function (p) {
    var a = p.auteur || p.creePar;
    if (!a || p.date < limite || vus[a]) { return; }
    vus[a] = true; l.push(a);
  });
  if (etat.moi && !vus[etat.moi] && participationActive()) { l.unshift(etat.moi); }
  return l;
}

function majPresents() {
  var ul = document.getElementById('vPresents');
  if (!ul) { return; }
  vider(ul);
  var l = presents();
  ul.hidden = !l.length;
  l.slice(0, 6).forEach(function (a) {
    var moi = a === etat.moi;
    ul.appendChild(creer('li', {}, [creer('span', { classe: 'w-present w-bulle' + (moi ? ' w-present--moi' : ''), texte: initiales(a),
      attrs: { 'data-bulle': nomPersonne(a) + (moi ? ' (vous)' : ''), tabindex: '0', 'aria-label': nomPersonne(a) + (moi ? ' (vous)' : '') } })]));
  });
  if (l.length > 6) { ul.appendChild(creer('li', {}, [creer('span', { classe: 'w-present', texte: '+' + (l.length - 6) })])); }
}

/* === SECTION : VOTES PAR PERSONNE === */
function votesDe(id) { return etat.participations.filter(function (p) { return p.type === 'Vote' && p.element === id; }); }
function compteVotes(e) { return (e.votes || 0) + votesDe(e.id).length; }
function mesVotes() { return etat.moi ? participationsDu('Vote').filter(function (p) { return p.auteur === etat.moi && etat.parId[p.element]; }) : []; }

function votesRestants() {
  var t = tableauCourant();
  if (!t || !t.votesParPersonne || !participationActive()) { return null; }
  return Math.max(0, t.votesParPersonne - mesVotes().length);
}

async function voter(e, sens) {
  if (!peutParticiper()) { return; }
  if (!etat.tables.pa) {
    /* Table de participation absente (mise a niveau pas encore faite) :
       compteur simple, comme en 1.0. */
    var n = Math.max(0, e.votes + sens);
    e.votes = n; rendreMonde(); majBarre();
    await ecrire([['UpdateRecord', etat.tables.el, e.id, { VOTES: n }]], null, null);
    return;
  }
  try {
    await assurerIdentite();
    var t = tableauCourant();
    if (sens > 0) {
      var restants = votesRestants();
      if (restants !== null && restants <= 0) { signalerSaisie('Vous avez utilisé vos ' + pluriel(t.votesParPersonne, 'vote', 'votes') + ' sur ce tableau blanc. Retirez un vote pour voter ailleurs.'); return; }
      await agir([['AddRecord', etat.tables.pa, null, { TABLEAU: etat.tableauId, TYPE: 'Vote', AUTEUR: etat.moi, ELEMENT: e.id, DATE: Date.now() }]]);
    } else {
      var mien = votesDe(e.id).filter(function (p) { return p.auteur === etat.moi; })[0];
      if (mien) { await agir([['RemoveRecord', etat.tables.pa, mien.id]]); }
      else if (e.votes > 0) { await agir([['UpdateRecord', etat.tables.el, e.id, { VOTES: e.votes - 1 }]]); }
      else { signalerSaisie('Vous n\'avez pas voté pour cet élément.'); return; }
    }
    etat.signature = '';
    await rafraichir(true);
    var r = votesRestants();
    annoncer(pluriel(compteVotes(etat.parId[e.id] || e), 'vote', 'votes') + '.' + (r !== null ? ' Il vous reste ' + pluriel(r, 'vote', 'votes') + '.' : ''));
    placerCtx();
  } catch (err) { erreurEcriture(err, 'Le vote n\'a pas été enregistré.'); }
}

async function reinitialiserVotes(t) {
  var ok = await confirmer('Remettre les votes à zéro ?', 'Tous les votes du tableau blanc « ' + t.nom + ' » sont supprimés, pour toutes les personnes. Cette action est définitive.', 'Remettre à zéro', { danger: true });
  if (!ok) { return; }
  try {
    var ids = etat.participations.filter(function (p) { return p.type === 'Vote' && p.tableau === t.id; }).map(function (p) { return p.id; });
    var els = etat.elements.filter(function (e) { return e.tableau === t.id && e.votes; });
    var a = [];
    if (ids.length) { a.push(['BulkRemoveRecord', etat.tables.pa, ids]); }
    if (els.length) { a.push(['BulkUpdateRecord', etat.tables.el, els.map(function (e) { return e.id; }), { VOTES: els.map(function () { return 0; }) }]); }
    if (a.length) { await agir(a); }
    etat.signature = '';
    await chargerDonnees();
    afficherToast('Votes remis à zéro.');
  } catch (e) { erreurEcriture(e, 'La remise à zéro n\'a pas abouti.'); }
}

/* === SECTION : MINUTEUR D'ATELIER ===
   Une ligne Minuteur par tableau : DATE = fin en millisecondes (0 = arrete).
   Chacun voit le compte a rebours ; l'heure de fin vient de la personne qui
   l'a lance. */
function ligneMinuteur() {
  var l = participationsDu('Minuteur');
  return l.length ? l[l.length - 1] : null;
}

function finMinuteur() { var m = ligneMinuteur(); return m ? m.date : 0; }

async function lancerMinuteur(minutes) {
  fermerPop();
  try {
    await assurerIdentite();
    var fin = minutes ? Date.now() + minutes * 60000 : 0;
    var m = ligneMinuteur();
    if (m) { await agir([['UpdateRecord', etat.tables.pa, m.id, { DATE: fin, VALEUR: String(minutes || 0), AUTEUR: etat.moi }]]); }
    else { await agir([['AddRecord', etat.tables.pa, null, { TABLEAU: etat.tableauId, TYPE: 'Minuteur', DATE: fin, VALEUR: String(minutes || 0), AUTEUR: etat.moi }]]); }
    etat.signature = '';
    await rafraichir(true);
    majMinuteur();
    annoncer(minutes ? 'Minuteur lancé : ' + pluriel(minutes, 'minute', 'minutes') + '.' : 'Minuteur arrêté.');
  } catch (e) { erreurEcriture(e, 'Le minuteur n\'a pas pu être lancé.'); }
}

function majMinuteur() {
  var z = document.getElementById('vMinuteur');
  if (!z) { return; }
  var fin = finMinuteur();
  var reste = fin - Date.now();
  if (!fin || reste < -60000) { z.hidden = true; return; }
  z.hidden = false;
  if (reste > 0) {
    var s = Math.ceil(reste / 1000);
    z.textContent = Math.floor(s / 60) + ':' + (s % 60 < 10 ? '0' : '') + (s % 60);
    z.classList.toggle('w-minuteur--fin', s <= 30);
    z.setAttribute('aria-label', 'Minuteur : ' + Math.floor(s / 60) + ' min ' + (s % 60) + ' s');
  } else {
    z.textContent = 'Temps écoulé';
    z.classList.add('w-minuteur--fin');
    if (etat.minuteurAnnonce !== fin) { etat.minuteurAnnonce = fin; afficherToast('Temps écoulé.', null, 8000); annoncer('Temps écoulé.'); }
  }
}

function ouvrirMinuteur(ancre) {
  var items = DUREES_MINUTEUR.map(function (m) {
    return creer('button', { classe: 'w-pop__item', texte: pluriel(m, 'minute', 'minutes'), clic: function () { return lancerMinuteur(m); } });
  });
  if (finMinuteur() > Date.now()) { items.push(creer('button', { classe: 'w-pop__item', texte: 'Arrêter le minuteur', clic: function () { return lancerMinuteur(0); } })); }
  ouvrirPopFixe(ancre, 'Minuteur', [creer('p', { classe: 'w-pop__titre', texte: 'Lancer un minuteur pour tous' })].concat(items));
}

/* Menu pose sous un bouton hors de la toile (barre au-dessus). */
function ouvrirPopFixe(ancre, titre, enfants) {
  var deja = etat.pop && etat.pop.genre === titre;
  fermerPop();
  if (deja) { return; }
  var pop = creer('div', { classe: 'w-pop', id: 'vPop', attrs: { role: 'dialog', 'aria-label': titre } }, enfants);
  pop.style.position = 'fixed';
  pop.addEventListener('keydown', function (e) { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); fermerPop(true); } });
  document.body.appendChild(pop);
  etat.pop = { genre: titre, retour: ancre };
  var r = ancre.getBoundingClientRect();
  pop.style.left = Math.max(4, Math.min(window.innerWidth - pop.offsetWidth - 4, r.right - pop.offsetWidth)) + 'px';
  pop.style.top = (r.bottom + 6) + 'px';
  var f = pop.querySelector('button, input, select'); if (f) { f.focus(); }
}

/* === SECTION : COMMENTAIRES === */
function commentairesDe(id) {
  return etat.participations.filter(function (p) { return p.type === 'Commentaire' && p.element === id; }).sort(function (a, b) { return a.date - b.date || a.id - b.id; });
}

function blocCommentaires(e) {
  var l = commentairesDe(e.id);
  var bloc = creer('div', { classe: 'fr-mb-2w' }, [creer('p', { classe: 'fr-label fr-mb-1v', texte: 'Commentaires' + (l.length ? ' (' + l.length + ')' : '') })]);
  var ul = creer('ul', { classe: 'w-commentaires' });
  if (!l.length) { ul.appendChild(creer('li', { classe: 'w-mention', texte: 'Aucun commentaire.' })); }
  l.forEach(function (c) {
    var date = c.date ? formaterDate(c.date / 1000) : formaterDate(c.creeLe);
    var peut = peutParticiper() && (c.auteur === etat.moi || etat.peutParametrer);
    ul.appendChild(creer('li', {}, [
      creer('div', { classe: 'w-commentaire__tete' }, [creer('strong', { texte: nomPersonne(c.auteur || c.creePar) }), creer('span', { classe: 'w-mention', texte: date }),
        peut ? bouton('Supprimer ce commentaire', 'discret', 'delete-line', function () { return supprimerCommentaire(c); }, { petit: true, iconeSeule: true, classe: 'w-bulle--droite' }) : null]),
      creer('p', { classe: 'w-commentaire__texte', texte: c.valeur })]));
  });
  bloc.appendChild(ul);
  if (peutParticiper() && etat.tables.pa) {
    var champ = saisie('fCommentaire', '', { multiligne: true, lignes: 2, indice: 'Votre commentaire' });
    bloc.appendChild(creer('label', { classe: 'fr-sr-only', attrs: { 'for': 'fCommentaire' }, texte: 'Nouveau commentaire' }));
    bloc.appendChild(champ);
    bloc.appendChild(creer('div', { classe: 'fr-mt-1w' }, [bouton('Ajouter le commentaire', 'secondaire', 'chat-3-line', function () { return ajouterCommentaire(e, champ.value); }, { petit: true, id: 'fCommenter' })]));
  }
  return bloc;
}

async function ajouterCommentaire(e, texte) {
  var t = String(texte || '').trim();
  if (!t) { marquerInvalide('fCommentaire', 'Écrivez votre commentaire.'); return; }
  try {
    await assurerIdentite();
    await agir([['AddRecord', etat.tables.pa, null, { TABLEAU: e.tableau, TYPE: 'Commentaire', AUTEUR: etat.moi, ELEMENT: e.id, VALEUR: t, DATE: Date.now() }]]);
    etat.signature = '';
    await rafraichir(true);
    rendreFiche();
    var f = document.getElementById('fCommentaire'); if (f) { f.focus(); }
    annoncer('Commentaire ajouté.');
  } catch (err) { erreurEcriture(err, 'Le commentaire n\'a pas été enregistré.'); }
}

async function supprimerCommentaire(c) {
  var ok = await confirmer('Supprimer le commentaire ?', '« ' + (c.valeur.length > 80 ? c.valeur.slice(0, 77) + '…' : c.valeur) + ' »', 'Supprimer le commentaire', { danger: true });
  if (!ok) { return; }
  try {
    await agir([['RemoveRecord', etat.tables.pa, c.id]]);
    etat.signature = '';
    await rafraichir(true);
    rendreFiche();
  } catch (e) { erreurEcriture(e, 'La suppression n\'a pas abouti.'); }
}

/* === SECTION : ALIGNER ET REPARTIR === */
var ALIGNEMENTS = [['gauche', 'Aligner à gauche'], ['centreH', 'Centrer horizontalement'], ['droite', 'Aligner à droite'],
  ['haut', 'Aligner en haut'], ['milieu', 'Centrer verticalement'], ['bas', 'Aligner en bas'],
  ['repartirH', 'Répartir horizontalement'], ['repartirV', 'Répartir verticalement']];

async function aligner(mode) {
  fermerPop(true);
  var sel = elementsSelectionnes();
  if (sel.length < 2) { return; }
  var depart = {};
  sel.forEach(function (e) { depart[e.id] = { x: e.x, y: e.y }; });
  var b = boiteDe(sel);
  if (mode === 'gauche') { sel.forEach(function (e) { e.x = b.x1; }); }
  if (mode === 'droite') { sel.forEach(function (e) { e.x = b.x2 - e.w; }); }
  if (mode === 'centreH') { sel.forEach(function (e) { e.x = Math.round((b.x1 + b.x2) / 2 - e.w / 2); }); }
  if (mode === 'haut') { sel.forEach(function (e) { e.y = b.y1; }); }
  if (mode === 'bas') { sel.forEach(function (e) { e.y = b.y2 - e.h; }); }
  if (mode === 'milieu') { sel.forEach(function (e) { e.y = Math.round((b.y1 + b.y2) / 2 - e.h / 2); }); }
  if (mode === 'repartirH' || mode === 'repartirV') {
    if (sel.length < 3) { signalerSaisie('Sélectionnez au moins trois éléments pour les répartir.'); return; }
    var h = mode === 'repartirH';
    var tri = sel.slice().sort(function (p, q) { return h ? p.x - q.x : p.y - q.y; });
    var total = tri.reduce(function (s, e) { return s + (h ? e.w : e.h); }, 0);
    var espace = ((h ? b.x2 - b.x1 : b.y2 - b.y1) - total) / (tri.length - 1);
    var pos = h ? b.x1 : b.y1;
    tri.forEach(function (e) { if (h) { e.x = Math.round(pos); pos += e.w + espace; } else { e.y = Math.round(pos); pos += e.h + espace; } });
  }
  rendreMonde();
  await enregistrerPositions(depart, 'Alignement');
}

/* === SECTION : REPERES MAGNETIQUES ===
   Pendant un deplacement, les bords et le centre de la selection
   s'accrochent a ceux des autres elements (6 points a l'ecran). */
function reperes(g, dx, dy) {
  var b = g.boite0;
  var seuil = 6 / etat.cam.z;
  var autres = elementsDuTableau().filter(function (e) { return !g.depart[e.id]; });
  var res = { dx: null, dy: null, lignes: [] };
  var meilleurX = seuil + 1, meilleurY = seuil + 1;
  var mx = [b.x1 + dx, (b.x1 + b.x2) / 2 + dx, b.x2 + dx], my = [b.y1 + dy, (b.y1 + b.y2) / 2 + dy, b.y2 + dy];
  autres.forEach(function (e) {
    [e.x, e.x + e.w / 2, e.x + e.w].forEach(function (o) {
      mx.forEach(function (m) { var d = Math.abs(m - o); if (d < meilleurX) { meilleurX = d; res.dx = dx + (o - m); res.lx = { x: o, e: e }; } });
    });
    [e.y, e.y + e.h / 2, e.y + e.h].forEach(function (o) {
      my.forEach(function (m) { var d = Math.abs(m - o); if (d < meilleurY) { meilleurY = d; res.dy = dy + (o - m); res.ly = { y: o, e: e }; } });
    });
  });
  return res;
}

function dessinerReperes(g, r) {
  effacerReperes();
  var monde = document.getElementById('vMonde');
  if (!monde) { return; }
  var b = { x1: g.boite0.x1 + (r.dx !== null ? r.dx : 0), y1: g.boite0.y1 + (r.dy !== null ? r.dy : 0) };
  b.x2 = b.x1 + (g.boite0.x2 - g.boite0.x1); b.y2 = b.y1 + (g.boite0.y2 - g.boite0.y1);
  if (r.dx !== null && r.lx) {
    var y1 = Math.min(b.y1, r.lx.e.y) - 10, y2 = Math.max(b.y2, r.lx.e.y + r.lx.e.h) + 10;
    var v = creer('div', { classe: 'w-repere' }); v.style.left = r.lx.x + 'px'; v.style.top = y1 + 'px'; v.style.width = '1px'; v.style.height = (y2 - y1) + 'px';
    monde.appendChild(v);
  }
  if (r.dy !== null && r.ly) {
    var x1 = Math.min(b.x1, r.ly.e.x) - 10, x2 = Math.max(b.x2, r.ly.e.x + r.ly.e.w) + 10;
    var hz = creer('div', { classe: 'w-repere' }); hz.style.left = x1 + 'px'; hz.style.top = r.ly.y + 'px'; hz.style.height = '1px'; hz.style.width = (x2 - x1) + 'px';
    monde.appendChild(hz);
  }
}

function effacerReperes() {
  var m = document.getElementById('vMonde');
  if (m) { Array.prototype.slice.call(m.querySelectorAll('.w-repere')).forEach(function (n) { m.removeChild(n); }); }
}

/* === SECTION : IMAGES SUR LA TOILE ===
   Le fichier est une piece jointe de l'element (PIECES_JOINTES) ; il est lu
   par le widget avec un jeton demande juste avant, et garde en memoire
   (adresse locale de blob) pendant la session. */
var _images = {};
function chargerImage(id) {
  if (_images[id]) { return _images[id]; }
  _images[id] = (async function () {
    var j = await obtenirJeton(_jetonComplet);
    var rep = await fetch(j.baseUrl + '/attachments/' + id + '/download?auth=' + encodeURIComponent(j.token));
    if ((rep.status === 401 || rep.status === 403) && !_jetonComplet) {
      _jetonComplet = true;
      j = await obtenirJeton(true);
      rep = await fetch(j.baseUrl + '/attachments/' + id + '/download?auth=' + encodeURIComponent(j.token));
    }
    if (!rep.ok) { throw new Error('Image refusée : ' + rep.status); }
    var blob = await rep.blob();
    if (!/^image\/(png|jpeg|gif|webp)$/.test(blob.type) && !(await signatureImage(blob))) { throw new Error('Fichier qui n\'est pas une image'); }
    return URL.createObjectURL(blob);
  })();
  _images[id].catch(function (e) { logSecurite('AVERTISSEMENT', 'Image ' + id + ' illisible', e); });
  return _images[id];
}

/* Signature des premiers octets : PNG, JPEG, GIF ou WEBP. */
async function signatureImage(blob) {
  var b = new Uint8Array(await blob.slice(0, 12).arrayBuffer());
  var h = function (i, v) { return b[i] === v; };
  if (h(0, 0x89) && h(1, 0x50) && h(2, 0x4E) && h(3, 0x47)) { return 'png'; }
  if (h(0, 0xFF) && h(1, 0xD8) && h(2, 0xFF)) { return 'jpeg'; }
  if (h(0, 0x47) && h(1, 0x49) && h(2, 0x46)) { return 'gif'; }
  if (h(0, 0x52) && h(1, 0x49) && h(2, 0x46) && h(3, 0x46) && h(8, 0x57) && h(9, 0x45) && h(10, 0x42) && h(11, 0x50)) { return 'webp'; }
  return null;
}

function afficherImage(img, id) {
  chargerImage(id).then(function (url) { img.src = url; img.classList.remove('w-image--attente'); }, function () {
    img.alt = 'Image illisible'; img.classList.add('w-image--erreur');
  });
}

function demanderImage(pos) {
  etat.imagePos = pos;
  var f = document.getElementById('wFichierImage');
  if (!f) {
    f = creer('input', { id: 'wFichierImage', classe: 'fr-sr-only', attrs: { type: 'file', accept: 'image/png,image/jpeg,image/gif,image/webp', tabindex: '-1', 'aria-hidden': 'true' } });
    f.addEventListener('change', function () {
      var fichier = f.files && f.files[0];
      f.value = '';
      if (fichier) { relayer(recevoirImage(fichier, etat.imagePos), 'Image'); }
    });
    document.body.appendChild(f);
  }
  f.click();
}

/* Image deposee ou collee : controle du type (extension, type annonce,
   octets), envoi, puis element a la taille de l'image (bornee). */
async function recevoirImage(fichier, pos) {
  if (!etat.peutModifier) { return; }
  var ext = String(fichier.name || 'image.png').split('.').pop().toLowerCase();
  var sig = await signatureImage(fichier);
  if (!sig || (fichier.name && EXTENSIONS_IMAGES.indexOf(ext) === -1) || (fichier.type && !/^image\//.test(fichier.type))) { signalerSaisie('Seules les images PNG, JPEG, GIF ou WEBP sont acceptées.'); return; }
  if (fichier.size > TAILLE_MAX_IMAGE) { signalerSaisie('L\'image dépasse ' + tailleLisible(TAILLE_MAX_IMAGE) + '.'); return; }
  afficherLoader('Envoi de l\'image…');
  try {
    var w = 320, h = 220;
    try {
      var bm = await createImageBitmap(fichier);
      var k = Math.min(1, 360 / Math.max(bm.width, bm.height));
      w = Math.max(40, Math.round(bm.width * k)); h = Math.max(40, Math.round(bm.height * k));
      if (bm.close) { bm.close(); }
    } catch (e) { logSecurite('INFO', 'Taille de l\'image non lue', e); }
    var ids = await televerser([fichier.name ? fichier : new File([fichier], 'image.' + sig, { type: 'image/' + sig })]);
    masquerLoader();
    if (!ids.length) { throw new Error('Aucun identifiant de pièce jointe'); }
    var p = pos || centreVue();
    await creerElement('Image', { x: aimanter(p.x - w / 2), y: aimanter(p.y - h / 2), w: w, h: h }, false, { PIECES_JOINTES: ['L'].concat(ids), COULEUR: 'blanc' });
  } catch (e) { masquerLoader(); erreurEcriture(e, 'L\'image n\'a pas pu être ajoutée.'); }
}

/* Envoi de fichiers en pieces jointes ; renvoie leurs identifiants. */
async function televerser(fichiers) {
  var ids = [];
  for (var k = 0; k < fichiers.length; k++) {
    var j = await obtenirJeton(true);
    var form = new FormData();
    form.append('upload', fichiers[k], fichiers[k].name);
    var rep = await fetch(j.baseUrl + '/attachments?auth=' + encodeURIComponent(j.token), { method: 'POST', body: form, headers: { 'X-Requested-With': 'XMLHttpRequest' } });
    if (!rep.ok) { throw new Error('Envoi refusé : ' + rep.status); }
    var r = await rep.json();
    (Array.isArray(r) ? r : []).forEach(function (x) { if (typeof x === 'number') { ids.push(x); } });
  }
  return ids;
}

function centreVue() { var ts = tailleToile(); return versMonde({ x: ts.w / 2, y: ts.h / 2 }); }

/* === SECTION : COPIER, COUPER, COLLER ===
   Presse-papiers propre au widget (navigateur) : on colle dans un autre
   tableau blanc, ou un autre document (sans fiche liee ni fichier). */

var _collageTraite = false;

  if (etat.vue !== 'principal' || etat.edition) { return; }
  var cible = ev.target;
  if (cible && cible.closest && (cible.closest('input, textarea, select, .w-fiche, .w-volet') || cible.isContentEditable)) { return; }
  var items = ev.clipboardData && ev.clipboardData.items ? Array.prototype.slice.call(ev.clipboardData.items) : [];
  var image = items.filter(function (i) { return i.kind === 'file' && /^image\//.test(i.type); })[0];
  if (image && etat.peutModifier) {
    ev.preventDefault();

    if (etat.vueType !== 'toile') { changerVue('toile'); }

/* ==========================================================================
   SECTION : IMPORTER UN SCHEMA (1.5.0)
   Un schema ecrit au format texte Mermaid (flowchart / graph) devient des
   formes, des connecteurs et des sections, ranges automatiquement de haut en
   bas (ou de gauche a droite). Sert a reprendre un schema fait dans un autre
   outil sans tout redessiner.
   ========================================================================== */

/* Formes Mermaid -> formes du widget. L'ordre compte : les delimiteurs les
   plus longs d'abord. */
var MERMAID_FORMES = [
  ['([', '])', 'Pilule'], ['[[', ']]', 'Rectangle'], ['[(', ')]', 'Cylindre'], ['((', '))', 'Cercle'],
  ['{{', '}}', 'Hexagone'], ['[/', '\\]', 'Trapèze'], ['[/', '/]', 'Parallélogramme'], ['[\\', '\\]', 'Parallélogramme'],
  ['>', ']', 'Document'], ['{', '}', 'Losange'], ['[', ']', 'Rectangle'], ['(', ')', 'Rectangle']
];

function nettoyerTexteMermaid(t) {
  t = String(t || '').trim();
  if (t.length >= 2 && t.charAt(0) === '"' && t.charAt(t.length - 1) === '"') { t = t.slice(1, -1); }
  return t.replace(/<br\s*\/?>/gi, ' ').replace(/\\n/g, ' ').replace(/#quot;/g, '"').replace(/\s+/g, ' ').trim();
}

/* Lit un noeud en tete de chaine : identifiant puis forme et texte
   facultatifs. Renvoie { id, texte, forme, reste } ou null. */
function lireNoeudMermaid(s) {
  var m = /^\s*([A-Za-z0-9_À-ÿ][\wÀ-ÿ.-]*)/.exec(s);
  if (!m) { return null; }
  var id = m[1], reste = s.slice(m[0].length), texte = null, forme = null;
  for (var k = 0; k < MERMAID_FORMES.length; k++) {
    var f = MERMAID_FORMES[k];
    if (reste.indexOf(f[0]) === 0) {
      var fin = reste.indexOf(f[1], f[0].length);
      if (fin === -1) { continue; }
      /* Texte entre guillemets : la fermeture est apres le guillemet. */
      var dedans = reste.slice(f[0].length);
      if (dedans.charAt(0) === '"') {
        var q = dedans.indexOf('"', 1);
        if (q !== -1) { var fin2 = reste.indexOf(f[1], f[0].length + q + 1); if (fin2 !== -1) { fin = fin2; } }
      }
      texte = nettoyerTexteMermaid(reste.slice(f[0].length, fin));
      forme = f[2];
      reste = reste.slice(fin + f[1].length);
      break;
    }
  }
  reste = reste.replace(/^:::[\w-]+/, '');
  return { id: id, texte: texte, forme: forme, reste: reste };
}

/* Lit un connecteur en tete de chaine. Formes reconnues : -->, ---, -.->,
   ==>, avec libelle « -- texte --> » ou « -->|texte| ». */
function lireLienMermaid(s) {
  var m = /^\s*(<?)(-{2,}|={2,}|-\.+-?)(>|-|x|o)?\s*/.exec(s);
  var libelle = '', pointille = false, fleche = 'Vers la fin', reste;
  if (m) {
    reste = s.slice(m[0].length);
    pointille = m[2].indexOf('.') !== -1;
    /* « -- texte --> » : le premier « -- » ouvre un libelle. */
    if (!m[3] && /^-{2}$/.test(m[2])) {
      var m2 = /^([^-=>|]+?)\s*(-{2,}|-\.+-?)(>|-)?\s*/.exec(reste);
      if (m2 && !/^[\wÀ-ÿ]+[\[({>]/.test(m2[1])) {
        libelle = nettoyerTexteMermaid(m2[1]);
        reste = reste.slice(m2[0].length);
        if (!m2[3] || m2[3] === '-') { fleche = 'Sans flèche'; }
        if (m2[2].indexOf('.') !== -1) { pointille = true; }
        if (m[1]) { fleche = 'Dans les deux sens'; }
        return { libelle: libelle, pointille: pointille, fleche: fleche, reste: reste };
      }
    }
    if (!m[3] || m[3] === '-') { fleche = 'Sans flèche'; }
    if (m[1]) { fleche = 'Dans les deux sens'; }
  } else {
    var m3 = /^\s*--\s*(.+?)\s*(-->|-\.->|==>)\s*/.exec(s);
    if (!m3) { return null; }
    libelle = nettoyerTexteMermaid(m3[1]);
    reste = s.slice(m3[0].length);
  }
  var lb = /^\|([^|]*)\|\s*/.exec(reste);
  if (lb) { libelle = nettoyerTexteMermaid(lb[1]); reste = reste.slice(lb[0].length); }
  return { libelle: libelle, pointille: pointille, fleche: fleche, reste: reste };
}

/* Analyse complete. Renvoie { sens, noeuds: [{id, texte, forme, groupe}],
   liens: [{de, vers, libelle, pointille, fleche}], groupes: [{id, titre}],
   ignorees: n }. */
function analyserMermaid(source) {
  var res = { sens: 'TD', noeuds: [], liens: [], groupes: [], ignorees: 0 };
  var parId = {};
  var pile = [];
  var noeud = function (n) {
    var x = parId[n.id];
    if (!x) { x = { id: n.id, texte: n.id, forme: 'Rectangle', groupe: pile.length ? pile[pile.length - 1] : null, defini: false }; parId[n.id] = x; res.noeuds.push(x); }
    if (n.texte !== null && n.texte !== undefined) { x.texte = n.texte || n.id; x.defini = true; }
    if (n.forme) { x.forme = n.forme; }
    if (!x.groupe && pile.length) { x.groupe = pile[pile.length - 1]; }
    return x;
  };
  String(source || '').replace(/\r/g, '').split(/\n|;(?=\s*(?:$|[A-Za-z]))/).forEach(function (ligne) {
    var l = ligne.replace(/%%.*$/, '').trim();
    if (!l) { return; }
    var mt = /^(flowchart|graph)\s+(TD|TB|BT|LR|RL)?/i.exec(l);
    if (mt) { res.sens = (mt[2] || 'TD').toUpperCase() === 'LR' || (mt[2] || '').toUpperCase() === 'RL' ? 'LR' : 'TD'; return; }
    var ms = /^subgraph\s+(.+)$/i.exec(l);
    if (ms) {
      var brut = ms[1].trim(), gid = brut, titre = brut;
      var mg = /^([\wÀ-ÿ.-]+)\s*\[(.+)\]$/.exec(brut);
      if (mg) { gid = mg[1]; titre = mg[2]; }
      titre = nettoyerTexteMermaid(titre);
      var g = { id: gid + '#' + res.groupes.length, titre: titre, parent: pile.length ? pile[pile.length - 1] : null };
      res.groupes.push(g);
      pile.push(g.id);
      return;
    }
    if (/^end$/i.test(l)) { pile.pop(); return; }
    if (/^(classDef|class|style|linkStyle|click|direction|accTitle|accDescr)\b/i.test(l)) { return; }
    /* Une chaine : noeud (lien noeud)* ; « A & B --> C » : chaque cote. */
    var reste = l, gauche = null, ok = false;
    var lireCote = function () {
      var cote = [];
      while (true) {
        var n = lireNoeudMermaid(reste);
        if (!n) { return cote; }
        cote.push(noeud(n));
        reste = n.reste;
        var amp = /^\s*&\s*/.exec(reste);
        if (!amp) { return cote; }
        reste = reste.slice(amp[0].length);
      }
    };
    gauche = lireCote();
    if (!gauche.length) { res.ignorees++; return; }
    ok = true;
    while (reste.trim()) {
      var lien = lireLienMermaid(reste);
      if (!lien) { if (reste.trim()) { res.ignorees++; } break; }
      reste = lien.reste;
      var droite = lireCote();
      if (!droite.length) { res.ignorees++; break; }
      gauche.forEach(function (a) { droite.forEach(function (b) { res.liens.push({ de: a.id, vers: b.id, libelle: lien.libelle, pointille: lien.pointille, fleche: lien.fleche }); }); });
      gauche = droite;
    }
    if (!ok) { res.ignorees++; }
  });
  return res;
}

/* Taille d'une forme selon son texte. */
function tailleImport(n) {
  var len = String(n.texte || '').length;
  if (n.forme === 'Losange') { return { w: Math.max(150, Math.min(220, 90 + len * 4)), h: Math.max(96, Math.min(140, 70 + len * 1.2)) }; }
  if (n.forme === 'Cercle') { return { w: 110, h: 110 }; }
  if (n.forme === 'Pilule') { return { w: Math.max(150, Math.min(240, 40 + len * 6.5)), h: 56 }; }
  var w = Math.max(150, Math.min(240, 40 + len * 6.5));
  var lignes = Math.ceil((len * 7.2) / (w - 24));
  return { w: w, h: Math.max(60, Math.min(140, 24 + lignes * 18)) };
}

/* Rangement en couches (de haut en bas) : rang = plus long chemin depuis
   une source en ignorant les retours en arriere ; ordre dans chaque couche
   par groupe puis par barycentre des voisins ; positions centrees. */
function rangerGraphe(noeuds, liens, sens, groupes) {
  var parId = {}; noeuds.forEach(function (n, i) { n._i = i; parId[n.id] = n; });
  var succ = {}, pred = {};
  noeuds.forEach(function (n) { succ[n.id] = []; pred[n.id] = []; });
  /* Retours en arriere reperes par un parcours en profondeur. */
  var etatV = {}, retour = {};
  var visiter = function (id) {
    etatV[id] = 1;
    liens.forEach(function (l, k) {
      if (l.de !== id || !parId[l.vers]) { return; }
      if (etatV[l.vers] === 1) { retour[k] = true; return; }
      if (!etatV[l.vers]) { visiter(l.vers); }
    });
    etatV[id] = 2;
  };
  noeuds.forEach(function (n) { if (!etatV[n.id] && !liens.some(function (l) { return l.vers === n.id; })) { visiter(n.id); } });
  noeuds.forEach(function (n) { if (!etatV[n.id]) { visiter(n.id); } });
  liens.forEach(function (l, k) { if (!retour[k] && parId[l.de] && parId[l.vers] && l.de !== l.vers) { succ[l.de].push(l.vers); pred[l.vers].push(l.de); } });
  /* Rangs. */
  var rang = {}, ordreTopo = [], vus = {};
  var topo = function (id) { if (vus[id]) { return; } vus[id] = true; pred[id].forEach(topo); ordreTopo.push(id); };
  noeuds.forEach(function (n) { topo(n.id); });
  ordreTopo.forEach(function (id) { rang[id] = pred[id].length ? Math.max.apply(null, pred[id].map(function (p) { return rang[p] + 1; })) : 0; });
  /* Un groupe (zone) garde ses noeuds sous ceux des zones precedentes :
     les rangs d'un groupe commencent apres la fin du groupe d'avant quand
     le schema enchaine les zones. */
  var ordreGroupe = {}; (groupes || []).forEach(function (g, i) { ordreGroupe[g.id] = i; });
  var couches = [];
  noeuds.forEach(function (n) { (couches[rang[n.id]] = couches[rang[n.id]] || []).push(n); });
  couches = couches.filter(Boolean);
  couches.forEach(function (c) { c.sort(function (a, b) { return (ordreGroupe[a.groupe] || 0) - (ordreGroupe[b.groupe] || 0) || a._i - b._i; }); });
  /* Barycentres (quelques passes descendantes puis montantes). */
  var pos = {};
  var numeroter = function () { couches.forEach(function (c) { c.forEach(function (n, i) { pos[n.id] = i; }); }); };
  numeroter();
  for (var passe = 0; passe < 4; passe++) {
    var desc = passe % 2 === 0;
    var liste = desc ? couches : couches.slice().reverse();
    liste.forEach(function (c) {
      c.forEach(function (n) {
        var v = desc ? pred[n.id] : succ[n.id];
        n._b = v.length ? v.reduce(function (s, x) { return s + pos[x]; }, 0) / v.length : pos[n.id];
      });
      c.sort(function (a, b) { return (ordreGroupe[a.groupe] || 0) - (ordreGroupe[b.groupe] || 0) || a._b - b._b; });
      c.forEach(function (n, i) { pos[n.id] = i; });
    });
  }
  /* Positions : couches espacees selon la plus grande forme ; dans une
     couche, formes cote a cote, la couche centree sous la precedente. */
  var ecartCouche = 70, ecartFrere = 60;
  var y = 0, groupesAvant = null;
  couches.forEach(function (c) {
    /* Changement de zone : place pour le bas du cadre precedent et le
       bandeau de titre du suivant. */
    var gs = c.map(function (n) { return n.groupe || ''; });
    if (groupesAvant && gs.some(function (x) { return groupesAvant.indexOf(x) === -1; })) { y += 100; }
    groupesAvant = gs;
    var hMax = Math.max.apply(null, c.map(function (n) { return sens === 'LR' ? n.w : n.h; }));
    var largeur = c.reduce(function (s, n) { return s + (sens === 'LR' ? n.h : n.w); }, 0) + ecartFrere * (c.length - 1);
    /* Centre vise : moyenne des centres des predecesseurs deja places. */
    var centres = c.map(function (n) { var p = pred[n.id].filter(function (x) { return parId[x]._place; }); return p.length ? p.reduce(function (s, x) { return s + parId[x]._c; }, 0) / p.length : null; });
    var connus = centres.filter(function (v) { return v !== null; });
    var cible = connus.length ? connus.reduce(function (s, v) { return s + v; }, 0) / connus.length : 0;
    var x = cible - largeur / 2;
    c.forEach(function (n) {
      var l = sens === 'LR' ? n.h : n.w;
      n._c = x + l / 2; n._place = true;
      if (sens === 'LR') { n.x = y + (hMax - n.w) / 2; n.y = x; } else { n.x = x; n.y = y + (hMax - n.h) / 2; }
      x += l + ecartFrere;
    });
    y += hMax + ecartCouche;
  });
  /* Aligner sur la grille. */
  noeuds.forEach(function (n) { n.x = Math.round(n.x / 20) * 20; n.y = Math.round(n.y / 20) * 20; });
}

/* Rangement complet :
   - les notes (elements relies seulement par des traits sans fleche, comme
     une bulle « Attention ») sont posees a cote de leur element ;
   - chaque partie independante du schema est rangee a part, puis les
     parties sont mises cote a cote. */
function rangerTout(g) {
  var fleches = function (l) { return l.fleche !== 'Sans flèche'; };
  var notes = {};
  g.noeuds.forEach(function (n) {
    var ls = g.liens.filter(function (l) { return l.de === n.id || l.vers === n.id; });
    if (ls.length && ls.every(function (l) { return !fleches(l); })) { notes[n.id] = ls.map(function (l) { return l.de === n.id ? l.vers : l.de; })[0]; }
  });
  var corps = g.noeuds.filter(function (n) { return !notes[n.id]; });
  var liensCorps = g.liens.filter(function (l) { return fleches(l) && !notes[l.de] && !notes[l.vers]; });
  /* Parties independantes (composantes connexes). */
  var comp = {}, n0 = 0;
  corps.forEach(function (n) {
    if (comp[n.id] !== undefined) { return; }
    var file = [n.id]; comp[n.id] = n0;
    while (file.length) {
      var x = file.shift();
      liensCorps.forEach(function (l) {
        var y = l.de === x ? l.vers : (l.vers === x ? l.de : null);
        if (y !== null && comp[y] === undefined) { comp[y] = n0; file.push(y); }
      });
    }
    n0++;
  });
  var decalage = 0;
  for (var c = 0; c < n0; c++) {
    var ns = corps.filter(function (n) { return comp[n.id] === c; });
    var ls = liensCorps.filter(function (l) { return comp[l.de] === c; });
    rangerGraphe(ns, ls, g.sens, g.groupes);
    var b = boiteDe(ns.map(function (n) { return { x: n.x, y: n.y, w: n.w, h: n.h }; }));
    ns.forEach(function (n) {
      if (g.sens === 'LR') { n.x -= b.x1; n.y += decalage - b.y1; } else { n.x += decalage - b.x1; n.y -= b.y1; }
    });
    decalage += (g.sens === 'LR' ? b.y2 - b.y1 : b.x2 - b.x1) + 240;
  }
  /* Notes a cote de leur element, sans chevaucher. */
  var parId = {}; g.noeuds.forEach(function (n) { parId[n.id] = n; });
  var places = corps.slice();
  var libre = function (x, y, w, h) { return !places.some(function (m) { return x < m.x + m.w + 20 && m.x < x + w + 20 && y < m.y + m.h + 20 && m.y < y + h + 20; }); };
  g.noeuds.forEach(function (n) {
    if (!notes[n.id]) { return; }
    var p = parId[notes[n.id]];
    if (!p || p.x === undefined) { n.x = 0; n.y = 0; places.push(n); return; }
    var essais = [[p.x + p.w + 60, p.y], [p.x - n.w - 60, p.y], [p.x + p.w + 60, p.y - n.h - 20], [p.x + p.w + 60, p.y + p.h + 20]];
    var choisi = essais.filter(function (e) { return libre(e[0], e[1], n.w, n.h); })[0] || [p.x + p.w + 60, p.y];
    n.x = Math.round(choisi[0] / 20) * 20; n.y = Math.round(choisi[1] / 20) * 20;
    if (!n.groupe) { n.groupe = p.groupe; }
    places.push(n);
  });
}

/* Couleur selon la forme, d'apres la legende du tableau (sens des
   libelles), sinon des couleurs par defaut. */
function couleurImport(t, forme) {
  var cherche = function (re) { var l = t.legende.filter(function (x) { return re.test(normaliserTexte(x.libelle || '')); })[0]; return l ? l.couleur : null; };
  if (forme === 'Pilule' || forme === 'Cercle') { return cherche(/debut|fin/) || 'green-menthe'; }
  if (forme === 'Losange') { return cherche(/decision|question|choix/) || 'yellow-tournesol'; }
  if (forme === 'Cylindre' || forme === 'Hexagone') { return cherche(/systeme|application|donnee/) || 'blue-ecume'; }
  return cherche(/etape|action|tache/) || 'blanc';
}

async function importerMermaid(source) {
  var t = tableauCourant();
  if (!t) { return; }
  var g = analyserMermaid(source);
  if (!g.noeuds.length) { signalerSaisie('Aucune étape reconnue. Le texte doit commencer par « flowchart TD » (ou « graph TD ») et décrire des étapes, par exemple : A[Début] --> B{Décision ?}'); return false; }
  if (g.noeuds.length > 400) { signalerSaisie('Ce schéma dépasse 400 étapes : découpez-le en plusieurs tableaux blancs.'); return false; }
  g.noeuds.forEach(function (n) { var s = tailleImport(n); n.w = s.w; n.h = s.h; });
  rangerTout(g);
  /* Sections : boite de leurs noeuds (et sous-groupes), marge pour le
     bandeau de titre. */
  var boites = {};
  var boiteGroupe = function (gid) {
    if (boites[gid]) { return boites[gid]; }
    var membres = g.noeuds.filter(function (n) { return n.groupe === gid; }).map(function (n) { return { x: n.x, y: n.y, w: n.w, h: n.h }; });
    g.groupes.filter(function (x) { return x.parent === gid; }).forEach(function (x) { var b = boiteGroupe(x.id); if (b) { membres.push(b); } });
    if (!membres.length) { return null; }
    var bb = boiteDe(membres);
    boites[gid] = { x: bb.x1 - 30, y: bb.y1 - 56, w: bb.x2 - bb.x1 + 60, h: bb.y2 - bb.y1 + 86 };
    return boites[gid];
  };
  /* Placement a droite du contenu existant. */
  var existant = elementsDuTableau();
  var dx = 0, dy = 0;
  var tous = g.noeuds.map(function (n) { return { x: n.x, y: n.y, w: n.w, h: n.h }; });
  g.groupes.forEach(function (x) { var b = boiteGroupe(x.id); if (b) { tous.push(b); } });
  var bImport = boiteDe(tous);
  if (existant.length) { var bEx = boiteDe(existant); dx = bEx.x2 + 160 - bImport.x1; dy = bEx.y1 - bImport.y1; }
  else { dx = -bImport.x1; dy = -bImport.y1; }
  var couleursSec = ['blue-ecume', 'purple-glycine', 'orange-terre-battue', 'green-menthe', 'blue-cumulus', 'pink-macaron'];
  var lot = [];
  g.groupes.forEach(function (x, i) {
    var b = boites[x.id];
    if (!b) { return; }
    lot.push({ TABLEAU: t.id, TYPE: 'Section', FORME: 'Cadre', LIBELLE: x.titre, COULEUR: couleursSec[i % couleursSec.length], POSITION_X: Math.round(b.x + dx), POSITION_Y: Math.round(b.y + dy), LARGEUR: Math.round(b.w), HAUTEUR: Math.round(b.h), ORDRE: 0 });
  });
  var nSec = lot.length;
  var ordre0 = existant.reduce(function (m, e) { return Math.max(m, e.ordre || 0); }, 0);
  g.noeuds.forEach(function (n, i) {
    lot.push({ TABLEAU: t.id, TYPE: 'Forme', FORME: n.forme, LIBELLE: n.texte, COULEUR: couleurImport(t, n.forme), POSITION_X: Math.round(n.x + dx), POSITION_Y: Math.round(n.y + dy), LARGEUR: Math.round(n.w), HAUTEUR: Math.round(n.h), ORDRE: ordre0 + i + 1 });
  });
  afficherLoader('Import du schéma…');
  try {
    var r = await agir([actionAjoutLot(etat.tables.el, lot)]);
    var ids = r && r.retValues ? r.retValues[0] : [];
    var idDe = {};
    g.noeuds.forEach(function (n, i) { idDe[n.id] = ids[nSec + i]; });
    var avecTrace = !!infoColonne(etat.tables.li, 'TRACE');
    var liens = g.liens.filter(function (l) { return idDe[l.de] && idDe[l.vers] && l.de !== l.vers; }).map(function (l) {
      var x = { TABLEAU: t.id, DE: idDe[l.de], VERS: idDe[l.vers], LIBELLE: l.libelle || '', STYLE: l.pointille ? 'Pointillés' : 'Plein', FLECHE: l.fleche };
      if (avecTrace) { x.TRACE = 'Coudé'; }
      return x;
    });
    var idsLiens = [];
    if (liens.length) { var rl = await agir([actionAjoutLot(etat.tables.li, liens)]); idsLiens = rl && rl.retValues ? rl.retValues[0] : []; }
    masquerLoader();
    etat.signature = '';
    await rafraichir(true);
    var tousIds = ids.slice();
    var b = boiteDe(lot.map(function (e) { return { x: e.POSITION_X + 0, y: e.POSITION_Y, w: e.LARGEUR, h: e.HAUTEUR }; }));
    if (b) { cadrerSur(b); }
    proposerAnnulation(pluriel(g.noeuds.length, 'étape importée', 'étapes importées') + ', ' + pluriel(liens.length, 'connecteur', 'connecteurs') + (nSec ? ', ' + pluriel(nSec, 'section', 'sections') : '') + (g.ignorees ? ' (' + pluriel(g.ignorees, 'ligne ignorée', 'lignes ignorées') + ')' : '') + '.', function () {
      var a = [];
      if (idsLiens.length) { a.push(['BulkRemoveRecord', etat.tables.li, idsLiens]); }
      a.push(['BulkRemoveRecord', etat.tables.el, tousIds]);
      return a;
    });
    return true;
  } catch (e) { masquerLoader(); erreurEcriture(e, 'Le schéma n\'a pas été importé.'); return false; }
}

/* Cadre la vue sur une boite du monde. */
function cadrerSur(b) {
  var toile = document.getElementById('vToile');
  if (!toile || !b) { return; }
  var W = toile.clientWidth, H = toile.clientHeight;
  var z = Math.max(ZOOM_MIN, Math.min(1, (W - 80) / Math.max(1, b.x2 - b.x1), (H - 80) / Math.max(1, b.y2 - b.y1)));
  etat.cam = { z: z, x: W / 2 - (b.x1 + b.x2) / 2 * z, y: H / 2 - (b.y1 + b.y2) / 2 * z };
  appliquerCamera();
}
