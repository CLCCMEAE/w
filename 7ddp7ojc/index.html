/* ==========================================================================
   SECTION : RANGER UN SCHEMA (1.6.0)
   Recalcule la place des elements relies par des connecteurs, en suivant
   les fleches : meme rangement que l'import. Les sections s'ajustent autour
   de leurs elements ; dans des couloirs, chaque element reste dans son
   couloir. Les elements sans connecteur ne bougent pas.
   ========================================================================== */
function ouvrirRanger(ancre, selection) {
  var t = tableauCourant();
  if (!t) { return; }
  var aCouloirs = elementsDuTableau().some(function (e) { return e.type === 'Section' && e.forme === 'Couloir'; });
  var choix = [['TD', 'De haut en bas', 'logigramme, arbre de décision'], ['LR', 'De gauche à droite', 'frise, parcours, couloirs']];
  var items = [creer('p', { classe: 'w-pop__titre', texte: selection ? 'Ranger la sélection' : 'Ranger le schéma' })];
  choix.forEach(function (c) {
    items.push(creer('button', { classe: 'w-pop__item', id: 'cRanger_' + c[0], attrs: { 'aria-pressed': (aCouloirs ? 'LR' : 'TD') === c[0] ? 'true' : 'false' },
      clic: function () { fermerPop(true); return rangerTableau(c[0], selection); } }, [creer('span', {}, [c[1], creer('span', { classe: 'w-pop__sens', texte: ' ' + c[2] })])]));
  });
  items.push(creer('p', { classe: 'w-mention fr-mb-0', texte: 'Seuls les éléments reliés par des connecteurs bougent. « Annuler » remet tout en place.' }));
  ouvrirPopFixe(ancre, 'Ranger', items);
}

async function rangerTableau(sens, selection) {
  var t = tableauCourant();
  if (!t) { return; }
  var tous = elementsDuTableau();
  var sections = tous.filter(function (e) { return e.type === 'Section'; });
  var couloirs = sections.filter(function (e) { return e.forme === 'Couloir'; });
  var cadres = sections.filter(function (e) { return e.forme !== 'Couloir'; });
  var choisis = selection ? elementsSelectionnes().filter(function (e) { return e.type !== 'Section'; }) : tous.filter(function (e) { return e.type !== 'Section'; });
  var ids = {}; choisis.forEach(function (e) { ids[e.id] = true; });
  var liens = etat.liens.filter(function (l) { return l.tableau === t.id && ids[l.de] && ids[l.vers]; });
  var relies = {}; liens.forEach(function (l) { relies[l.de] = true; relies[l.vers] = true; });
  var noeudsEl = choisis.filter(function (e) { return relies[e.id]; });
  if (noeudsEl.length < 2) { signalerSaisie(selection ? 'Sélectionnez des éléments reliés par des connecteurs.' : 'Il n\'y a rien à ranger : reliez des éléments par des connecteurs.'); return; }
  /* Zone de chaque element : le plus petit cadre ou couloir qui le
     contient. */
  var dedans = function (e, s) { var cx = e.x + e.w / 2, cy = e.y + e.h / 2; return cx >= s.x && cx <= s.x + s.w && cy >= s.y && cy <= s.y + s.h; };
  var zone = function (e, liste) { var z = liste.filter(function (s) { return dedans(e, s); }).sort(function (a, b) { return a.w * a.h - b.w * b.h; }); return z[0] || null; };
  var ordreZones = cadres.slice().sort(function (a, b) { return a.y - b.y || a.x - b.x; });
  var g = {
    sens: sens,
    groupes: ordreZones.map(function (s) { return { id: 's' + s.id, titre: s.libelle, parent: null }; }),
    noeuds: noeudsEl.map(function (e) { var z = zone(e, cadres); return { id: String(e.id), el: e, texte: e.libelle, forme: e.forme, w: e.w, h: e.h, groupe: z ? 's' + z.id : null, couloir: zone(e, couloirs) }; }),
    liens: liens.map(function (l) { return { de: String(l.de), vers: String(l.vers), fleche: l.fleche || 'Vers la fin' }; })
  };
  var avantB = boiteDe(noeudsEl);
  rangerTout(g);
  /* Couloirs : chaque element reste dans la bande de son couloir. */
  if (couloirs.length) {
    var parCouloir = {};
    g.noeuds.forEach(function (n) {
      if (!n.couloir) { return; }
      var c = n.couloir, horizontal = c.w >= c.h;
      var cle = c.id + ':' + Math.round(horizontal ? n.x : n.y);
      var k = parCouloir[cle] = (parCouloir[cle] || 0) + 1;
      if (horizontal) { n.y = c.y + (c.h - n.h) / 2 + (k - 1) * (n.h + 20) - 0; } else { n.x = c.x + (c.w - n.w) / 2 + (k - 1) * (n.w + 20); }
    });
  }
  /* Recaler le schema la ou il etait. */
  var apresB = boiteDe(g.noeuds.map(function (n) { return { x: n.x, y: n.y, w: n.w, h: n.h }; }));
  var dx = avantB.x1 - apresB.x1, dy = avantB.y1 - apresB.y1;
  if (couloirs.length) { if (couloirs[0].w >= couloirs[0].h) { dy = 0; } else { dx = 0; } }
  g.noeuds.forEach(function (n) { n.x = Math.round((n.x + dx) / 20) * 20; n.y = Math.round((n.y + dy) / 20) * 20; });
  /* Cadres : ajustes autour de leurs elements ranges. */
  var maj = [], avant = [];
  var ajouter = function (e, v) {
    avant.push({ id: e.id, POSITION_X: e.x, POSITION_Y: e.y, LARGEUR: e.w, HAUTEUR: e.h });
    maj.push({ id: e.id, POSITION_X: v.x, POSITION_Y: v.y, LARGEUR: v.w, HAUTEUR: v.h });
  };
  g.noeuds.forEach(function (n) { ajouter(n.el, { x: n.x, y: n.y, w: n.el.w, h: n.el.h }); });
  cadres.forEach(function (s) {
    var membres = g.noeuds.filter(function (n) { return n.groupe === 's' + s.id; });
    if (!membres.length) { return; }
    var b = boiteDe(membres.map(function (n) { return { x: n.x, y: n.y, w: n.w, h: n.h }; }));
    ajouter(s, { x: b.x1 - 30, y: b.y1 - 56, w: b.x2 - b.x1 + 60, h: b.y2 - b.y1 + 86 });
  });
  /* Couloirs : allonges pour contenir tout le schema. */
  if (couloirs.length) {
    var bt = boiteDe(g.noeuds.map(function (n) { return { x: n.x, y: n.y, w: n.w, h: n.h }; }));
    couloirs.forEach(function (c) {
      if (c.w >= c.h) { var x1 = Math.min(c.x, bt.x1 - 80), x2 = Math.max(c.x + c.w, bt.x2 + 40); ajouter(c, { x: x1, y: c.y, w: x2 - x1, h: c.h }); }
      else { var y1 = Math.min(c.y, bt.y1 - 80), y2 = Math.max(c.y + c.h, bt.y2 + 40); ajouter(c, { x: c.x, y: y1, w: c.w, h: y2 - y1 }); }
    });
  }
  var colonnes = function (l) { return { POSITION_X: l.map(function (x) { return x.POSITION_X; }), POSITION_Y: l.map(function (x) { return x.POSITION_Y; }), LARGEUR: l.map(function (x) { return x.LARGEUR; }), HAUTEUR: l.map(function (x) { return x.HAUTEUR; }) }; };
  try {

/* ==========================================================================
   SECTION : EXPORTER EN MERMAID (1.7.0)
   Le schema devient un texte Mermaid (flowchart) : formes, connecteurs avec
   libelles et pointilles, sections et couloirs en zones (subgraph). Ce texte
   se colle dans un wiki, un ticket, draw.io, ou se reimporte ici.
   ========================================================================== */
var FORME_VERS_MERMAID = { 'Rectangle': ['[', ']'], 'Pilule': ['([', '])'], 'Ovale': ['(', ')'], 'Cercle': ['((', '))'], 'Losange': ['{', '}'],
  'Hexagone': ['{{', '}}'], 'Cylindre': ['[(', ')]'], 'Parallélogramme': ['[/', '/]'], 'Trapèze': ['[/', '\\]'], 'Document': ['>', ']'], 'Nuage': ['(', ')'], 'Triangle': ['[', ']'] };

function texteMermaid(t) {
  return '"' + String(t || ' ').replace(/\s+/g, ' ').trim().replace(/"/g, '#quot;') + '"';
}

function construireMermaid() {
  var t = tableauCourant();
  if (!t) { return ''; }
  var tous = elementsDuTableau().filter(function (e) { return e.type !== 'Image'; });
  var sections = tous.filter(function (e) { return e.type === 'Section'; });
  var elements = tous.filter(function (e) { return e.type !== 'Section'; });
  var ids = {}; elements.forEach(function (e) { ids[e.id] = true; });
  var liens = etat.liens.filter(function (l) { return l.tableau === t.id && ids[l.de] && ids[l.vers]; });
  /* Sens : celui que suivent le plus les connecteurs. */
  var parId = {}; tous.forEach(function (e) { parId[e.id] = e; });
  var dx = 0, dy = 0;
  liens.forEach(function (l) { var a = parId[l.de], b = parId[l.vers]; dx += Math.abs((b.x + b.w / 2) - (a.x + a.w / 2)); dy += Math.abs((b.y + b.h / 2) - (a.y + a.h / 2)); });
  var sens = dx > dy * 1.2 ? 'LR' : 'TD';
  /* Zone de chaque element et de chaque section : la plus petite section
     qui la contient. */
  var dans = function (e, s) { var cx = e.x + e.w / 2, cy = e.y + e.h / 2; return s !== e && cx >= s.x && cx <= s.x + s.w && cy >= s.y && cy <= s.y + s.h && s.w * s.h > e.w * e.h; };
  var parent = function (e) { var z = sections.filter(function (s) { return dans(e, s); }).sort(function (a, b) { return a.w * a.h - b.w * b.h; }); return z[0] || null; };
  var parentDe = {}; tous.forEach(function (e) { var p = parent(e); parentDe[e.id] = p ? p.id : null; });
  var ordre = function (a, b) { return sens === 'LR' ? (a.x - b.x || a.y - b.y) : (a.y - b.y || a.x - b.x); };
  var lignes = ['flowchart ' + sens];
  var noeud = function (e) {
    var f = e.type === 'Forme' ? (FORME_VERS_MERMAID[e.forme] || ['[', ']']) : ['[', ']'];
    return 'n' + e.id + f[0] + texteMermaid(libelleAffiche(e) || e.type) + f[1];
  };
  var ecrireZone = function (pid, retrait) {
    elements.filter(function (e) { return parentDe[e.id] === pid; }).sort(ordre).forEach(function (e) { lignes.push(retrait + noeud(e)); });
    sections.filter(function (s) { return parentDe[s.id] === pid; }).sort(ordre).forEach(function (s) {
      lignes.push(retrait + 'subgraph z' + s.id + ' [' + texteMermaid(libelleAffiche(s) || (s.forme === 'Couloir' ? 'Couloir' : 'Section')) + ']');
      ecrireZone(s.id, retrait + '  ');
      lignes.push(retrait + 'end');
    });
  };
  ecrireZone(null, '  ');
  liens.slice().sort(function (a, b) { return ordre(parId[a.de], parId[b.de]); }).forEach(function (l) {
    var pointille = l.style === 'Pointillés';
    var trait = l.fleche === 'Sans flèche' ? (pointille ? '-.-' : '---') : (l.fleche === 'Dans les deux sens' ? (pointille ? '<-.->' : '<-->') : (pointille ? '-.->' : '-->'));
    var lib = String(l.libelle || '').replace(/\s+/g, ' ').trim().replace(/\|/g, '/').replace(/"/g, '#quot;');
    lignes.push('  n' + l.de + ' ' + trait + (lib ? '|' + lib + '|' : '') + ' n' + l.vers);
  });
  return lignes.join('\n') + '\n';
}

function ouvrirExportMermaid(ancre) {
  var t = tableauCourant();
  if (!t) { return; }
  var texte = construireMermaid();
  var zone = saisie('cMermaidTexte', texte, { multiligne: true, lignes: 12 });
  zone.readOnly = true;
  zone.setAttribute('spellcheck', 'false');
  zone.classList.add('w-import__texte');
  var nomFichier = (t.nom || 'schema').replace(/[^\wÀ-ÿ -]+/g, '').trim().replace(/\s+/g, '_') + '.mmd';
  ouvrirPopFixe(ancre, 'Exporter en Mermaid', [creer('p', { classe: 'w-pop__titre', texte: 'Exporter le schéma en texte Mermaid' }),
    creer('p', { classe: 'w-mention', texte: 'Formes, connecteurs, libellés et zones. Le texte s\'affiche en schéma dans un wiki, un ticket ou draw.io, et se réimporte ici avec « + », « Importer un schéma ». Positions et couleurs ne sont pas reprises.' }),
    groupeChamp('Texte du schéma', zone, null),
    creer('div', { classe: 'w-import__actions' }, [
      bouton('Télécharger (.mmd)', 'secondaire', 'download-line', function () { telechargerBlob(new Blob([texte], { type: 'text/plain;charset=utf-8' }), nomFichier); }, { petit: true, id: 'cMermaidTelecharger' }),
      bouton('Copier', null, 'file-copy-line', async function () {
        try { await navigator.clipboard.writeText(texte); }
        catch (e) { zone.focus(); zone.select(); try { document.execCommand('copy'); } catch (e2) { logSecurite('INFO', 'Copie refusée', e2); } }
        afficherToast('Texte Mermaid copié.');
      }, { petit: true, id: 'cMermaidCopier' })])]);
  var pop = document.getElementById('vPop');
  if (pop) {
    pop.classList.add('w-pop--large');
    var r = ancre.getBoundingClientRect();
    pop.style.left = Math.min(window.innerWidth - pop.offsetWidth - 8, r.right + 8) + 'px';
    pop.style.top = Math.max(8, Math.min(window.innerHeight - pop.offsetHeight - 8, r.top - pop.offsetHeight / 2)) + 'px';
  }
  zone.focus(); zone.select(); zone.scrollTop = 0;
}

    recharger: ['Le tableau blanc est créé', 'Les nouvelles tables seront lisibles après un rechargement du widget.'],
    page: ['Rien à afficher sur cette page', 'Le tableau blanc montré par cette page a été supprimé. Une personne qui gère les tableaux blancs peut modifier ou supprimer la page.'],
    aucun: ['Aucun tableau blanc pour l\'instant', etat.peutParametrer ? 'Créez un premier tableau blanc : un logigramme, un atelier post-it, ou vos données placées sur une toile.' : 'Une personne qui peut paramétrer le document doit d\'abord créer un tableau blanc.'],
    echec: ['Chargement impossible', 'Les données du document n\'ont pas pu être lues. Réessayez dans un instant.']
  };
  var t = (etat.page && vue === 'aucun' ? textes.page : textes[vue]) || textes.echec;
  var bloc = creer('div', { classe: 'w-vide' }, [creer('h2', { classe: 'fr-h4 w-titre-vue', id: 'titreVue', texte: t[0], attrs: { tabindex: '-1' } }), creer('p', { classe: 'w-texte', texte: t[1] })]);
  if (vue === 'aucun' && etat.peutParametrer) { bloc.appendChild(bouton('Créer un tableau blanc', null, 'add-line', ouvrirCreation, { id: 'mCreer' })); }
  if (vue === 'recharger') { bloc.appendChild(bouton('Recharger le widget', null, 'refresh-line', function () { window.location.reload(); }, { id: 'mRecharger' })); }
  if (vue === 'echec' || vue === 'acces') { bloc.appendChild(bouton('Réessayer', null, 'refresh-line', function () { return chargerTout(); }, { id: 'mReessayer' })); }
  zone.appendChild(bloc);
}

/* === SECTION : CHARGEMENT ET RAFRAICHISSEMENT === */
async function chargerTout() {
  if (etat.vue === 'echec' || etat.vue === 'acces') { masquerErreur(); }
  afficherLoader('Chargement des tableaux blancs…');
  etat.enCours = true;
  try {
    await chargerMeta();
    await lireCentrale();
    majDroits();
    appliquerModePage();
    resoudreTables();
    if (!etat.config) { etat.config = normaliserConfig({}); }
    await mettreANiveau();
    if (!etat.page && etat.peutParametrer && etat.centrale && !etat.copiesNettoyees) {
      etat.copiesNettoyees = true;
      if (await nettoyerCopies()) { await relireCopies(); }
    }
    var l = tableaux();
    if (!l.length) {
      masquerLoader();
      etat.enCours = false;
      if (etat.peutParametrer && (etat.niveauAcces === null || etat.niveauAcces === 'full')) { ouvrirCreation(); }
      else { rendreMessage('aucun'); }
      return;
    }
    var pref = lirePref(cleTableauPref(), null);
    choisirTableau(l.some(function (t) { return t.id === pref; }) ? pref : l[0].id);
    if (etat.page && etat.vuePageFaite !== etat.badge) { etat.vuePageFaite = etat.badge; etat.vueType = etat.page.vue; }
    etat.signature = '';
    await chargerDonnees();
    await lireInfosPj();
    masquerLoader();
    etat.enCours = false;
    if (etat.peutParametrer && !etat.page) { rendreAccueil('tableaux'); }
    else { rendrePrincipal(); var t = document.getElementById('vToile'); if (t) { t.focus({ preventScroll: true }); } }
  } catch (e) {
    masquerLoader();
    etat.enCours = false;
    var m = String((e && (e.message || e)) || '');
    rendreMessage(/access|permission|full/i.test(m) ? 'acces' : 'echec');
    logSecurite('ERREUR', 'Chargement impossible', e);
  }
}

function planifierRafraichissement(delai) {
  clearTimeout(etat.minuterieRafraichir);
  etat.minuterieRafraichir = setTimeout(function () { relayer(rafraichir(false), 'Rafraîchissement'); }, delai || 500);
}

/* Relecture sans gener la personne : jamais pendant un geste, une saisie
   sur la toile ou une ecriture ; l'ecran n'est redessine que si les
   donnees ont change. */
async function rafraichir(force) {
  if (etat.vue !== 'principal' && etat.vue !== 'parametrage') { return; }
  if (!etat.tables.el) { return; }
  if (!force && (etat.enCours || etat.geste || etat.edition || etat.ecrituresEnCours || etat.lecturesEnAttente || _deplacementClavier)) { etat.attente = true; return; }
  etat.attente = false;
  etat.enCours = true;
  try {
    if (force) { etat.signature = ''; }
    var change = await chargerDonnees(!force);
    if (change && etat.vue === 'principal') {
      if (etat.vueType === 'toile') { rendreMonde(); } else { rendreListe(); }
      majVolet();
      majBarre();
      var f = document.getElementById('wFiche');
      if (etat.fiche && f && !f.contains(document.activeElement)) { rendreFiche(); }
      if (!etat.fiche && f && !f.hidden) { f.hidden = true; vider(f); }
    }
  } catch (e) {
    logSecurite('AVERTISSEMENT', 'Relecture des tableaux blancs impossible', e);
    /* Document lent : la toile reste affichee, un seul avis toutes les
       deux minutes au plus. */
    if (Date.now() - etat.dernierAvisLenteur > 120000) {
      etat.dernierAvisLenteur = Date.now();
      afficherToast('Le document répond lentement : l\'affichage sera mis à jour dès qu\'il répondra.', null, 8000);
    }
  } finally {
    etat.enCours = false;
  }
}

/* === SECTION : DEMARRAGE === */
async function initialiser() {
  if (_initialise) { return; }
  _initialise = true;
  await attendreOptions();
  try { etat.nomDoc = await gristAvecTimeout(grist.docApi.getDocName(), 5000); } catch (e) { etat.nomDoc = null; }
  var pa = lirePref('aide', null);
  if (pa) { etat.aide.onglet = typeof pa.onglet === 'number' ? pa.onglet : 0; }
  await chargerTout();
  if (pa && pa.ouverte) { etat.aide.ouverte = true; var p = document.getElementById('wAide'); if (p) { p.hidden = false; rendreAide(); } var b = document.getElementById('bAide'); if (b) { b.setAttribute('aria-expanded', 'true'); b.classList.remove('fr-btn--secondary'); } }
  relayer(chargerLogo(), 'Logo du bandeau');
}

function brancherSocle() {
  var v = document.getElementById('bandeauVersion');
  if (v) { v.textContent = 'v' + VERSION_WIDGET + (ESSAI_WIDGET ? ' · essai ' + ESSAI_WIDGET : ''); }
  var h = document.getElementById('bandeauHomologue');
  if (h) { h.hidden = !HOMOLOGUE; }
  document.getElementById('wToastFermer').addEventListener('click', fermerMessage);
  document.getElementById('wConfirmOui').addEventListener('click', function () { terminerConfirmation(true); });
  document.getElementById('wConfirmNon').addEventListener('click', function () { terminerConfirmation(false); });
  document.getElementById('bAide').addEventListener('click', function () { ouvrirAide(!etat.aide.ouverte); });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' || document.getElementById('wConfirmOverlay').classList.contains('actif')) { return; }
    if (etat.aide.ouverte && document.getElementById('wAide').contains(document.activeElement)) { ouvrirAide(false); return; }
    var f = document.getElementById('wFiche');
    if (etat.fiche && f && f.contains(document.activeElement)) { fermerFiche(); return; }
    if (etat.voletMobile) { ouvrirVoletMobile(false); }
  });
  document.addEventListener('pointerdown', function (e) {
    if (etat.pop && !(e.target.closest && e.target.closest('.w-pop, .w-ctx'))) { fermerPop(); }
  });
  window.addEventListener('resize', function () { if (etat.vue === 'principal' && etat.vueType === 'toile') { appliquerCamera(); } });
  document.addEventListener('fullscreenchange', function () { setTimeout(appliquerCamera, 100); });
}

function demarrer() {
  brancherSocle();
  if (typeof grist === 'undefined') {
    afficherLogoRepli();
    rendreMessage('hors');
    return;
  }
  grist.ready({ requiredAccess: 'full', allowSelectBy: false });
  if (typeof grist.onOptions === 'function') {
    grist.onOptions(function (options) {
      var b = badgeValide(options && options.copie);
      var premier = !_optionsRecues;
      _optionsRecues = true;
      if (_resoudreOptions) { _resoudreOptions(); }
      if (b !== etat.badge) {
        etat.badge = b;
        if (!premier && _initialise && etat.vue !== 'creation' && etat.vue !== 'parametrage') { relayer(chargerTout(), 'Changement du réglage de la page'); }
      }
    });
  }
  if (typeof grist.on === 'function') {
    grist.on('message', function (m) {
      if (m && m.settings && m.settings.accessLevel) { etat.niveauAcces = m.settings.accessLevel; }
    });
  }
  grist.onRecords(function () {
    if (!_initialise) { relayer(initialiser(), 'Initialisation'); } else { planifierRafraichissement(); }
  });
  /* Sans table liee, aucun enregistrement n'est envoye : le widget demarre
     seul. */
  setTimeout(function () { relayer(initialiser(), 'Initialisation'); }, DELAI_DEMARRAGE_MS);
  _minuterieActualisation = setInterval(function () {
    if (document.visibilityState === 'visible' && etat.vue === 'principal') { relayer(rafraichir(false), 'Relecture'); }
  }, DELAI_ACTUALISATION_MS);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && etat.vue === 'principal') { planifierRafraichissement(); relayer(signalerPresence(), 'Présence'); } });
  /* Presence toutes les 30 s ; minuteur affiche a la seconde. */
  setInterval(function () { relayer(signalerPresence(), 'Présence'); }, DELAI_PRESENCE_MS);
  setTimeout(function () { relayer(signalerPresence(), 'Présence'); }, 4000);
  setInterval(function () { if (etat.vue === 'principal') { majMinuteur(); } }, 1000);
  document.addEventListener('paste', surColler);
  /* Focus perdu apres un nouveau rendu (barre d'actions redessinee) : les
     raccourcis de la toile restent actifs. */
  document.addEventListener('keydown', function (ev) {
    var a = document.activeElement;
    if ((!a || a === document.body || a === document.documentElement) && etat.vue === 'principal' && etat.vueType === 'toile' && !etat.fiche) { surToucheToile(ev); }
  });
  setTimeout(function () {
    window.addEventListener('unhandledrejection', function (evt) { logSecurite('ERREUR', 'Promesse rejetée non capturée', evt ? evt.reason : undefined); });
  }, 1500);
}

demarrer();

(function () {
    var cible = document.querySelector('.w-bandeau__titre');
    if (!cible || typeof MutationObserver === 'undefined') {
        return;
    }
    var marquer = function () {
        var marche = document.createTreeWalker(cible, NodeFilter.SHOW_TEXT);
        var n = marche.nextNode();
        while (n) {
            var i = n.parentNode && n.parentNode.classList && n.parentNode.classList.contains('w-wuit') ? -1 : n.nodeValue.search(/Wuit(?=[A-Z])/);
            if (i !== -1) {
                var reste = n.splitText(i);
                reste.nodeValue = reste.nodeValue.slice(4);
                var s = document.createElement('span');
                s.className = 'w-wuit';
                s.textContent = 'Wuit';
                reste.parentNode.insertBefore(s, reste);
                return;
            }
            n = marche.nextNode();
        }
    };
    marquer();
    new MutationObserver(marquer).observe(cible, { childList: true, characterData: true, subtree: true });
})();
</script>
