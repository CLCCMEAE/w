function iconeDispo(candidats) {
    var cle = candidats.join('|');
    if (_iconesVues[cle] !== undefined) {
        return _iconesVues[cle];
    }
    var choisi = candidats[candidats.length - 1];
    try {
        for (var i = 0; i < candidats.length; i++) {
            var t = document.createElement('span');
            t.className = 'fr-icon-' + candidats[i];
            t.style.position = 'absolute';
            t.style.visibility = 'hidden';
            document.body.appendChild(t);
            var st = getComputedStyle(t, '::before');
            var m = st.getPropertyValue('mask-image') || st.getPropertyValue('-webkit-mask-image') || '';
            t.remove();
            if (m && m !== 'none') {
                choisi = candidats[i];
                break;
            }
        }
    }
    catch (e) {
        logSecurite('INFO', 'Icône non vérifiée', e);
    }
    _iconesVues[cle] = choisi;
    return choisi;
}

async function changerSuivi(t, suivre, idFocus, cb) {
    if (!suivre) {
        var ok = await confirmerAction('Arrêter le suivi de « ' + libelleTable(t) + ' » ?', 'Le journal des lignes de cette table est effacé du document. Les suppressions, la structure et les droits déjà relevés restent dans l\'historique.', 'Arrêter le suivi', { danger: true });
        if (!ok) {
            cb.checked = true;
            return;
        }
    }
    statut('Modification en cours…');
    afficherLoader(suivre ? 'Suivi de « ' + libelleTable(t) + ' »…' : 'Arrêt du suivi…');
    try {
        if (suivre) {
            if (etat.config.tables.indexOf(t) === -1) {
                etat.config.tables.push(t);
            }
            await ecrireConfig();
            await assurerJournal(t);
            await proteger();
            await releverSilencieux();
            await noterSuivi('Suivi de « ' + libelleTable(t) + ' » commencé', '', libelleTable(t), t);
        }
        else {
            etat.config.tables = etat.config.tables.filter(function (x) { return x !== t; });
            await ecrireConfig();
            await retirerJournal(t);
            await releverSilencieux();
            await noterSuivi('Suivi de « ' + libelleTable(t) + ' » arrêté', libelleTable(t), '', t);
        }
        await chargerMeta();
        await lireHisto();
        masquerLoader();
        redessinerParametrage(idFocus);
        statut('Enregistré.');
        annoncer(suivre ? 'Table suivie.' : 'Suivi arrêté.');
    }
    catch (e) {
        masquerLoader();
        statut('Modification non enregistrée.', true);
        afficherErreur('Le changement de suivi n\'a pas abouti. Vérifiez que vous êtes propriétaire du document.', e);

function toast(message, opts) {
    opts = opts || {};
    var z = document.getElementById('wToast');
    if (!z) {
        return;
    }
    fermerToast(false);
    var type = opts.type || 'info';
    _toast.type = type;
    var classe = { succes: 'success', erreur: 'error', avertissement: 'warning', info: 'info' }[type] || 'info';
    z.className = 'w-toast fr-alert fr-alert--sm fr-alert--' + classe;
    z.setAttribute('role', type === 'erreur' ? 'alert' : 'status');
    z.setAttribute('aria-live', type === 'erreur' ? 'assertive' : 'polite');
    var msg = document.getElementById('wToastMsg');
    msg.textContent = '';
    var act = document.getElementById('wToastAction');
    vider(act);
    if (opts.action) {
        var a = opts.action;
        act.appendChild(bouton(a.libelle, 'secondaire', 'arrow-go-back-line', function () { fermerToast(false); return a.fn(); }, { petit: true, id: 'wToastBouton' }));
    }
    _toast.surFermeture = opts.surFermeture || null;
    z.hidden = false;
    _toast.texte = setTimeout(function () { _toast.texte = null; msg.textContent = message || ''; }, 50);
    var duree = opts.duree !== undefined ? opts.duree : (type === 'erreur' || type === 'avertissement' ? 0 : (opts.action ? 12000 : 6000));
    if (duree > 0) {
        _toast.minuterie = setTimeout(function () { fermerToast(true); }, duree);
    }
}
function fermerToast(avecFin) {
    clearTimeout(_toast.minuterie);
    _toast.minuterie = null;
    clearTimeout(_toast.texte);
    _toast.texte = null;
    var fin = _toast.surFermeture;
    _toast.surFermeture = null;
    _toast.type = null;
    var z = document.getElementById('wToast');
    if (z && !z.hidden) {
        var focusDedans = z.contains(document.activeElement);
        z.hidden = true;
        vider(document.getElementById('wToastAction'));
        if (focusDedans) {
            var t = document.getElementById('titreVue');
            if (t) {
                t.focus();
            }
        }
    }
    if (fin && avecFin) {
        fin();
    }
}
function afficherErreur(message, erreur) {
    logSecurite('ERREUR', message, erreur);
    toast(message || 'Une erreur est survenue.', { type: 'erreur' });
}
function afficherSucces(message) {

function confirmerAction(titre, message, libelleOui, opts) {
    opts = opts || {};
    return new Promise(function (resolve) {
        var ov = document.getElementById('wConfirmOverlay');
        if (!ov) {
            resolve(false);
            return;
        }
        if (_confirm.resolution) {
            _confirm.resolution(false);
        }
        _confirm.resolution = resolve;
        document.getElementById('wConfirmTitre').textContent = titre;
        document.getElementById('wConfirmMsg').textContent = message || '';
        vider(document.getElementById('wConfirmChamp'));
        var oui = document.getElementById('wConfirmOui');
        oui.textContent = libelleOui;
        oui.className = 'fr-btn' + (opts.danger ? ' w-btn-danger' : '');
        _confirm.retour = document.activeElement;
        ov.classList.add('actif');
        void ov.offsetHeight;
        _confirm.pieger = fabriquerPiege(ov, function () { terminerConfirmation(false); });
        ov.addEventListener('keydown', _confirm.pieger);
        document.getElementById(opts.danger ? 'wConfirmNon' : 'wConfirmOui').focus();
    });
}
function terminerConfirmation(oui) {
    var ov = document.getElementById('wConfirmOverlay');
    ov.classList.remove('actif');
    if (_confirm.pieger) {
        ov.removeEventListener('keydown', _confirm.pieger);
        _confirm.pieger = null;
    }
    var r = _confirm.retour;
    _confirm.retour = null;
    if (r && document.body.contains(r) && typeof r.focus === 'function') {
        r.focus();
    }
    var res = _confirm.resolution;
    _confirm.resolution = null;
    if (res) {
        res(!!oui);
    }
}

        }
