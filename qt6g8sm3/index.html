function logSecurite(niveau, message, details) {
    var ligne = '[' + new Date().toISOString() + '] [' + niveau + '] ' + message;
    if (niveau === 'ERREUR') {
        if (details !== undefined) {
            console.error(ligne, details);
        }
        else {
            console.error(ligne);
        }
    }
    else if (niveau === 'AVERTISSEMENT') {
        if (details !== undefined) {
            console.warn(ligne, details);
        }
        else {
            console.warn(ligne);
        }
    }
    else {
        if (details !== undefined) {
            console.log(ligne, details);
        }
        else {
            console.log(ligne);
        }
    }
}
var _loaderTimeout = null;
var _loaderDelai = null;
function afficherLoader(message) {
    if (_loaderTimeout) {
        clearTimeout(_loaderTimeout);
    }
    _loaderTimeout = setTimeout(function () {
        masquerLoader();
        logSecurite('AVERTISSEMENT', 'Voile de chargement masque automatiquement apres 60 s');
    }, 60000);
    var texte = document.getElementById('loaderMessage');
    if (texte) {
        texte.textContent = message || 'Chargement…';
    }
    var voileEnCours = document.getElementById('loader');
    if (voileEnCours && voileEnCours.classList.contains('actif')) {
        return;
    }
    if (_loaderDelai) {
        return;
    }
    _loaderDelai = setTimeout(function () {
        _loaderDelai = null;
        var voile = document.getElementById('loader');
        if (voile) {
            voile.classList.add('actif');
        }
    }, 250);
}
function masquerLoader() {
    if (_loaderTimeout) {
        clearTimeout(_loaderTimeout);
        _loaderTimeout = null;
    }
    if (_loaderDelai) {
        clearTimeout(_loaderDelai);
        _loaderDelai = null;
    }
    var voile = document.getElementById('loader');
    if (voile) {
        void voile.offsetHeight;
        voile.classList.remove('actif');
    }
}

    z.setAttribute('aria-live', _toast.type === 'erreur' ? 'assertive' : 'polite');

    msg.textContent = '';

        var a = opts.action;
        act.appendChild(bouton(a.libelle, 'secondaire', a.icone === undefined ? 'arrow-go-back-line' : a.icone, function () {
