async function chargerLogo() {
    var container = document.getElementById('bandeau-logo');
    if (!container) {
        return;
    }
    var logoSvg = null;
    try {
        var centrale = trouverTable('BIBLIOTHEQUE_CENTRALE');
        if (centrale) {
            var data = await lireTable(centrale);
            for (var i = 0; i < data.id.length; i++) {
                if ((data.WIDGET ? data.WIDGET[i] : '') === '__RESSOURCE__' && (data.NOM ? data.NOM[i] : '') === 'LOGO_SVG') {
                    logoSvg = data.CONTENU ? data.CONTENU[i] : '';
                    break;
                }
            }
            if (!logoSvg) {
                logoSvg = genererLogoMEAE();
                try {
                    await agir([['AddRecord', centrale, null, { WIDGET: '__RESSOURCE__', NOM: 'LOGO_SVG', CONTENU: logoSvg }]]);
                    logSecurite('INFO', 'Logo MEAE stocké dans la bibliothèque centrale');
                }
                catch (e) {
                    logSecurite('INFO', 'Stockage logo non possible', e);
                }
            }
        }
    }
    catch (e) {
        logSecurite('INFO', 'Chargement logo depuis biblio non possible', e);
    }
    if (!logoSvg) {
        logoSvg = genererLogoMEAE();
    }
    if (!injecterSvgSecurise(container, logoSvg)) {
        afficherLogoRepli();
    }
}

        if (empreinteDonnees() === avant) {
            return;
        }
        if (etat.vue === 'matrice' && !etat.modaleOuverte && !etat.glisserEnCours) {
            var actif = document.activeElement;
            var carte = actif && actif.closest ? actif.closest('.w-carte') : null;
            var idCarte = carte ? carte.getAttribute('data-id') : null;
            var idActif = actif && actif.id ? actif.id : null;
            redessinerMatrice();
            if (idCarte) {
                focaliserCarte(parseInt(idCarte, 10));
            }
            else if (idActif && document.getElementById(idActif)) {
                document.getElementById(idActif).focus();
            }
        }
    }
    catch (e) {
        if (silencieux) {
            logSecurite('AVERTISSEMENT', 'Relecture automatique non aboutie', e);
        }
        else {
            afficherErreur('L\'actualisation de la matrice n\'a pas abouti.', e);
        }
    }
}
function demarrerActualisationAuto() {
    if (_minuterieActualisation) {
        clearInterval(_minuterieActualisation);
    }
    _minuterieActualisation = setInterval(function () {
        if (document.visibilityState !== 'visible' || etat.vue !== 'matrice' || etat.modaleOuverte || etat.glisserEnCours) {
            return;
        }
        relayer(rafraichirMaintenant(true), 'Relecture automatique');
    }, DELAI_ACTUALISATION_MS);
}
function planifierRafraichissement() {
    if (etat.vue !== 'matrice') {
        return;
    }
    if (etat.modaleOuverte || etat.glisserEnCours) {
        etat.rafraichirEnAttente = true;
        return;
    }
    if (etat.minuterieRafraichir) {
        clearTimeout(etat.minuterieRafraichir);
    }
    etat.minuterieRafraichir = setTimeout(function () {
        etat.minuterieRafraichir = null;
        relayer(rafraichirMaintenant(), 'Rafraîchissement');
    }, 300);
}
async function detecterTableLiee() {
    try {
        etat.tableLiee = await gristAvecTimeout(grist.selectedTable.getTableId(), 5000);
    }
    catch (e) {
        etat.tableLiee = null;
        logSecurite('INFO', 'Table liée à la vue non déterminée', e);
    }
}
async function initialiser() {
    if (etat.initEnCours) {
        return;
    }
    etat.initEnCours = true;
    afficherLoader('Chargement de la matrice…');
    try {
        await detecterTableLiee();
        try {
            etat.nomDoc = await gristAvecTimeout(grist.docApi.getDocName(), 5000);
        }
        catch (e) {
            logSecurite('INFO', 'Nom du document non lu', e);
        }
        lireMatriceMemorisee();
        await attendreAcces();
        if (accesRefuse(etat.niveauAcces)) {
            masquerLoader();
            afficherLogoRepli();
            afficherVue('acces');
            return;
        }
        await chargerMeta();
        relayer(chargerLogo(), 'Chargement du logo impossible');
        await chargerTout();
        masquerLoader();
    }
    catch (e) {
        masquerLoader();
        logSecurite('ERREUR', 'Initialisation', e);
        afficherErreur('Le chargement n\'a pas abouti.');
        afficherVue('echec');
    }
    finally {
        etat.initEnCours = false;
    }
}
document.getElementById('bandeauVersion').textContent = 'v' + VERSION_WIDGET;
(function () { var b = document.getElementById('bandeauHomologue'); if (b) {
    b.hidden = !HOMOLOGUE;
} })();
document.getElementById('wToastFermer').addEventListener('click', function () { fermerToast(true); });
document.getElementById('wToast').addEventListener('keydown', function (e) { if (e.key === 'Escape') {
    e.stopPropagation();
    fermerToast(true);
} });
document.getElementById('wModaleFermer').addEventListener('click', fermerModale);
document.getElementById('wConfirmOui').addEventListener('click', function () { terminerConfirmation(true); });
document.getElementById('wConfirmNon').addEventListener('click', function () { terminerConfirmation(false); });
brancherAide();
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && etat.vue === 'matrice' && !etat.modaleOuverte) {
    relayer(rafraichirMaintenant(true), 'Relecture au retour sur la page');
} });
grist.ready({ requiredAccess: 'full', columns: [], allowSelectBy: true });
grist.onOptions(function (options, interaction) {
    var badge = badgeValide(options && options.copie);
    if (badge !== etat.badge) {
        etat.badge = badge;
        if (etat.vue !== 'chargement' && etat.vue !== 'assistant' && !etat.initEnCours) {
            etat.tableauSession = null;
            etat.filtresPageCle = null;
            relayer(chargerTout(), 'Changement du réglage de la page');
        }
    }
    var avant = etat.niveauAcces;
    etat.niveauAcces = interaction && interaction.accessLevel ? interaction.accessLevel : null;
    _accesRecu();
    if (accesRefuse(avant) !== accesRefuse(etat.niveauAcces) && !etat.initEnCours) {
        relayer(initialiser(), 'Changement du niveau d\'accès');
    }
});
async function suivreLiaison() {
    var avant = etat.tableLiee;
    await detecterTableLiee();
    if (avant === etat.tableLiee) {
        return false;
    }
    if (['matrice', 'invalide'].indexOf(etat.vue) === -1 || etat.modaleOuverte || etat.initEnCours) {
        return false;
    }
    await chargerTout();
    return true;
}
grist.onRecords(function (records) {
    var ids = {};
    (records || []).forEach(function (r) { ids[r.id] = true; });
    etat.derniersIds = ids;
    relayer(suivreLiaison().then(function (change) { if (!change) {
        planifierRafraichissement();
    } }), 'Suivi de la liaison de la vue');
});
setTimeout(function () {
    window.addEventListener('unhandledrejection', function (evt) {
        logSecurite('ERREUR', 'Promesse rejetée non capturée', evt ? evt.reason : undefined);
    });
}, 1500);
relayer(initialiser(), 'Initialisation');
demarrerActualisationAuto();

(function () {
    var cible = document.querySelector('.w-bandeau__titre');
    if (!cible || typeof MutationObserver === 'undefined') {
        return;
    }
    var marquer = function () {
        var marche = document.createTreeWalker(cible, NodeFilter.SHOW_TEXT);
        var n = marche.nextNode();
        while (n) {
            var i = n.parentNode && n.parentNode.classList && n.parentNode.classList.contains('w-wuit') ? -1 : n.nodeValue.search(/Wuit(?=[A-Z])/);
            if (i !== -1) {
                var reste = n.splitText(i);
                reste.nodeValue = reste.nodeValue.slice(4);
                var s = document.createElement('span');
                s.className = 'w-wuit';
                s.textContent = 'Wuit';
                reste.parentNode.insertBefore(s, reste);
                return;
            }
            n = marche.nextNode();
        }
    };
    marquer();
    new MutationObserver(marquer).observe(cible, { childList: true, characterData: true, subtree: true });
})();
</script>
