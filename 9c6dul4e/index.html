    grist.ready({ requiredAccess: 'full' });
    grist.onOptions(function (options, interaction) {
        var badge = badgeValide(options && options.copie);
        if (badge !== etat.badge) {
            var avantBadge = etat.badge;
            etat.badge = badge;
            if (avantBadge !== null && etat.vue !== 'chargement' && etat.vue !== 'creation') {
                relayer(chargerTout(), 'Changement du réglage de la page');
            }
        }
        etat.niveauAcces = (interaction && interaction.accessLevel) || etat.niveauAcces || 'full';
        if (_accesRecu) {
            _accesRecu();
        }
    });
    chargerLogo().catch(function (e) { logSecurite('INFO', 'Logo du bandeau', e); afficherLogoRepli(); });
    await attendreAcces();
    if (!accesComplet()) {
        masquerLoader();
        afficherVue('acces');
        return;
    }
    await chargerTout();
    setTimeout(function () {
        window.addEventListener('unhandledrejection', function (evt) { logSecurite('ERREUR', 'Promesse rejetée non capturée', evt ? evt.reason : undefined); });
    }, 1500);
}
demarrerWidget();

(function () {
    var cible = document.querySelector('.w-bandeau__titre');
    if (!cible || typeof MutationObserver === 'undefined') {
        return;
    }
    var marquer = function () {
        var marche = document.createTreeWalker(cible, NodeFilter.SHOW_TEXT);
        var n = marche.nextNode();
        while (n) {
            var i = n.parentNode && n.parentNode.classList && n.parentNode.classList.contains('w-wuit') ? -1 : n.nodeValue.search(/Wuit(?=[A-Z])/);
            if (i !== -1) {
                var reste = n.splitText(i);
                reste.nodeValue = reste.nodeValue.slice(4);
                var s = document.createElement('span');
                s.className = 'w-wuit';
                s.textContent = 'Wuit';
                reste.parentNode.insertBefore(s, reste);
                return;
            }
            n = marche.nextNode();
        }
    };
    marquer();
    new MutationObserver(marquer).observe(cible, { childList: true, characterData: true, subtree: true });
})();
</script>
