        await chargerTout();
    }
    return true;
}
async function vuesDeConsultation(badges) {
    if (!badges.length) {
        return [];
    }
    try {
        var d = await lireTable('_grist_Views_section');
        var vues = [];
        for (var i = 0; i < d.id.length; i++) {
            var o = String((d.options || [])[i] || '');
            var v = (d.parentId || [])[i];
            if (v && vues.indexOf(v) === -1 && badges.some(function (b) { return o.indexOf(b) !== -1; })) {
                vues.push(v);
            }
        }
        return vues;
    }
    catch (e) {
        logSecurite('INFO', 'Pages de consultation non retrouvées', e);
        return [];
    }
}
async function supprimerCarte() {
    var c = etat.config;
    if (!c || !etat.biblioLigne) {
        return;
    }
    var ok = await confirmerAction('Supprimer la carte « ' + (c.nom || '') + ' » ?', c.colCarte
        ? 'La carte disparaît des onglets et ses lieux sont supprimés, ainsi que ses pages de consultation. Les autres cartes ne sont pas touchées. Cette action est définitive.'
        : 'La carte disparaît des onglets, ainsi que ses pages de consultation. Votre table « ' + libelleTable(c.tableLieux) + ' » et ses lignes restent dans le document. Cette action est définitive.', 'Supprimer la carte', { danger: true });
    if (!ok) {
        return;
    }
    afficherLoader('Suppression de la carte…');
    try {
        var actions = [];
        if (c.colCarte && etat.meta.tables[c.tableLieux]) {
            var d = await lireTable(c.tableLieux);
            var ids = d.id.filter(function (id, k) { return colonneDe(d, c.colCarte, k) === c.idCarte; });
            if (ids.length) {
                actions.push(['BulkRemoveRecord', c.tableLieux, ids]);
            }
        }
        actions.push(['RemoveRecord', etat.biblio, etat.biblioLigne]);
        var copiesCarte = Object.keys(etat.copies).filter(function (x) { return etat.copies[x].carte === etat.cleConfig; });
        var pages = copiesCarte.map(function (x) { return etat.copies[x].ligne; });
        if (pages.length) {
            actions.push(['BulkRemoveRecord', etat.biblio, pages]);
        }
        var vuesConsult = await vuesDeConsultation(copiesCarte.filter(function (x) { return etat.copies[x].consultation; }));
        vuesConsult.forEach(function (v) { actions.push(['RemoveRecord', '_grist_Views', v]); });
        await agir(actions);
        var nom = c.nom;
        etat.brouillon = null;
        etat.carteSession = null;
        if (pageAdminCa()) {
            etat.surAccueil = true;
        }
        etat.config = null;
        etat.cleConfig = null;
        etat.biblioLigne = null;
        reinitialiserFiltres();
        ecrirePref('derniere', null, true);
        masquerLoader();
        await chargerTout();
        afficherSucces('La carte « ' + (nom || '') + ' » a été supprimée.');
    }
    catch (e) {
        masquerLoader();
        afficherErreur('La suppression de la carte n\'a pas abouti.', e);
    }
}
var _initialise = false;
async function initialiser() {
    if (_initialise) {
        return;
    }
    _initialise = true;
    try {
        etat.nomDoc = await gristAvecTimeout(grist.docApi.getDocName(), 5000);
    }
    catch (e) {
        etat.nomDoc = null;
    }
    await chargerTout();
    relayer(chargerLogo(), 'Logo du bandeau');
}
function brancherSocle() {
    var v = document.getElementById('bandeauVersion');
    if (v) {
        v.textContent = 'v' + VERSION_WIDGET + (ESSAI_WIDGET ? ' · essai ' + ESSAI_WIDGET : '');
    }
    var h = document.getElementById('bandeauHomologue');
    if (h) {
        h.hidden = !HOMOLOGUE;
    }
    document.getElementById('wToastFermer').addEventListener('click', function () { fermerToast(true); });
    document.getElementById('wToast').addEventListener('keydown', function (e) { if (e.key === 'Escape') {
        e.stopPropagation();
        fermerToast(true);
    } });
    document.getElementById('wModaleFermer').addEventListener('click', fermerModale);
    document.getElementById('wConfirmOui').addEventListener('click', function () { terminerConfirmation(true); });
    document.getElementById('wConfirmNon').addEventListener('click', function () { terminerConfirmation(false); });
    brancherAide();
    document.addEventListener('keydown', function (e) {
        if (e.key !== 'Escape' || etat.modaleOuverte || document.getElementById('wConfirmOverlay').classList.contains('actif')) {
            return;
        }
        if (etat.placement) {
            arreterPlacement();
            annoncer('Placement annulé.');
            var b = document.getElementById('ePlacer');
            if (b) {
                b.focus();
            }
            return;
        }
        if (etat.voletMobile) {
            ouvrirVoletMobile(false);
            return;
        }
        if (etat.fiche && etat.fiche.mode !== 'edition') {
            fermerFiche(true);
        }
    });
    window.addEventListener('resize', function () {
        if (etat.voletMobile && window.matchMedia('(min-width: 48.01em)').matches) {
            ouvrirVoletMobile(false);
        }
    });
}
function demarrer() {
    brancherSocle();
    if (typeof grist === 'undefined') {
        afficherLogoRepli();
        afficherVue('hors');
        return;
    }
    grist.ready({ requiredAccess: 'full', allowSelectBy: true });
    grist.onOptions(function (options, interaction) {
        var badge = badgeValide(options && options.copie);
        if (badge !== etat.badge) {
            etat.badge = badge;
            if (_initialise && etat.vue !== 'assistant') {
                relayer(chargerTout(), 'Changement du réglage de la page');
            }
        }
        var avant = etat.niveauAcces;
        var niveauAccorde = interaction ? interaction.accessLevel : null;
        etat.niveauAcces = niveauAccorde || null;
        _accesRecu();
        var refuse = function (n) { return n === 'none' || n === 'read table'; };
        if (refuse(avant) !== refuse(etat.niveauAcces) && _initialise) {
            relayer(chargerTout(), 'Changement du niveau d\'accès');
        }
    });
    grist.onRecords(function (rows) {
        var ids = {};
        (rows || []).forEach(function (r) { if (r && r.id) {
            ids[r.id] = true;
        } });
        etat.derniersIds = ids;
        var lire = typeof grist.getSelectedTableId === 'function' ? grist.getSelectedTableId() : (grist.selectedTable && grist.selectedTable.getTableId ? grist.selectedTable.getTableId() : null);
        Promise.resolve(lire).then(function (tid) { etat.tableLiee = tid || null; }).catch(function () { etat.tableLiee = null; }).then(function () {
            if (!_initialise) {
                relayer(initialiser(), 'Initialisation');
            }
            else {
                planifierRafraichissement();
            }
        });
    });
    grist.onRecord(function (rec) {
        if (!rec || !rec.id || etat.vue !== 'carte' || !estLiee()) {
            return;
        }
        if (rec.id === etat.choisi || (etat.fiche && etat.fiche.mode === 'edition')) {
            return;
        }
        if (lieuParId(rec.id)) {
            ouvrirFiche(rec.id, { depuisCurseur: true });
        }
    });
    setTimeout(function () { relayer(initialiser(), 'Initialisation'); }, 800);
    _minuterieActualisation = setInterval(function () {
        if (document.visibilityState === 'visible' && etat.vue === 'carte') {
            planifierRafraichissement();
        }
    }, DELAI_ACTUALISATION_MS);
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && etat.vue === 'carte') {
        planifierRafraichissement();
    } });
    setTimeout(function () {
        window.addEventListener('unhandledrejection', function (evt) {
            logSecurite('ERREUR', 'Promesse rejetée non capturée', evt ? evt.reason : undefined);
        });
    }, 1500);
}
demarrer();

(function () {
    var cible = document.querySelector('.w-bandeau__titre');
    if (!cible || typeof MutationObserver === 'undefined') {
        return;
    }
    var marquer = function () {
        var marche = document.createTreeWalker(cible, NodeFilter.SHOW_TEXT);
        var n = marche.nextNode();
        while (n) {
            var i = n.parentNode && n.parentNode.classList && n.parentNode.classList.contains('w-wuit') ? -1 : n.nodeValue.search(/Wuit(?=[A-Z])/);
            if (i !== -1) {
                var reste = n.splitText(i);
                reste.nodeValue = reste.nodeValue.slice(4);
                var s = document.createElement('span');
                s.className = 'w-wuit';
                s.textContent = 'Wuit';
                reste.parentNode.insertBefore(s, reste);
                return;
            }
            n = marche.nextNode();
        }
    };
    marquer();
    new MutationObserver(marquer).observe(cible, { childList: true, characterData: true, subtree: true });
})();
