function contexteAide() {

    }
    if (etat.config) {
        return { etapes: ETAPES_PARAMETRAGE, courante: -1,
            repere: etat.peutParametrer ? 'Pour changer ces réglages : « Paramétrages de ce tableau de bord », dans le volet de gauche.' : 'Le paramétrage est réservé aux personnes qui gèrent le document.' };
    }

}
function apercuContenu(nom) {
    var b = etat.brouillon;
    if (!b || !b.cfg) {
        return null;
    }
    if (nom === 'Affichage et filtres') {
        return { contenu: affichageApercu(b.cfg), note: 'Le volet et les tuiles à l\'ouverture, avec vos données.' };
    }
    if (nom === 'Récapitulatif') {
        return b.cfg.tuiles.length ? { contenu: vignetteReelle(b.cfg, 'rv-') || miniApercu(b.cfg.tuiles, true), note: 'Votre tableau de bord, avec vos données.' } : null;
    }
    return null;
}
function affichageApercu(cfg) {
    var garde = etat.filtres;
    etat.filtres = { cle: null, periode: (cfg.periode && cfg.periode.defaut) || 'all', debut: '', fin: '', choix: (cfg.filtres || []).map(function (f) { return (f && f.defaut) || ''; }) };
    try {
        var lignes = [];
        if (cfg.periode && infoColonne(cfg.periode.table, cfg.periode.col)) {
            lignes.push(['Période', (PERIODES.filter(function (p) { return p.code === (cfg.periode.defaut || 'all'); })[0] || {}).nom || 'Toute la période']);
        }
        (cfg.filtres || []).forEach(function (f) {
            if (f && infoColonne(f.table, f.col)) {
                lignes.push([f.libelle || libCol(f.table, f.col), f.defaut ? libelleCle(f.defaut === '\u0000vide' ? '' : f.defaut) : 'Tous']);
            }
        });
        var res = [creer('p', { classe: 'w-apercu__sous-titre', texte: 'Volet à l\'ouverture' })];
        res.push(lignes.length ? creer('dl', { classe: 'w-recap__liste' }, [].concat.apply([], lignes.map(function (l) { return [creer('dt', { texte: l[0] }), creer('dd', { texte: l[1] })]; })))
            : creer('p', { classe: 'w-mention', texte: 'Aucun filtre.' }));
        var tuiles = (cfg.tuiles || []).filter(function (t) { return t.table && etat.donnees[t.table]; });
        res.push(creer('p', { classe: 'w-apercu__sous-titre', texte: 'Tuiles à l\'ouverture' }));
        if (!tuiles.length) {
            res.push(creer('p', { classe: 'w-mention', texte: 'Aucune tuile calculée sur une liste.' }));
        }
        else {
            res.push(creer('ul', { classe: 'w-apercu__filtres' }, tuiles.map(function (t) {
                var non = [];
                if (filtrePeriodeActif(cfg) && !infoColonne(t.table, cfg.periode.col)) {
                    non.push('Période');
                }
                (cfg.filtres || []).forEach(function (f, k) { if (etat.filtres.choix[k] && infoColonne(f.table, f.col) && !infoColonne(t.table, f.col)) {
                    non.push(f.libelle || libCol(f.table, f.col));
                } });
                var n = selection(t.table, t.filtres, { config: cfg }).length;
                return creer('li', {}, [creer('strong', { texte: t.titre || 'Tuile sans titre' }),
                    creer('span', { classe: 'w-mention', texte: ' : ' + nombreSur(n, 'ligne') + (non.length ? ' (non filtrée : ' + non.join(', ') + ')' : '') })]);
            })));
        }
        return creer('div', { classe: 'w-apercu__pile' }, res);
    }
    finally {
        etat.filtres = garde;
    }
}
async function creerTableau() {
    var b = etat.brouillon;
    var raison = raisonNom(b);
    if (raison) {
        b.etape = ETAPES_CREATION.indexOf('Récapitulatif') + 1;
        afficherVue('assistant');
        marquerInvalide('wNom', raison);
        return;
    }
    afficherLoader('Création du tableau de bord…');
    try {
        await assurerBibliotheque();
        await lireTableaux();
        await determinerDroits();
        var cle = nouvelleCleConfig();
        var cfg = cloner(b.cfg);
        var ligne = await ecrireConfig(cfg, cle, null);
        etat.brouillon = null;
        memoriserTableau(cle);
        etat.filtres = null;
        etat.edition = false;
        await chargerTout();
        masquerLoader();
        afficherSucces('Tableau de bord « ' + cfg.nom + ' » créé.' + (etat.peutParametrer ? ' Utilisez « Modifier le tableau de bord » pour changer ses tuiles.' : ''));
        logSecurite('INFO', 'Tableau de bord créé, ligne ' + ligne);
    }
    catch (e) {
        masquerLoader();
        afficherErreur(estRefusDroits(e) ? 'Vos droits sur ce document ne permettent pas de créer un tableau de bord.' : 'Le tableau de bord n\'a pas pu être créé. Réessayez.', e);
    }
}

function statutSauvegarde(texte, erreur) {
    var b = etat.brouillon;
    if (b) {
        b.statut = texte;
    }
    var z = document.getElementById('aStatut');

function planifierSauvegarde() {
    var b = etat.brouillon;
    clearTimeout(b.minuterie);
    statutSauvegarde('Modification en cours…');
    b.minuterie = setTimeout(function () { relayer(sauvegarderBrouillon(), 'Enregistrement automatique'); }, DELAI_AUTOSAVE_MS);
}
function raisonNonEnregistrable(b) {
    if (!String(b.cfg.nom || '').trim()) {
        return 'le nom du tableau de bord est vide';
    }
    return raisonNom(b) ? 'un autre tableau de bord porte déjà ce nom' : null;
}
function aChange(b) { return JSON.stringify(b.cfg) !== b.initial; }
async function sauvegarderBrouillon() {
    var b = etat.brouillon;
    if (!b || b.mode !== 'parametrage') {
        return;
    }
    clearTimeout(b.minuterie);
    if (b.enCours) {
        b.encore = true;
        return;
    }
    if (!aChange(b)) {
        statutSauvegarde('');
        return;
    }
    var raison = raisonNonEnregistrable(b);
    if (raison) {
        statutSauvegarde('Non enregistré : ' + raison + '.', true);
        return;
    }
    b.enCours = true;
    statutSauvegarde('Enregistrement…');
    var gel = JSON.stringify(b.cfg);
    try {
        var cfg = JSON.parse(gel);
        await ecrireConfig(cfg, etat.cleConfig, etat.biblioLigne);
        b.initial = gel;
        etat.config = cfg;
        etat.tableaux.forEach(function (t) { if (t.cle === etat.cleConfig) {
            t.config = etat.config;
        } });
        var o = document.querySelector('.w-onglet[aria-selected="true"]');
        if (o && o.id !== 'gOngletNouveau') {
            o.textContent = cfg.nom || 'Tableau de bord sans nom';
        }
        var d = new Date();
        b.dernier = (d.getHours() < 10 ? '0' : '') + d.getHours() + ' h ' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
        statutSauvegarde('Enregistré à ' + b.dernier);
        var t = document.getElementById('aTitrePerso');
        if (t) {
            t.textContent = titreParametrage(cfg.nom);
        }
    }
    catch (e) {
        statutSauvegarde('L\'enregistrement n\'a pas abouti.', true);
        afficherErreur(estRefusDroits(e) ? 'Vos droits sur ce document ne permettent pas de modifier ce tableau de bord.' : 'L\'enregistrement automatique n\'a pas abouti.', e);
    }
    b.enCours = false;
    if (b.encore && etat.brouillon === b) {
        b.encore = false;
        await sauvegarderBrouillon();
    }
}
async function sortirParametrages(afficher) {
    var b = etat.brouillon;
    if (b) {
        clearTimeout(b.minuterie);
        var limite = Date.now() + 30000;
        while (b.enCours && Date.now() < limite) {
            await new Promise(function (r) { setTimeout(r, 50); });
        }
        await sauvegarderBrouillon();
        if (aChange(b)) {
            var raison = raisonNonEnregistrable(b);
            var quitter = await confirmerAction('Quitter les paramétrages ?', 'Une modification n\'a pas pu être enregistrée' + (raison ? ' : ' + raison : '') + '. Elle sera perdue.', 'Quitter', { destructif: true });
            if (!quitter) {
                return false;
            }
        }
    }
    etat.brouillon = null;
    etat.editionPage = null;
    etat.filtres = null;
    if (afficher) {
        afficherLoader('Chargement…');
        try {
            await chargerTout();
        }
        finally {
            masquerLoader();
        }
    }
    return true;
}
async function supprimerTableau() {
    var nom = etat.config ? etat.config.nom : '';

    if (!ok) {
        return;
    }
    if (etat.brouillon) {
        clearTimeout(etat.brouillon.minuterie);

        if (etat.biblioLigne) {

        etat.config = null;

        await chargerTout();

    catch (e) {
        masquerLoader();
        afficherErreur('Le tableau de bord n\'a pas pu être supprimé.', e);

}

(function () {
    var cible = document.querySelector('.w-bandeau__titre');
    if (!cible || typeof MutationObserver === 'undefined') {
        return;
    }
    var marquer = function () {
        var marche = document.createTreeWalker(cible, NodeFilter.SHOW_TEXT);
        var n = marche.nextNode();
        while (n) {
            var i = n.parentNode && n.parentNode.classList && n.parentNode.classList.contains('w-wuit') ? -1 : n.nodeValue.search(/Wuit(?=[A-Z])/);
            if (i !== -1) {
                var reste = n.splitText(i);
                reste.nodeValue = reste.nodeValue.slice(4);
                var s = document.createElement('span');
                s.className = 'w-wuit';
                s.textContent = 'Wuit';
                reste.parentNode.insertBefore(s, reste);
                return;
            }
            n = marche.nextNode();
        }
    };
    marquer();
    new MutationObserver(marquer).observe(cible, { childList: true, characterData: true, subtree: true });
})();
