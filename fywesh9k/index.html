<!DOCTYPE html>
<html lang="fr" data-fr-scheme="light" data-fr-theme="light">
<head>
<meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WuitArchive</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.13.1/dist/dsfr/dsfr.min.css" integrity="sha256-PoTduNA12Ef0KCwFjv+8sWmCz4NgPhVDfR+3xUpKSIU=" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.13.1/dist/utility/utility.min.css" integrity="sha256-AtMKjo1PePyobCHKvBH8mkAGxX17BDtX9+yJ44JxWnU=" crossorigin="anonymous">
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js" integrity="sha256-zTeJj5eCrfVIIMQTGRtWkYA/DxN8eZ1u3P04UjtMLDE=" crossorigin="anonymous"></script>
  
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" integrity="sha256-zAFRMKqFIefwiPiImOupSczcv7ON8L0Sm0S3Jzw6b0E=" crossorigin="anonymous"></script>
  <style>
* {
  box-sizing: border-box;
}
html {
  height: 100%;
}
body {
  margin: 0;
  padding: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--background-default-grey);
  color: var(--text-default-grey);
  font-family:
    Marianne,
    arial,
    sans-serif;
  font-size: 1rem;
}
#skipLink:focus {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 9999;
  padding: .5rem 1rem;
  clip: auto;
  width: auto;
  height: auto;
  overflow: visible;
  white-space: nowrap;
  font-size: .875rem;
  background: var(--background-default-grey);
  color: var(--text-action-high-blue-france);
}
[hidden] {
  display: none;
}
main[hidden],
div[hidden],
section[hidden],
p[hidden],
button[hidden],
aside[hidden],
li[hidden],
ul[hidden],
span[hidden],
nav[hidden],
.fr-btn[hidden] {
  display: none;
}
.w-page {
  flex: 1;
  min-height: 0;
  display: flex;
}
.w-contenu {
  flex: 1;
  min-width: 0;
  min-height: 0;
  overflow-y: auto;
  padding: 1rem 1.5rem;
  color: var(--text-default-grey);
}
.w-contenu--principal {
  overflow: hidden;
  display: flex;
  flex-direction: column;
  padding: .75rem 1rem 1rem;
}
@supports (overflow-clip-margin: 1px) {
  .w-contenu--principal {
    overflow: clip;
    overflow-clip-margin: 2.5rem;
  }
}
.w-titre-vue {
  margin: 0;
}
.w-mention {
  color: var(--text-mention-grey);
  font-size: .8125rem;
  margin: 0;
}
.w-texte {
  font-size: .875rem;
  line-height: 1.55;
  margin: 0;
  color: var(--text-default-grey);
}
.w-mention-papier {
  display: none;
}
.w-bandeau {
  display: flex;
  align-items: center;
  gap: .625rem;
  padding: .5rem .75rem;
  background: var(--background-default-grey);
  border-bottom: 1px solid var(--border-default-grey);
  flex-shrink: 0;
  color: var(--text-default-grey);
}
#bandeau-logo {
  width: 80px;
  flex-shrink: 0;
}
.w-bandeau__logo-wrap {
  width: 100%;
}
.w-bandeau__marque {
  display: flex;
  align-items: center;
  gap: .75rem;
  flex-shrink: 0;
}
.w-bandeau__sep {
  width: 1px;
  align-self: stretch;
  margin: .25rem 0;
  background: var(--border-default-grey);
  flex-shrink: 0;
  color: var(--text-default-grey);
}
.w-bandeau__titre {
  font-size: 2rem;
  font-weight: 600;
  color: var(--text-title-blue-france);
  white-space: nowrap;
  margin: 0;
  line-height: 1;
}
.w-bandeau__aide-bloc {position:relative;flex-shrink:0;margin-left:auto}
.w-bandeau__version {position:absolute;right:0;bottom:100%;margin-bottom:.125rem;font-size:.75rem;line-height:1;color:var(--text-mention-grey);font-weight:400;white-space:nowrap}
.w-bandeau__homologue {
  margin-left: .5rem;
  white-space: nowrap;
}
.w-bandeau__homologue[hidden] {
  display: none;
}
.w-bandeau .fr-logo::after {
  display: none;
}
.w-bandeau__aide {
  margin-left: auto;
  flex-shrink: 0;
}
.w-loader {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9998;
  background: rgba(0, 0, 0, .5);
  color: var(--text-inverted-grey);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: .75rem;
}
.w-loader.actif {
  display: flex;
}
.w-loader__spinner {
  width: 32px;
  height: 32px;
  border: 3px solid var(--border-default-grey);
  border-top-color: var(--background-action-high-blue-france);
  border-radius: 50%;
  animation: wSpin .8s linear infinite;
}
@keyframes wSpin {
  to {
    transform: rotate(360deg);
  }
}
.w-loader__texte {
  font-size: .875rem;
  color: var(--text-inverted-grey);
}
.w-messages {
  position: fixed;
  z-index: 9997;
  right: 1rem;
  bottom: 1rem;
  width: min(26rem, calc(100% - 2rem));
  display: flex;
  flex-direction: column;
  gap: .5rem;
}
.w-erreur,
.w-toast {
  display: none;
  background: var(--background-default-grey);
  color: var(--text-default-grey);
}
.w-erreur.actif,
.w-toast.actif {
  display: block;
}
.w-toast__ligne {
  display: flex;
  align-items: center;
  gap: .75rem;
  flex-wrap: wrap;
}
.w-toast__ligne p {
  flex: 1 1 12rem;
  margin: 0;
}
.w-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9990;
  background: rgba(0, 0, 0, .5);
  color: var(--text-inverted-grey);
  align-items: center;
  justify-content: center;
  padding: 1rem;
}
.w-overlay.actif {
  display: flex;
}
.w-overlay--haut {
  z-index: 9995;
}
.w-dialogue {
  background: var(--background-default-grey);
  color: var(--text-default-grey);
  width: 100%;
  max-width: 44rem;
  max-height: 100%;
  display: flex;
  flex-direction: column;
}
.w-dialogue--etroit {
  max-width: 30rem;
}
.w-dialogue__tete {
  display: flex;
  align-items: flex-start;
  gap: .75rem;
  padding: 1.25rem 1.5rem .5rem;
}
.w-dialogue__tete > div {
  flex: 1;
}
.w-dialogue__titre {
  margin: 0;
}
.w-dialogue__corps {
  padding: .5rem 1.5rem 1rem;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: .25rem;
}
.w-dialogue__pied {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: .75rem;
  flex-wrap: wrap;
  padding: 1rem 1.5rem;
  border-top: 1px solid var(--border-default-grey);
}
.w-aide {
  width: 1.5rem;
  height: 1.5rem;
  flex-shrink: 0;
  padding: 0;
  margin: -.5rem 0 0 -.25rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 0;
  color: var(--text-action-high-blue-france);
  vertical-align: super;
}
.w-aide__rond {
  width: .875rem;
  height: .875rem;
  border-radius: 50%;
  border: 1px solid currentColor;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family:
    Georgia,
    "Times New Roman",
    serif;
  font-size: .75rem;
  font-weight: 700;
  font-style: italic;
  line-height: 1;
}
.w-aide[aria-expanded=true] .w-aide__rond {
  color: var(--text-inverted-blue-france);
  background: var(--background-action-high-blue-france);
  border-color: var(--border-action-high-blue-france);
}
.w-aide:focus-visible {
  outline: 2px solid var(--border-action-high-blue-france);
  outline-offset: 0;
}
.w-aide__texte {
  margin: .25rem 0 .5rem;
  padding: .75rem;
  font-size: .8125rem;
  line-height: 1.45;
  color: var(--text-default-grey);
  background: var(--background-default-grey);
  border: 1px solid var(--border-plain-grey);
}
.w-volet__bloc {
  display: flex;
  flex-direction: column;
  gap: .5rem;
}
.w-volet__bloc .fr-input,
.w-volet__bloc .fr-select {
  width: 100%;
  margin-top: 0;
}
.w-volet__bloc .fr-select-group,
.w-volet__bloc .fr-input-group {
  margin-bottom: .25rem;
}
.w-volet__h {
  margin: 0;
  font-size: 1rem;
  line-height: 1.5rem;
  font-weight: 700;
  color: var(--text-title-grey);
}
.w-volet__entete {
  display: flex;
  align-items: center;
  gap: .25rem;
}
.w-filtres-mobile {
  display: none;
}
.w-bulle {
  position: relative;
  overflow: visible !important;
}
.w-bulle[data-bulle]:hover::after,
.w-bulle[data-bulle]:focus-visible::after {
  content: attr(data-bulle);
  position: absolute;
  z-index: 30;
  left: 0;
  top: auto;
  bottom: 100%;
  margin-bottom: .375rem;
  white-space: nowrap;
  padding: .125rem .5rem;
  font-size: .75rem;
  font-weight: 400;
  background: var(--background-contrast-grey);
  color: var(--text-default-grey);
  border: 1px solid var(--border-plain-grey);
  pointer-events: none;
}
.w-barre__droite .w-bulle[data-bulle]:hover::after,
.w-barre__droite .w-bulle[data-bulle]:focus-visible::after {
  left: auto;
  right: 0;
}
.w-bulle--droite[data-bulle]:hover::after,
.w-bulle--droite[data-bulle]:focus-visible::after {
  left: auto;
  right: 0;
}
.w-bulle--cote[data-bulle]:hover::after,
.w-bulle--cote[data-bulle]:focus-visible::after {
  left: 0;
  top: auto;
  bottom: 100%;
  margin: 0 0 .375rem 0;
}
.w-barre {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .75rem;
  flex-wrap: wrap;
}
.w-barre__gauche {
  display: flex;
  align-items: center;
  gap: .75rem;
  flex-wrap: wrap;
  min-width: 0;
}
.w-barre__droite {
  display: flex;
  align-items: center;
  gap: .25rem;
  flex-wrap: wrap;
  margin-left: auto;
}
.w-compteurs {
  display: flex;
  gap: .25rem;
  flex-wrap: wrap;
  list-style: none;
  margin: 0;
  padding: 0;
}
.w-compteurs li {
  margin: 0;
  padding: 0;
}
.w-groupe-vues {
  display: flex;
  gap: 0;
  margin-right: .5rem;
}
.w-btn-ico {
  width: 2rem;
  min-height: 2rem;
  height: 2rem;
  padding: 0;
  justify-content: center;
}
.w-btn-ico svg {
  flex-shrink: 0;
  pointer-events: none;
}
.w-btn-ico--grand {
  width: 2.25rem;
  height: 2.25rem;
  min-height: 2.25rem;
}
.w-barre__sep {
  width: 1px;
  align-self: stretch;
  margin: .25rem .375rem;
  background: var(--border-default-grey);
}
.w-deux {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0 .75rem;
}
.w-liste {
  flex: 1;
  min-height: 0;
  overflow: auto;
  border: 1px solid var(--border-default-grey);
  background: var(--background-default-grey);
  color: var(--text-default-grey);
}
.w-tableau {
  width: 100%;
  border-collapse: collapse;
  font-size: .875rem;
}
.w-tableau th,
.w-tableau td {
  text-align: left;
  vertical-align: top;
  padding: .5rem .625rem;
  border-bottom: 1px solid var(--border-default-grey);
}
.w-tableau th {
  position: sticky;
  top: 0;
  z-index: 1;
  background: var(--background-alt-grey);
  color: var(--text-default-grey);
  font-weight: 700;
}
.w-aide-panneau {
  flex: 0 0 24rem;
  width: 24rem;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--background-contrast-yellow-tournesol);
  color: var(--text-default-grey);
  border-left: 1px solid var(--border-default-grey);
}
.w-aide-panneau[hidden] {
  display: none;
}
.w-aide-panneau__tete {
  display: flex;
  align-items: center;
  gap: .5rem;
  padding: .5rem .75rem;
  background: var(--background-contrast-yellow-tournesol);
  color: var(--text-default-grey);
}
.w-aide-panneau__icone {
  color: var(--text-action-high-blue-france);
  flex-shrink: 0;
}
.w-aide-panneau__titre {
  flex: 1;
  margin: 0;
  font-size: 1rem;
  line-height: 1.5;
  font-weight: 700;
  color: var(--text-title-grey);
}
.w-aide-panneau__onglets {
  order: 0;
  display: flex;
  flex-shrink: 0;
  gap: .25rem;
  margin: 0;
  padding: .25rem .75rem 0;
  list-style: none;
  overflow-x: auto;
  background: var(--background-contrast-yellow-tournesol);
  color: var(--text-default-grey);
  border-bottom: 1px solid var(--border-default-grey);
}
.w-aide-panneau__onglets > li {
  margin: 0;
  padding: 0;
  flex-shrink: 0;
}
.w-aide-panneau .fr-tabs__tab {
  display: inline-flex;
  align-items: center;
  margin: 0;
  padding: .375rem .625rem;
  border: 0;
  cursor: pointer;
  white-space: nowrap;
  font: inherit;
  font-size: .875rem;
  font-weight: 700;
  line-height: 1.5;
  background-color: var(--background-action-low-blue-france);
  color: var(--text-action-high-blue-france);
}
.w-aide-panneau .fr-tabs__tab[aria-selected=true] {
  background-color: var(--background-contrast-yellow-tournesol);
  color: var(--text-active-blue-france);
  box-shadow:
    inset 0 2px 0 var(--border-active-blue-france),
    inset 1px 0 0 var(--border-default-grey),
    inset -1px 0 0 var(--border-default-grey);
}
.w-aide-panneau .fr-tabs__tab:focus-visible {
  outline: 2px solid var(--border-action-high-blue-france);
  outline-offset: -2px;
}
.w-aide-panneau__corps {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 1rem .75rem 1.5rem;
  display: flex;
  flex-direction: column;
  gap: .75rem;
  font-size: .875rem;
  line-height: 1.5;
}
.w-aide-panneau__corps:focus-visible {
  outline: 2px solid var(--border-action-high-blue-france);
  outline-offset: 2px;
}
.w-aide-panneau__corps h3 {
  margin: .25rem 0 0;
  font-size: .875rem;
  line-height: 1.5;
  font-weight: 700;
  color: var(--text-title-grey);
}
.w-aide-panneau__corps p,
.w-aide-panneau__corps ol {
  margin: 0;
}
.w-aide-panneau__corps ul {
  margin: 0;
  padding-left: 1.25rem;
}
.w-fiche-etape {
  padding: .5rem .75rem;
  border-left: .25rem solid var(--border-default-grey);
  background: var(--background-default-grey);
  color: var(--text-default-grey);
}
.w-fiche-etape--courante {
  border-left-color: var(--border-action-high-blue-france);
  background: var(--background-alt-blue-france);
}
.w-fiche-etape h4 {
  margin: 0 0 .25rem;
  font-size: .875rem;
  display: flex;
  align-items: center;
  gap: .25rem;
}
.w-statut--erreur {
  color: var(--text-default-error);
}
.w-statut {
  margin: 0;
}
.w-grille {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr));
  gap: 1.25rem;
  align-items: start;
  padding: 1.25rem;
  background: var(--background-alt-grey);
  color: var(--text-default-grey);
}
.w-section {
  display: flex;
  flex-direction: column;
  gap: .875rem;
  min-width: 0;
  padding: 1.25rem 1.5rem 1.5rem;
  background: var(--background-default-grey);
  color: var(--text-default-grey);
  border: 1px solid var(--border-default-grey);
}
.w-section .fr-select-group,
.w-section .fr-input-group {
  margin-bottom: 0;
}
.w-section--large {
  grid-column: 1 / -1;
}
.w-grille--2 {
  grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
}
@media (max-width: 62em) {
  .w-grille--2 {
    grid-template-columns: minmax(0, 1fr);
  }
}
.w-section--danger {
  border-left: 4px solid var(--border-plain-error);
}
.w-section--apercu {
  border: 1px dashed var(--border-plain-grey);
}
.w-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.75rem;
  height: 1.75rem;
  margin-right: .5rem;
  border-radius: 50%;
  background: var(--background-action-high-blue-france);
  color: var(--text-inverted-blue-france);
  font-size: .875rem;
  flex: none;
  vertical-align: middle;
}
.w-section .w-titre-colonne {
  display: flex;
  align-items: center;
}
.w-grille-param {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(20rem, 1fr));
  gap: 2rem;
  align-items: start;
}
.w-colonne {
  display: flex;
  flex-direction: column;
  gap: .75rem;
  min-width: 0;
}
.w-titre-colonne {
  margin: 0;
  font-size: 1rem;
  font-weight: 700;
  color: var(--text-title-grey);
}
.w-titre-colonne-ligne {
  display: flex;
  align-items: center;
  gap: .25rem;
}
.w-zone-retrait {
  padding: 1rem;
  border: 1px solid var(--border-plain-error);
  display: flex;
  flex-direction: column;
  gap: .5rem;
  align-items: flex-start;
}
.w-encart-droits {
  padding: 1rem;
  border: 1px solid var(--border-default-grey);
  background: var(--background-alt-grey);
  color: var(--text-default-grey);
  display: flex;
  flex-direction: column;
  gap: .5rem;
}
.w-encart-droits ol {
  margin: 0;
  padding-left: 1.25rem;
  font-size: .875rem;
}
.w-encart-droits code {
  font-size: .8125rem;
  overflow-wrap: anywhere;
}
.w-tableau-simple {
  width: 100%;
  border-collapse: collapse;
  font-size: .875rem;
}
.w-tableau-simple th,
.w-tableau-simple td {
  text-align: left;
  padding: .375rem .5rem;
  border-bottom: 1px solid var(--border-default-grey);
}
.w-tableau-simple th {
  background: var(--background-alt-grey);
  color: var(--text-default-grey);
}
.w-vide {
  max-width: 40rem;
  margin: 2rem auto 0;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 1rem;
  align-items: center;
}
@media (max-width: 62em) {
  .w-aide-panneau {
    flex-basis: 20rem;
    width: 20rem;
  }
}
@media (max-width: 48em) {
  .w-contenu {
    padding: .75rem 1rem;
  }
  .w-contenu--principal {
    overflow-y: auto;
  }
  .w-filtres-mobile {
    display: inline-flex;
  }
  .w-aide-panneau {
    position: fixed;
    inset: 0;
    z-index: 9980;
    width: auto;
    flex: none;
    border-left: 0;
  }
  .w-overlay {
    padding: 0;
    align-items: stretch;
  }
  .w-dialogue,
  .w-dialogue--etroit {
    max-width: none;
    height: 100%;
  }
  .w-dialogue__corps {
    flex: 1;
  }
}
@media (max-width: 30em) {
  .w-bandeau {
    padding: .375rem .5rem;
  }
  .w-bandeau__marque {
    gap: .5rem;
    min-width: 0;
    flex-shrink: 1;
  }
  #bandeau-logo {
    width: 56px;
  }
  .w-bandeau__titre {
    font-size: 1rem;
  }
  .w-bandeau__version {
    font-size: .625rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .w-loader__spinner {
    animation: none;
  }
  * {
    scroll-behavior: auto;
  }
}
@media print {
  html,
  body {
    height: auto !important;
    overflow: visible !important;
    display: block !important;
  }
  .w-bandeau,
  .w-constr__panneau,
  .w-sorties-bas,
  .w-aide-panneau,

      etat.dernierAvisLenteur = Date.now();

}
async function initialiser() {
  if (_initialise) {
    return;
  }
  _initialise = true;
  try {
    etat.nomDoc = await gristAvecTimeout(grist.docApi.getDocName(), 5e3);
  } catch (e) {
    etat.nomDoc = null;
  }
  var pa = lirePref("aide", null);
  if (pa) {
    etat.aide.onglet = typeof pa.onglet === "number" ? pa.onglet : 0;
  }
  await chargerTout();
  if (pa && pa.ouverte) {
    etat.aide.ouverte = true;
    var p = document.getElementById("wAide");
    if (p) {
      p.hidden = false;
      rendreAide();
    }
    var b = document.getElementById("bAide");
    if (b) {
      b.setAttribute("aria-expanded", "true");
      b.classList.remove("fr-btn--secondary");
    }
  }
  relayer(chargerLogo(), "Logo du bandeau");
}
function brancherSocle() {
  var v = document.getElementById("bandeauVersion");
  if (v) {
    v.textContent = "v" + VERSION_WIDGET + (ESSAI_WIDGET ? " · essai " + ESSAI_WIDGET : "");
  }
  var h = document.getElementById("bandeauHomologue");
  if (h) {
    h.hidden = !HOMOLOGUE;
  }
  document.getElementById("wErreurFermer").addEventListener("click", masquerErreur);
  document.getElementById("wConfirmOui").addEventListener("click", function() {
    terminerConfirmation(true);
  });
  document.getElementById("wConfirmNon").addEventListener("click", function() {
    terminerConfirmation(false);
  });
  document.getElementById("bAide").addEventListener("click", function() {
    ouvrirAide(!etat.aide.ouverte);
  });
  document.addEventListener("keydown", function(e) {
    if (e.key !== "Escape" || document.getElementById("wConfirmOverlay").classList.contains("actif") || etat.dialogue) {
      return;
    }
    if (etat.aide.ouverte && document.getElementById("wAide").contains(document.activeElement)) {
      ouvrirAide(false);
    }
  });
}
function demarrer() {
  brancherSocle();
  if (typeof grist === "undefined") {
    afficherLogoRepli();
    rendreMessage("hors");
    return;
  }
  grist.ready({ requiredAccess: "full", allowSelectBy: false });
  if (typeof grist.onOptions === "function") {
    grist.onOptions(function(options, interaction) {
      var b = badgeValide(options && options.copie);
      if (b !== etat.badge) {
        etat.badge = b;
        if (_initialise) {
          relayer(chargerTout(), "Changement du réglage de la page");
        }
      }
      var avant = etat.niveauAcces;
      etat.niveauAcces = interaction && interaction.accessLevel ? interaction.accessLevel : etat.niveauAcces;
      if (avant !== etat.niveauAcces) {
        logSecurite("INFO", "Niveau d'accès accordé : " + etat.niveauAcces);
        if (_initialise && avant && etat.niveauAcces !== "full") {
          rendreMessage("acces");
        }
      }
    });
  }
  if (typeof grist.on === "function") {
    grist.on("message", function(m) {
      if (m && m.settings && m.settings.accessLevel) {
        etat.niveauAcces = m.settings.accessLevel;
      }
    });
  }
  grist.onRecords(function() {
    if (!_initialise) {
      relayer(initialiser(), "Initialisation");
    } else {
      planifierRafraichissement();
    }
  });
  setTimeout(function() {
    relayer(initialiser(), "Initialisation");
  }, DELAI_DEMARRAGE_MS);
  _minuterieActualisation = setInterval(function() {
    if (document.visibilityState === "visible" && etat.vue === "principal") {
      relayer(rafraichir(false), "Relecture");
    }
  }, DELAI_ACTUALISATION_MS);
  document.addEventListener("visibilitychange", function() {
    if (document.visibilityState === "visible" && etat.vue === "principal") {
      planifierRafraichissement();
    }
  });
  setTimeout(function() {
    window.addEventListener("unhandledrejection", function(evt) {
      logSecurite("ERREUR", "Promesse rejetée non capturée", evt ? evt.reason : void 0);
    });
  }, 1500);
}
demarrer();

(function () {
    var cible = document.querySelector('.w-bandeau__titre');
    if (!cible || typeof MutationObserver === 'undefined') {
        return;
    }
    var marquer = function () {
        var marche = document.createTreeWalker(cible, NodeFilter.SHOW_TEXT);
        var n = marche.nextNode();
        while (n) {
            var i = n.parentNode && n.parentNode.classList && n.parentNode.classList.contains('w-wuit') ? -1 : n.nodeValue.search(/Wuit(?=[A-Z])/);
            if (i !== -1) {
                var reste = n.splitText(i);
                reste.nodeValue = reste.nodeValue.slice(4);
                var s = document.createElement('span');
                s.className = 'w-wuit';
                s.textContent = 'Wuit';
                reste.parentNode.insertBefore(s, reste);
                return;
            }
            n = marche.nextNode();
        }
    };
    marquer();
    new MutationObserver(marquer).observe(cible, { childList: true, characterData: true, subtree: true });
})();
