<!DOCTYPE html>
<!--
  ============================================================================
  READ ME - Diploworkflow
  ============================================================================
  Version     : 1.0.3
  Date        : 16/11/2026
  Auteur      : DNUM / MEAE - Centre de Service No-Code (CSNC)
  Plateforme  : Diplotable
  Conformité  : DSFR v1.13.1 | RGAA 4.1.2 | OWASP/ANSSI
  ============================================================================

  DESCRIPTION
  -----------
  Diploworkflow : tableau blanc de la série wuit wuit, dans l'esprit des
  outils de tableau blanc collaboratif. Deux usages dans un même widget :
  - schématiser un processus (logigramme : début, étapes, décisions, fin,
    connecteurs avec libellés « Oui » / « Non ») ;
  - animer un atelier (post-it par colonnes, couleurs par thème, votes).
  Toile sans limite : déplacement de la vue, zoom (molette avec Ctrl,
  pincement sur tablette), grille magnétique, mini-carte, sections qui
  emportent leur contenu quand on les déplace.
  Outils : Sélectionner, Déplacer la vue, Post-it, Forme (rectangle, pilule,
  ovale, losange, parallélogramme), Texte, Connecteur, Section.
  Sélection au clic, au lasso ou à Ctrl+A ; déplacement à la souris, au doigt
  ou aux flèches du clavier (alternative au glisser-déposer) ; barre
  d'actions sur la sélection (couleur, forme, libellé, fiche liée, votes,
  dupliquer, premier plan, supprimer) ; « Annuler » après chaque écriture.
  Chaque élément est une ligne de table : fiche de l'élément (libellé,
  description, responsable, statut, pièces jointes) et lien vers une ligne
  d'une autre table du document (fiche liée, contenu affiché dans la fiche).
  Plusieurs tableaux blancs par document, en onglets. Vue toile et vue liste.
  Travail à plusieurs : les ajouts des autres personnes apparaissent dès
  qu'ils sont enregistrés (relecture toutes les quelques secondes).
  Sorties : impression, PDF (par la fenêtre d'impression), image PNG,
  export CSV des éléments.

  Assistant de création : Point de départ (« J'ai déjà des données » : les
  lignes d'une table deviennent des post-it reliés à leur ligne ; « Je n'ai
  pas encore de données » : six modèles en tuiles), Les tables, Formes et
  couleurs, La fiche, Affichage et filtres, Récapitulatif.
  Paramétrages : Général (nom, description, tables, droits, suppression),
  Formes et couleurs, La fiche, Affichage et filtres. Enregistrement
  automatique.

  HISTORIQUE
  ----------
  1.0.3 - 16/11/2026 - CSNC - Onglets au style du systeme de design, comme
          Diploverse : « Nouveau tableau blanc » avec l'icone +, actif pendant
          la creation ; navigation aux fleches.
  1.0.2 - 16/11/2026 - CSNC - Création : onglet actif « Nouveau tableau blanc »
          (titre en double retiré) ; assistant et paramétrages en pleine
          largeur.
  1.0.1 - 16/11/2026 - CSNC - Emoji du widget : 🔀 (flux) au lieu de la pièce de
          puzzle, dans le bandeau et le nom de la table des éléments.
  1.0.0 - 16/11/2026 - CSNC - Version initiale, d'après les maquettes
          validées le 16/11/2026 (écran principal, mode atelier, fiche d'un
          élément, assistant).

  DÉPENDANCES
  ------------
  - DSFR v1.13.1 (dsfr.min.css, utility.min.css)
  - Grist Plugin API (grist-plugin-api.js), chargée depuis
    docs.getgrist.com : origine imposée par la plateforme, URL non
    versionnée, donc non couverte par une empreinte SRI
  - DOMPurify v3.4.17 (assainissement du logo SVG de la bibliothèque)

  INTÉGRITÉ DES RESSOURCES (SRI)
  -------------------------------
  Chaque ressource CDN en version épinglée porte une empreinte
  integrity="sha256-..." et crossorigin="anonymous".
  Non couvert : grist-plugin-api.js, URL non versionnée.

  TABLES ET COLONNES
  ------------------
  🔀 ÉLÉMENTS DU TABLEAU BLANC ⚡ (ELEMENTS_DU_TABLEAU_BLANC_), partagée par
  tous les tableaux blancs du document : TABLEAU (identifiant du tableau),
  TYPE (Forme, Post-it, Texte, Section), FORME, LIBELLE, DESCRIPTION,
  COULEUR (nom d'une couleur du système de design), POSITION_X, POSITION_Y,
  LARGEUR, HAUTEUR, ORDRE (premier plan), RESPONSABLE, STATUT, VOTES,
  FICHE_TABLE et FICHE_LIGNE (ligne liée d'une autre table), PIECES_JOINTES,
  CREE_LE, CREE_PAR, MODIFIE_LE, MODIFIE_PAR.
  🔗 LIENS DU TABLEAU BLANC ⚡ (LIENS_DU_TABLEAU_BLANC_) : TABLEAU, DE et VERS
  (références vers les éléments), LIBELLE, STYLE, FLECHE, métadonnées.
  Réglages : 📦 BIBLIOTHÈQUE CENTRALE ⚡, lignes WIDGET = « Diploworkflow »
  (CLE = CONFIG, ACCES_EDITION, ACCES_PARAMETRAGE). La ligne CONFIG décrit
  tous les tableaux blancs du document (nom, légende, fiche, affichage).
  Les pages créées avec les tables sont supprimées aussitôt. Chaque table et
  chaque colonne créée reçoit une description. Les tables de l'utilisatrice
  ne sont jamais modifiées : une table source est seulement lue.

  DROITS REQUIS
  --------------
  Accès complet au document. Les boutons sont masqués d'après les lignes
  témoins ACCES_EDITION et ACCES_PARAMETRAGE de la bibliothèque centrale ;
  la protection réelle vient des règles d'accès du document. Un refus
  d'écriture général fait passer l'interface en consultation seule.

  SÉCURITÉ
  ---------
  - Aucune exécution de code dynamique, aucun accès au cadre parent
  - DOM construit par textContent et setAttribute ; seul le logo SVG passe
    par innerHTML, après DOMPurify
  - Image PNG produite à partir d'un SVG construit par le widget (textes
    échappés), sans contenu externe
  - Pièces jointes : jeton demandé juste avant l'usage, jamais placé dans
    un lien ou un attribut de la page ; taille et extension contrôlées
  - Journalisation via logSecurite(), messages d'erreur neutres
  - Confirmations dans la page, écouteurs posés par addEventListener

  HOMOLOGATION
  -------------
  Badge masqué tant que HOMOLOGUE vaut false.

  ACCESSIBILITÉ
  --------------
  Lien d'évitement, éléments de la toile atteignables au clavier (Tab),
  déplacement aux flèches, Entrée pour modifier le libellé, Suppr pour
  supprimer ; vue liste équivalente à la toile ; zone aria-live ; focus
  visible ; prefers-reduced-motion et forced-colors respectés ; couleur
  jamais seule porteuse d'information (libellés de la légende dans la fiche
  et la liste).

  THÈME
  ------
  data-fr-theme="light", par cohérence avec l'application hôte.
-->

  <style>

  /* SECTION : BANDEAU MEAE */
    .w-bandeau{display:flex;align-items:center;gap:.625rem;padding:.5rem .75rem;background:var(--background-default-grey);border-bottom:1px solid var(--border-default-grey);flex-shrink:0;color:var(--text-default-grey)}
    #bandeau-logo{width:80px;flex-shrink:0}
    .w-bandeau__logo-wrap{width:100%}
        .w-bandeau__marque{display:flex;align-items:center;gap:.75rem;flex-shrink:0}
    .w-bandeau__sep{width:1px;align-self:stretch;margin:.25rem 0;background:var(--border-default-grey);flex-shrink:0; color: var(--text-default-grey); }
    .w-bandeau__titre{font-size:2rem;font-weight:600;color:var(--text-title-blue-france);white-space:nowrap;margin:0;line-height:1}

    .w-onglets { flex-shrink: 0; padding: .75rem 1.5rem 0; background: var(--background-default-grey); color: var(--text-default-grey); }
    .w-onglets .fr-tabs__list { margin: 0; padding: 0; flex-wrap: wrap; }

  /* === SECTION : LOADER ET MESSAGES ===

    .w-loader { display: none; position: fixed; inset: 0; z-index: 9998;
      /* Voile de superposition : seule couleur ecrite en dur admise, le jeton

      background: rgba(0,0,0,.5); color: var(--text-inverted-grey); flex-direction: column; align-items: center; justify-content: center; gap: .75rem; }

    .w-loader__spinner { width: 32px; height: 32px; border: 3px solid var(--border-default-grey);

    @keyframes wSpin { to { transform: rotate(360deg); } }
    .w-loader__texte { font-size: .875rem; color: var(--text-inverted-grey); }
    .w-messages { position: fixed; z-index: 9997; right: 1rem; bottom: 1rem; width: min(26rem, calc(100% - 2rem)); display: flex; flex-direction: column; gap: .5rem; }

    .w-overlay--haut { z-index: 9995; }
    .w-dialogue { background: var(--background-default-grey); color: var(--text-default-grey); width: 100%; max-width: 44rem;

    .w-dialogue__tete { display: flex; align-items: flex-start; gap: .75rem; padding: 1.25rem 1.5rem .5rem; }

  /* === SECTION : AIDE "i" === */
    .w-aide { width: 1.5rem; height: 1.5rem; flex-shrink: 0; padding: 0; margin: -.5rem 0 0 -.25rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
      background: transparent; border: 0; color: var(--text-action-high-blue-france); vertical-align: super; }
    .w-aide__rond { width: .875rem; height: .875rem; border-radius: 50%; border: 1px solid currentColor; display: inline-flex; align-items: center; justify-content: center;
      font-family: Georgia, 'Times New Roman', serif; font-size: .75rem; font-weight: 700; font-style: italic; line-height: 1; }
    .w-aide[aria-expanded="true"] .w-aide__rond { color: var(--text-inverted-blue-france); background: var(--background-action-high-blue-france); border-color: var(--border-action-high-blue-france); }
    .w-aide:focus-visible { outline: 2px solid var(--border-action-high-blue-france); outline-offset: 0; }

    .w-disposition { display: flex; gap: 1rem; flex: 1; min-height: 0; }
    .w-volet { flex: 0 0 17rem; min-height: 0; display: flex; background: var(--background-alt-grey); border-left: .25rem solid var(--border-action-high-blue-france); color: var(--text-default-grey); }
    .w-volet__contenu { flex: 1; min-width: 0; overflow-y: auto; padding: .75rem 1rem 1rem; display: flex; flex-direction: column; gap: 1.25rem; }

    .w-volet__bloc .fr-select-group, .w-volet__bloc .fr-input-group { margin-bottom: .25rem; }
    .w-volet__h { margin: 0; font-size: 1rem; line-height: 1.5rem; font-weight: 700; color: var(--text-title-grey); }
    .w-volet__entete { display: flex; align-items: center; gap: .25rem; }

    .w-volet__poignee::before { content: ''; position: absolute; top: 50%; left: 50%; width: .25rem; height: 1.75rem; margin: -.875rem 0 0 -.125rem;
      border-left: 1px solid var(--border-plain-grey); border-right: 1px solid var(--border-plain-grey); }
    .w-volet__poignee:hover { background: var(--background-contrast-grey); color: var(--text-default-grey); }

      background: var(--fond-el, var(--background-default-grey)); }

  /* === SECTION : BARRE AU-DESSUS DE L'AFFICHAGE === */
    .w-principal { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: .5rem; }

  /* === SECTION : BOUTONS A ICONE DESSINEE ===

    .w-monde { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
    .w-calque-liens { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; }
    .w-el { position: absolute; display: flex; align-items: center; justify-content: center; text-align: center; padding: .375rem .5rem;
      font-size: .875rem; line-height: 1.3; color: var(--text-default-grey); cursor: default; overflow: visible; }
    .w-el:focus { outline: none; }
    .w-el:focus-visible { outline: 2px dashed var(--border-action-high-blue-france); outline-offset: 7px; }
    .w-el__fond { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .w-el__texte { position: relative; max-width: 100%; max-height: 100%; overflow: hidden; overflow-wrap: anywhere; white-space: pre-wrap; pointer-events: none; }
    .w-el--postit { justify-content: flex-start; align-items: flex-start; text-align: left; padding: .625rem .75rem 1.5rem;

    .w-carte-liee dd { margin: 0; overflow-wrap: anywhere; }

    .w-pj__nom { flex: 1; min-width: 0; overflow-wrap: anywhere; }

  /* === SECTION : VUE LISTE === */

  /* === SECTION : PANNEAU D'AIDE ===
     Panneau a droite, fond jaune post-it, qui resserre la page sans la
     recouvrir. Ferme, il n'est pas affiche du tout. Style de reference :
     Diplokanban v1.4.0, identique dans tous les widgets. */
    .w-aide-panneau { flex: 0 0 24rem; width: 24rem; min-height: 0; display: flex; flex-direction: column; overflow: hidden;
      background: var(--background-contrast-yellow-tournesol); color: var(--text-default-grey); border-left: 1px solid var(--border-default-grey); }
    /* Ferme (attribut hidden), le panneau ne doit pas s'afficher : sa regle
       display: flex l'emporterait sur le hidden du navigateur. */
    .w-aide-panneau[hidden] { display: none; }
    .w-aide-panneau__tete { display: flex; align-items: center; gap: .5rem; padding: .5rem .75rem; background: var(--background-contrast-yellow-tournesol); color: var(--text-default-grey); }
    .w-aide-panneau__icone { color: var(--text-action-high-blue-france); flex-shrink: 0; }

    .w-aide-panneau__onglets { order: 0; display: flex; flex-shrink: 0; gap: .25rem; margin: 0; padding: .25rem .75rem 0; list-style: none; overflow-x: auto;

    .w-aide-panneau__onglets > li { margin: 0; padding: 0; flex-shrink: 0; }

      font: inherit; font-size: .875rem; font-weight: 700; line-height: 1.5; background-color: var(--background-action-low-blue-france); color: var(--text-action-high-blue-france); }

    .w-modele { display: flex; flex-direction: column; padding: 0; text-align: left; cursor: pointer; font: inherit; color: var(--text-default-grey);

    .w-encart-droits { padding: 1rem; border: 1px solid var(--border-default-grey); background: var(--background-alt-grey); color: var(--text-default-grey); display: flex; flex-direction: column; gap: .5rem; }

  /* === SECTION : AGRANDIR ===

  /* === SECTION : ECRANS ETROITS === */

    }

      .w-scene { flex-direction: column; }

      .w-legende-param > li { grid-template-columns: auto 1fr; }
      .w-overlay { padding: 0; align-items: stretch; }

    }
    @media (max-width: 30em) {

      .w-bandeau__marque { gap: .5rem; min-width: 0; flex-shrink: 1; }
      #bandeau-logo { width: 56px; }
      .w-bandeau__titre { font-size: 1rem; }

/** Journalisation. Niveaux admis : 'ERREUR', 'AVERTISSEMENT', 'INFO'. */
function logSecurite(niveau, message, details) {
  var ligne = '[' + new Date().toISOString() + '] [' + niveau + '] ' + message;
  if (niveau === 'ERREUR') {
    if (details !== undefined) { console.error(ligne, details); } else { console.error(ligne); }
  } else if (niveau === 'AVERTISSEMENT') {
    if (details !== undefined) { console.warn(ligne, details); } else { console.warn(ligne); }
  } else {
    if (details !== undefined) { console.log(ligne, details); } else { console.log(ligne); }
  }
}

var _loaderTimeout = null;
var _loaderDelai = null;

function afficherLoader(message) {
  if (_loaderTimeout) { clearTimeout(_loaderTimeout); }
  _loaderTimeout = setTimeout(function () {
    masquerLoader();
    logSecurite('AVERTISSEMENT', 'Voile de chargement masque automatiquement apres 60 s');
  }, 60000);
  var texte = document.getElementById('loaderMessage');
  if (texte) { texte.textContent = message || 'Chargement…'; }
  /* Le voile n'apparait qu'au-dela du seuil : une operation breve ne
     provoque plus de clignotement de l'ecran. masquerLoader annule ce
     delai, donc le voile n'est jamais pose pour une operation rapide. */
  var voileEnCours = document.getElementById('loader');
  if (voileEnCours && voileEnCours.classList.contains('actif')) { return; }
  if (_loaderDelai) { return; }
  _loaderDelai = setTimeout(function () {
    _loaderDelai = null;
    var voile = document.getElementById('loader');
    if (voile) { voile.classList.add('actif'); }
  }, 250);
}

/* void offsetHeight force un reflow avant le retrait de la classe. */
function masquerLoader() {
  if (_loaderTimeout) { clearTimeout(_loaderTimeout); _loaderTimeout = null; }
  if (_loaderDelai) { clearTimeout(_loaderDelai); _loaderDelai = null; }
  var voile = document.getElementById('loader');
  if (voile) { void voile.offsetHeight; voile.classList.remove('actif'); }
}

var _minuterieErreur = null;

function afficherErreur(message, erreur) {
  logSecurite('ERREUR', message, erreur);
  var bandeau = document.getElementById('wErreur');
  var texte = document.getElementById('wErreurMsg');
  if (texte) { texte.textContent = message || 'Une erreur est survenue.'; }
  if (bandeau) { bandeau.classList.add('actif'); }
  if (_minuterieErreur) { clearTimeout(_minuterieErreur); }
  _minuterieErreur = setTimeout(masquerErreur, 10000);
}

function masquerErreur() {
  if (_minuterieErreur) { clearTimeout(_minuterieErreur); _minuterieErreur = null; }
  var bandeau = document.getElementById('wErreur');
  if (bandeau) { bandeau.classList.remove('actif'); }
}

function relayer(promesse, quoi) {
  if (promesse && typeof promesse.catch === 'function') {
    promesse.catch(function (e) { logSecurite('AVERTISSEMENT', quoi, e); });
  }
  return promesse;
}

function echapperHTML(texte) {
  if (!texte && texte !== 0) return '';
  var div = document.createElement('div');
  div.textContent = String(texte);
  /* Les guillemets sont echappes en plus des chevrons : la sortie alimente
     aussi des valeurs d'attributs (title, data-*, value), ou un guillemet
     non echappe permettrait de sortir de l'attribut. */
  return div.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function estTableExclue(tid) {
  if (!tid) { return true; }
  var brut = String(tid);
  var up = brut.toUpperCase();
  if (brut.indexOf('_grist') === 0) { return true; }
  if (brut.indexOf('GristHidden_') === 0) { return true; }
  if (brut === 'GristDocTour') { return true; }
  if (up === 'BIBLIOTHEQUE_CENTRALE') { return true; }
  if (up.indexOf('BIBLIOTHEQUE') !== -1 && brut.charAt(brut.length - 1) === '_') { return true; }
  if (up.indexOf('ONLY') !== -1) { return true; }
  if (up.indexOf('_SUMMARY_') !== -1 || up.indexOf('GRISTSUMMARY_') !== -1) { return true; }
  return false;
}

/* === SECTION : LOGO DU BANDEAU ===
   Logo commun aux widgets CSNC : meme SVG, meme assainissement, meme repli
   sur le bloc marque du systeme de design. */
/* Assainissement du contenu enrichi : point de passage unique de tout ce qui
   est insere comme balisage (logo SVG de la bibliotheque). Le filtrage repose
   sur DOMPurify, profil SVG, avec une liste de balises interdites. Si la
   bibliotheque n'est pas chargee, la fonction renvoie null : l'appelant
   affiche alors le logo de repli, et aucun balisage n'est insere sans
   assainissement. */
var TAILLE_MAX_SVG = 200000;
function purifierHTML(contenu, usage) {
  if (typeof DOMPurify === 'undefined' || !DOMPurify.isSupported) {
    logSecurite('AVERTISSEMENT', 'Bibliotheque d assainissement indisponible : contenu enrichi non insere');
    return null;
  }
  if (usage !== 'svg') { return null; }
  return DOMPurify.sanitize(String(contenu), {
    USE_PROFILES: { svg: true },
    FORBID_TAGS: ['style', 'foreignObject', 'image', 'use', 'a', 'animate', 'animateTransform', 'animateMotion', 'set']
  });
}
/** Insere le logo SVG de la bibliotheque apres assainissement. Le contenu
    vient d'une table editable : il passe par purifierHTML, et sa taille est
    bornee avant analyse. */
function injecterSvgSecurise(container, svgTexte) {
  container.textContent = '';
  if (!svgTexte) { return false; }
  if (String(svgTexte).length > TAILLE_MAX_SVG) {
    logSecurite('AVERTISSEMENT', 'Logo trop volumineux, ignore');
    return false;
  }
  var propre = purifierHTML(svgTexte, 'svg');
  if (!propre) { return false; }
  var wrap = document.createElement('div');
  wrap.className = 'w-bandeau__logo-wrap';
  wrap.innerHTML = propre;
  var svg = wrap.firstElementChild;
  if (!svg || wrap.children.length !== 1 || String(svg.nodeName).toLowerCase() !== 'svg') {
    logSecurite('AVERTISSEMENT', 'Logo hors format SVG');
    return false;
  }
  // Logo decoratif : le nom du ministere figure deja dans le bandeau (RGAA 1.2)
  svg.setAttribute('aria-hidden', 'true');
  svg.setAttribute('focusable', 'false');
  container.appendChild(wrap);
  return true;
}
/** Revele le bloc marque DSFR quand le SVG de la bibliotheque est indisponible. */
function afficherLogoRepli() {
  // Le bloc marque n'existe pas dans le balisage : il est cree ici, et
  // uniquement si le SVG partage n'a pas pu etre affiche. Aucun element
  // masque ne peut donc apparaitre fugitivement au chargement.
  var c = document.getElementById('bandeau-logo');
  if (!c || document.getElementById('logoRepli')) { return; }
  c.textContent = '';
  var p = document.createElement('p');
  p.className = 'fr-logo';
  p.id = 'logoRepli';
  p.style.fontSize = '.38rem';
  p.appendChild(document.createTextNode('Ministère'));
  p.appendChild(document.createElement('br'));
  p.appendChild(document.createTextNode("de l'Europe"));
  p.appendChild(document.createElement('br'));
  p.appendChild(document.createTextNode('et des Affaires'));
  p.appendChild(document.createElement('br'));
  p.appendChild(document.createTextNode('étrangères'));
  c.appendChild(p);
}

/* Le logo est lu dans la bibliotheque centrale quand le document en possede
   une, comme dans les autres widgets. Si elle existe sans logo, il y est
   depose. Ce widget ne cree jamais la bibliotheque centrale : sans elle, le
   logo genere est affiche directement. */
async function chargerLogo() {
  var container = document.getElementById('bandeau-logo');
  if (!container) { return; }
  var logoSvg = null;
  try {
    var centrale = trouverTable('BIBLIOTHEQUE_CENTRALE');
    if (centrale) {
      var data = await lireTable(centrale);
      for (var i = 0; i < data.id.length; i++) {
        if ((data.WIDGET ? data.WIDGET[i] : '') === '__RESSOURCE__' && (data.NOM ? data.NOM[i] : '') === 'LOGO_SVG') {
          logoSvg = data.CONTENU ? data.CONTENU[i] : '';
          break;
        }
      }
      if (!logoSvg) {
        logoSvg = genererLogoMEAE();
        try { await agir([['AddRecord', centrale, null, { WIDGET: '__RESSOURCE__', NOM: 'LOGO_SVG', CONTENU: logoSvg }]]); logSecurite('INFO', 'Logo MEAE stocké dans la bibliothèque centrale'); } catch (e) { logSecurite('INFO', 'Stockage logo non possible', e); }
      }
    }
  } catch (e) {
    logSecurite('INFO', 'Chargement logo depuis biblio non possible', e);
  }
  if (!logoSvg) { logoSvg = genererLogoMEAE(); }
  if (!injecterSvgSecurise(container, logoSvg)) { afficherLogoRepli(); }
}

/* === SECTION : RETOURS A L'AGENT (specifique) ===
   Un seul message ponctuel a la fois, en bas a droite : confirmation,
   bouton Annuler eventuel. Les erreurs passent par afficherErreur(). */
function afficherToast(message, actions, duree) {
  logSecurite('INFO', message);
  var t = document.getElementById('wToast');
  var m = document.getElementById('wToastMsg');
  var z = document.getElementById('wToastActions');
  if (!t || !m || !z) { return; }
  m.textContent = message;
  vider(z);
  (actions || []).forEach(function (a) { z.appendChild(a); });
  t.classList.add('actif');

function creer(tag, o, enfants) {
  var n = document.createElement(tag);
  o = o || {};
  if (o.classe) { n.className = o.classe; }
  if (o.id) { n.id = o.id; }
  if (o.texte !== undefined && o.texte !== null) { n.textContent = String(o.texte); }
  if (o.attrs) {
    Object.keys(o.attrs).forEach(function (k) {
      var v = o.attrs[k];
      if (v === null || v === undefined || v === false) { return; }
      n.setAttribute(k, v === true ? '' : String(v));
    });
  }
  if (tag === 'button' && !n.hasAttribute('type')) { n.setAttribute('type', 'button'); }
  if (tag === 'input' || tag === 'select' || tag === 'textarea') { n.setAttribute('autocomplete', 'off'); }
  if (o.valeur !== undefined && o.valeur !== null) { n.value = String(o.valeur); }
  if (o.coche) { n.checked = true; }
  if (o.clic) { n.addEventListener('click', o.clic); }
  if (o.change) { n.addEventListener('change', o.change); }
  if (o.saisie) { n.addEventListener('input', o.saisie); }
  (enfants || []).forEach(function (e) {
    if (e === null || e === undefined || e === false) { return; }
    n.appendChild(typeof e === 'string' ? document.createTextNode(e) : e);
  });
  return n;
}

/* === SECTION : COULEURS ===
   La couleur d'un element passe par les variables du systeme de design ;
   une valeur inconnue retombe sur le blanc. */
function nomCouleurSur(c) {
  var v = String(c || '').trim().toLowerCase();
  return /^[a-z]+(-[a-z]+)*$/.test(v) ? v : 'blanc';
}

function fondCouleur(c) {

  return n === 'blanc' ? 'var(--background-default-grey)' : 'var(--background-contrast-' + n + ', var(--background-default-grey))';
}

function bordCouleur(c) {
  var n = nomCouleurSur(c);
  return n === 'blanc' ? 'var(--border-plain-grey)' : 'var(--background-action-high-' + n + ', var(--border-plain-grey))';
}

function appliquerCouleur(n, couleur) {
  n.style.setProperty('--fond-el', fondCouleur(couleur));
  n.style.setProperty('--bord-el', bordCouleur(couleur));
}

function nomCouleur(c) {
  var n = nomCouleurSur(c);
  for (var i = 0; i < COULEURS.length; i++) { if (COULEURS[i][0] === n) { return COULEURS[i][1]; } }
  return n;
}

function sansAccent(s) { return String(s === null || s === undefined ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function normaliserTexte(s) { return sansAccent(s).toLowerCase().replace(/[’'`]/g, ' ').replace(/[^a-z0-9]+/g, ' ').trim(); }

var MOIS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
/* Dates : secondes Unix ; affichage au format JJ MMM AAAA dans le fuseau de
   Paris. */
function formaterDate(sec) {
  if (typeof sec !== 'number' || !sec) { return ''; }
  var p = {};
  new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Paris', year: 'numeric', month: '2-digit', day: '2-digit' })
    .formatToParts(new Date(sec * 1000)).forEach(function (x) { p[x.type] = x.value; });
  return parseInt(p.day, 10) + ' ' + MOIS[parseInt(p.month, 10) - 1] + ' ' + p.year;
}

function aujourdhui() {
  var d = new Date();
  return d.getDate() + ' ' + MOIS[d.getMonth()] + ' ' + d.getFullYear();
}

function pluriel(n, un, plusieurs) { return n + ' ' + (n > 1 ? plusieurs : un); }

function heure() { var d = new Date(); return (d.getHours() < 10 ? '0' : '') + d.getHours() + ' h ' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes(); }

/* === SECTION : ACCES A L'API === */
function gristAvecTimeout(promesse, delaiMs) {
  return Promise.race([promesse, new Promise(function (_, rejeter) {
    setTimeout(function () { rejeter(new Error('Délai dépassé')); }, delaiMs);
  })]);
}

/* Une lecture sans reponse est relancee avec un delai croissant ; les
   ecritures ne sont jamais rejouees. */
async function lireTable(tid) {
  var delais = [10000, 20000, DELAI_API_MS];
  var derniere = null;
  for (var essai = 0; essai < delais.length; essai++) {
    try {
      return await gristAvecTimeout(grist.docApi.fetchTable(tid), delais[essai]);
    } catch (e) {
      derniere = e;
      logSecurite('AVERTISSEMENT', 'Lecture de ' + tid + ' sans réponse, nouvel essai', e);
      if (essai < delais.length - 1) { await new Promise(function (ok) { setTimeout(ok, 1000); }); }
    }
  }
  throw derniere;
}

function estRefusDroits(e) {
  var m = String((e && (e.message || e)) || '');
  return /blocked by|access rules|acl_deny|permission|not allowed|insufficient|read.?only|viewer/i.test(m);
}

/* Point de passage unique des ecritures. */
async function agir(actions) {
  etat.ecrituresEnCours++;
  try {
    return await gristAvecTimeout(grist.docApi.applyUserActions(actions), DELAI_API_MS);
  } catch (e) {
    if (estRefusDroits(e)) { logSecurite('INFO', 'Écriture refusée par les règles d\'accès', e); }
    throw e;
  } finally {
    etat.ecrituresEnCours--;
  }
}

/* Une cellule en erreur arrive sous la forme ['E', ...] : elle vaut vide. */
function valeurCellule(v) { return Array.isArray(v) && v[0] === 'E' ? '' : v; }
function cellule(d, col, i) { return d && col && d[col] ? valeurCellule(d[col][i]) : undefined; }
function texteCellule(d, col, i) { var v = cellule(d, col, i); return v === null || v === undefined ? '' : (typeof v === 'object' ? '' : String(v)); }
function refCellule(d, col, i) { var v = cellule(d, col, i); return typeof v === 'number' && v > 0 ? v : 0; }
function nombreCellule(d, col, i, defaut) { var v = cellule(d, col, i); return typeof v === 'number' && isFinite(v) ? v : defaut; }
function refsCellule(d, col, i) { var v = cellule(d, col, i); return Array.isArray(v) && v[0] === 'L' ? v.slice(1).filter(function (x) { return typeof x === 'number'; }) : []; }

/* Texte lisible d'une cellule de n'importe quelle table (fiche liee). */
function texteLisible(v) {
  v = valeurCellule(v);
  if (v === null || v === undefined || v === '') { return ''; }
  if (typeof v === 'boolean') { return v ? 'Oui' : 'Non'; }
  if (Array.isArray(v)) { return v[0] === 'L' ? v.slice(1).map(texteLisible).filter(Boolean).join(', ') : ''; }
  if (typeof v === 'object') { return ''; }
  return String(v);
}

/* === SECTION : METADONNEES DU DOCUMENT ===
   Les tables sont reperees dans _grist_Tables (jamais listTables, qui rend
   des noms affiches). */
async function chargerMeta() {
  var t = await lireTable('_grist_Tables');
  var c = await lireTable('_grist_Tables_column');
  var tables = {}, parRef = {};
  for (var i = 0; i < t.id.length; i++) {
    var tid = t.tableId[i];
    tables[tid] = { ref: t.id[i], tableId: tid, primaryViewId: t.primaryViewId ? t.primaryViewId[i] : 0,
      rawViewSectionRef: t.rawViewSectionRef ? t.rawViewSectionRef[i] : 0, resume: t.summarySourceTable ? !!t.summarySourceTable[i] : false };
    parRef[t.id[i]] = tid;
  }
  var colonnes = {}, colParRef = {};
  for (var j = 0; j < c.id.length; j++) {
    var tidC = parRef[c.parentId[j]];
    if (!tidC) { continue; }
    var opts = {};
    try { opts = c.widgetOptions && c.widgetOptions[j] ? JSON.parse(c.widgetOptions[j]) : {}; } catch (e) { opts = {}; }
    var info = { ref: c.id[j], tableId: tidC, colId: c.colId[j], type: c.type[j] || 'Any', label: c.label ? (c.label[j] || c.colId[j]) : c.colId[j],
      formule: Boolean(c.isFormula[j]) && Boolean(c.formula[j]), formuleVide: Boolean(c.isFormula[j]) && !c.formula[j],
      declencheur: !c.isFormula[j] && Boolean(c.formula[j]), recalcWhen: c.recalcWhen ? c.recalcWhen[j] : 0,
      recalcDeps: c.recalcDeps ? c.recalcDeps[j] : null, options: opts, pos: c.parentPos ? c.parentPos[j] : j };
    colParRef[c.id[j]] = info;
    if (!colonnes[tidC]) { colonnes[tidC] = []; }
    colonnes[tidC].push(info);
  }
  Object.keys(colonnes).forEach(function (k) { colonnes[k].sort(function (a, b) { return a.pos - b.pos; }); });
  try {
    var vs = await lireTable('_grist_Views_section');
    var titres = {};
    for (var v = 0; v < vs.id.length; v++) { titres[vs.id[v]] = vs.title ? vs.title[v] : ''; }
    Object.keys(tables).forEach(function (k) { tables[k].libelle = titres[tables[k].rawViewSectionRef] || ''; });
  } catch (e) { logSecurite('AVERTISSEMENT', 'Noms des tables illisibles', e); }
  etat.meta = { tables: tables, colonnes: colonnes, colParRef: colParRef };
}

function libelleTable(tid) {
  var t = etat.meta.tables[tid];
  return (t && t.libelle) || String(tid || '').replace(/_+$/, '').replace(/_/g, ' ');
}

function infoColonne(tid, colId) {
  var l = etat.meta.colonnes[tid] || [];
  for (var i = 0; i < l.length; i++) { if (l[i].colId === colId) { return l[i]; } }
  return null;
}

/* Colonnes affichables d'une table de l'utilisatrice : sans les colonnes
   techniques (manualSort, colonnes d'affichage des references). */
function colonnesVisibles(tid) {
  return (etat.meta.colonnes[tid] || []).filter(function (c) {
    return c.colId !== 'manualSort' && c.colId.indexOf('gristHelper_') !== 0 && c.colId !== 'id';
  });
}

/* Recherche tolerante : les soulignes finaux (ajoutes par l'eclair du nom
   affiche) et un suffixe numerique sont ignores. */
function trouverTable(motif) {
  var up = String(motif).toUpperCase();
  var ids = Object.keys(etat.meta.tables);
  for (var i = 0; i < ids.length; i++) { if (ids[i].toUpperCase().indexOf(up) !== -1) { return ids[i]; } }
  return null;
}

function trouverTableExacte(base, colRequise) {
  var re = new RegExp('^' + base + '\\d*_*$');
  var ids = Object.keys(etat.meta.tables).filter(function (t) { return re.test(t.toUpperCase()) && !etat.meta.tables[t].resume; });
  ids.sort(function (a, b) { return a.length - b.length; });
  for (var i = 0; i < ids.length; i++) { if (!colRequise || infoColonne(ids[i], colRequise)) { return ids[i]; } }
  return null;
}

function trouverCentrale() {
  var ids = Object.keys(etat.meta.tables);
  for (var i = 0; i < ids.length; i++) { if (ids[i].toUpperCase().replace(/_+$/, '') === ID_CENTRALE) { return ids[i]; } }
  return null;
}

/* Tables de l'utilisatrice proposees comme source ou comme fiche liee. */
function tablesUtilisatrice() {
  return Object.keys(etat.meta.tables).filter(function (t) {
    return !estTableExclue(t) && !etat.meta.tables[t].resume && t !== etat.tables.el && t !== etat.tables.li;
  }).sort(function (a, b) { return libelleTable(a).localeCompare(libelleTable(b), 'fr'); });
}

/* Colonne a afficher par defaut pour une table : la premiere colonne de
   texte. */
function colonneParDefaut(tid) {
  var l = colonnesVisibles(tid);
  for (var i = 0; i < l.length; i++) { if (/^Text/.test(l[i].type)) { return l[i].colId; } }
  return l.length ? l[0].colId : '';
}

/* === SECTION : STRUCTURE DES TABLES ===
   Les tables de l'utilisatrice ne sont jamais renommees ni retypees : le
   widget cree seulement ses deux tables et les complete. */
function resoudreTables() {
  var cfg = etat.config && etat.config.tables ? etat.config.tables : {};
  DEFS.forEach(function (d) {
    var t = cfg[d.cle] && etat.meta.tables[cfg[d.cle]] && infoColonne(cfg[d.cle], d.colRequise) ? cfg[d.cle] : null;
    etat.tables[d.cle] = t || trouverTableExacte(d.base, d.colRequise);
  });
}

function typeReel(type) { return String(type).replace('@EL', etat.tables.el || DEF_EL.base); }

function structureManquante() {
  var manque = { centrale: !etat.centrale, tables: [], colonnes: [] };
  DEFS.forEach(function (d) {
    var tid = etat.tables[d.cle];
    if (!tid) { manque.tables.push(d); return; }
    d.colonnes.forEach(function (c) { if (!infoColonne(tid, c.id)) { manque.colonnes.push({ def: d, col: c }); } });
  });
  manque.vide = !manque.centrale && !manque.tables.length && !manque.colonnes.length;
  return manque;
}

async function poserDescription(tid, colId, texte) {
  if (!texte) { return; }
  try { await agir([['ModifyColumn', tid, colId, { description: texte }]]); }
  catch (e) { logSecurite('INFO', 'Description non posée sur ' + tid + '.' + colId, e); }
}

async function poserDescriptionTable(tid, texte) {
  try {
    await chargerMeta();
    var t = etat.meta.tables[tid];
    if (t && t.rawViewSectionRef) { await agir([['UpdateRecord', '_grist_Views_section', t.rawViewSectionRef, { description: texte }]]); }
  } catch (e) { logSecurite('INFO', 'Description de la table ' + tid + ' non posée', e); }
}

/* Nom affiche d'une table creee par le widget, puis relecture de son
   identifiant (le renommage peut le changer). */
async function nommerTable(tid, titre, base, colRequise) {
  var ref = null;
  try {
    await chargerMeta();
    var t = etat.meta.tables[tid];
    ref = t ? t.ref : null;
    if (t && t.rawViewSectionRef) { await agir([['UpdateRecord', '_grist_Views_section', t.rawViewSectionRef, { title: titre }]]); }
    await chargerMeta();
  } catch (e) { logSecurite('AVERTISSEMENT', 'Renommage de ' + tid + ' non abouti', e); }
  /* Identifiant relu par la reference interne de la table : la colonne
     requise (une reference) peut ne pas exister encore. */
  if (ref !== null) {
    var ids = Object.keys(etat.meta.tables);
    for (var i = 0; i < ids.length; i++) { if (etat.meta.tables[ids[i]].ref === ref) { return ids[i]; } }
  }
  return trouverTableExacte(base, colRequise) || tid;
}

/* Creation des tables en un seul envoi (id, type et label seulement : les
   formules, references et options suivent colonne par colonne). Les pages
   creees avec elles sont supprimees aussitot. */
async function creerTablesNues(defs) {
  var ret = await agir(defs.map(function (d) {
    return ['AddTable', d.id, d.colonnes.map(function (c) { return { id: c.id, type: c.type, label: c.label || c.id }; })];
  }));
  var rv = ret && ret.retValues ? ret.retValues : [];
  var tids = defs.map(function (d, i) { return rv[i] && rv[i].table_id ? rv[i].table_id : d.id; });
  var vues = [];
  rv.forEach(function (r) { if (r && Array.isArray(r.views)) { r.views.forEach(function (v) { if (v && v.id && vues.indexOf(v.id) === -1) { vues.push(v.id); } }); } });
  await chargerMeta();
  tids.forEach(function (t) { var m = etat.meta.tables[t]; if (m && m.primaryViewId && vues.indexOf(m.primaryViewId) === -1) { vues.push(m.primaryViewId); } });
  if (vues.length) {
    try { await agir(vues.map(function (v) { return ['RemoveRecord', '_grist_Views', v]; })); }
    catch (e) { logSecurite('INFO', 'Suppression des pages créées avec les tables non possible', e); }
  }
  return tids;
}

/* Ajout d'une colonne : creee nue, puis typee ; isFormula: false est
   indispensable pour une colonne de donnees. L'identifiant reel est relu. */
async function ajouterColonne(tid, c) {
  var ret = await agir([['AddColumn', tid, c.id, {}]]);
  var reel = ret && ret.retValues && ret.retValues[0] && ret.retValues[0].colId ? ret.retValues[0].colId : c.id;
  await typerColonne(tid, reel, c);
  return reel;
}

async function typerColonne(tid, colId, c) {
  var propr = { type: typeReel(c.type), label: c.label || colId };
  if (c.calcul) { propr.isFormula = true; propr.formula = c.calcul; }
  else if (c.formula) { propr.isFormula = false; propr.formula = c.formula; propr.recalcWhen = c.recalcWhen || 0; propr.recalcDeps = null; }
  else { propr.isFormula = false; }
  if (c.widgetOptions) { propr.widgetOptions = JSON.stringify(c.widgetOptions); }
  if (c.description) { propr.description = c.description; }
  try {
    await agir([['ModifyColumn', tid, colId, propr]]);
  } catch (e) {
    /* Repli : une plateforme sans descriptions refuserait tout l'ensemble. */
    delete propr.description;
    await agir([['ModifyColumn', tid, colId, propr]]);
    await poserDescription(tid, colId, c.description);
  }
  if (c.affichage) { await poserAffichageRef(tid, colId, c.affichage); }
}

/* Colonne affichee d'une reference (LIBELLE de la table des elements). */
async function poserAffichageRef(tid, colId, colAffichee) {
  try {
    await chargerMeta();
    var col = infoColonne(tid, colId);
    var cible = String(col && col.type || '').replace(/^Ref(List)?:/, '');
    var vis = infoColonne(cible, colAffichee);
    if (!col || !vis) { return; }
    await agir([['ModifyColumn', tid, colId, { visibleCol: vis.ref }], ['SetDisplayFormula', tid, null, col.ref, '$' + colId + '.' + colAffichee]]);
  } catch (e) { logSecurite('INFO', 'Colonne affichée non posée pour ' + tid + '.' + colId, e); }
}

/* Mise en place ou complement de toute la structure. Ordre : centrale,
   tables manquantes (colonnes simples), colonnes manquantes dans l'ordre des
   dependances (references apres la creation de la table cible). */
async function completerStructure() {
  await chargerMeta();
  etat.centrale = trouverCentrale();
  if (!etat.centrale) {
    var cols = COLONNES_CENTRALE_TYPES.map(function (x) { return { id: x[0], type: x[1], label: x[0].replace(/_/g, ' ') }; });
    var tc = await creerTablesNues([{ id: ID_CENTRALE, colonnes: cols }]);
    etat.centrale = await nommerTable(tc[0], LABEL_CENTRALE, ID_CENTRALE, 'WIDGET');
    for (var k = 0; k < COLONNES_META.length; k++) { await typerColonne(etat.centrale, COLONNES_META[k].id, COLONNES_META[k]); }
    await poserDescriptionTable(etat.centrale, DESCRIPTION_CENTRALE);
  } else {
    for (var u = 0; u < COLONNES_CENTRALE_UTILES.length; u++) {
      if (!infoColonne(etat.centrale, COLONNES_CENTRALE_UTILES[u])) { await ajouterColonne(etat.centrale, { id: COLONNES_CENTRALE_UTILES[u], type: 'Text', label: COLONNES_CENTRALE_UTILES[u].replace(/_/g, ' ') }); }
    }
  }
  resoudreTables();
  var aCreer = DEFS.filter(function (d) { return !etat.tables[d.cle]; });
  var nouvelles = [];
  if (aCreer.length) {
    var defs = aCreer.map(function (d) {
      return { id: d.base, def: d, colonnes: d.colonnes.filter(function (c) { return !c.calcul && c.type.indexOf('@') === -1; }).map(function (c) { return { id: c.id, type: c.type, label: c.label }; }) };
    });
    var tids = await creerTablesNues(defs);
    for (var i = 0; i < defs.length; i++) {
      var d = defs[i].def;
      etat.tables[d.cle] = await nommerTable(tids[i], d.titre, d.base, d.colRequise);
      nouvelles.push(d.cle);
    }
  }
  await chargerMeta();
  for (var t = 0; t < DEFS.length; t++) {
    var def = DEFS[t];
    var tid = etat.tables[def.cle];
    if (!tid) { continue; }
    var neuve = nouvelles.indexOf(def.cle) !== -1;
    for (var c = 0; c < def.colonnes.length; c++) {
      var col = def.colonnes[c];
      if (!infoColonne(tid, col.id)) { await ajouterColonne(tid, col); await chargerMeta(); }
      else if (neuve) { await typerColonne(tid, col.id, col); }
    }
    for (var m = 0; m < COLONNES_META.length; m++) {
      if (!infoColonne(tid, COLONNES_META[m].id)) { await ajouterColonne(tid, COLONNES_META[m]); }
    }
    if (neuve) { await poserDescriptionTable(tid, def.description); }
    await chargerMeta();
  }
  return nouvelles;
}

/* === SECTION : BIBLIOTHEQUE CENTRALE ===
   Une ligne CONFIG (JSON, tous les tableaux blancs du document) et deux
   lignes temoins des droits, toutes avec WIDGET = Diploworkflow. Une ligne
   temoin illisible signale une regle d'acces qui retire ce droit. */
async function lireCentrale() {
  etat.centrale = trouverCentrale();
  etat.config = null; etat.configLigne = null;
  etat.temoins = { edition: false, param: false, aucun: true };
  if (!etat.centrale) { return; }
  var d = await lireTable(etat.centrale);
  for (var i = 0; i < d.id.length; i++) {
    if (texteCellule(d, 'WIDGET', i) !== NOM_WIDGET) { continue; }
    var cle = texteCellule(d, 'CLE', i);
    if (cle === CLE_ACCES_EDITION) { etat.temoins.edition = true; etat.temoins.aucun = false; }
    if (cle === CLE_ACCES_PARAMETRAGE) { etat.temoins.param = true; etat.temoins.aucun = false; }
    if (cle === CLE_CONFIG) {
      etat.configLigne = d.id[i];
      try { etat.config = JSON.parse(texteCellule(d, 'VALEUR', i) || '{}'); } catch (e) { etat.config = {}; logSecurite('AVERTISSEMENT', 'Réglages illisibles', e); }
    }
  }
  if (etat.config) { normaliserConfig(etat.config); }
}

/* Complete un reglage lu (versions anterieures, saisie a la main). */
function normaliserConfig(cfg) {
  if (!Array.isArray(cfg.tableaux)) { cfg.tableaux = []; }
  cfg.tableaux = cfg.tableaux.filter(function (t) { return t && typeof t.id === 'string' && t.id; });
  cfg.tableaux.forEach(function (t) {
    t.nom = String(t.nom || 'Tableau blanc');
    t.description = String(t.description || '');
    if (!Array.isArray(t.legende)) { t.legende = []; }
    t.legende = t.legende.filter(function (l) { return l && typeof l.couleur === 'string'; }).map(function (l) { return { couleur: nomCouleurSur(l.couleur), libelle: String(l.libelle || '') }; });
    t.fiche = Object.assign({ table: '', colonne: '' }, t.fiche || {});
    t.source = Object.assign({ table: '', colonne: '', couleur: '' }, t.source || {});
    t.affichage = Object.assign({}, AFFICHAGE_DEFAUT, t.affichage || {});
    t.champs = Object.assign({}, CHAMPS_DEFAUT, t.champs || {});
    t.filtres = Object.assign({}, FILTRES_DEFAUT, t.filtres || {});
  });
  return cfg;
}

function majDroits() {
  var complet = etat.niveauAcces === null || etat.niveauAcces === 'full';
  if (etat.temoins.aucun) {
    /* Sans lignes temoins lisibles : l'ecriture tranchera. */
    etat.peutModifier = complet;
    etat.peutParametrer = complet;
  } else {
    etat.peutModifier = complet && etat.temoins.edition;
    etat.peutParametrer = complet && etat.temoins.param;
  }
}

async function ecrireConfig() {
  if (!etat.centrale) { return; }
  var cfg = normaliserConfig(Object.assign({ version: 1 }, etat.config || {}));
  cfg.tables = { el: etat.tables.el, li: etat.tables.li };
  var valeur = JSON.stringify(cfg);
  var actions = [];
  if (etat.configLigne) {
    actions.push(['UpdateRecord', etat.centrale, etat.configLigne, { VALEUR: valeur, VERSION_MODIF: VERSION_WIDGET }]);
  } else {
    actions.push(['AddRecord', etat.centrale, null, { WIDGET: NOM_WIDGET, CLE: CLE_CONFIG, VALEUR: valeur, VERSION_CREATION: VERSION_WIDGET, VERSION_MODIF: VERSION_WIDGET }]);
    if (etat.temoins.aucun) {
      actions.push(['AddRecord', etat.centrale, null, { WIDGET: NOM_WIDGET, CLE: CLE_ACCES_EDITION, VALEUR: 'Ligne témoin : lisible par les personnes qui peuvent modifier les tableaux blancs.', VERSION_CREATION: VERSION_WIDGET, VERSION_MODIF: VERSION_WIDGET }]);
      actions.push(['AddRecord', etat.centrale, null, { WIDGET: NOM_WIDGET, CLE: CLE_ACCES_PARAMETRAGE, VALEUR: 'Ligne témoin : lisible par les personnes qui peuvent paramétrer les tableaux blancs.', VERSION_CREATION: VERSION_WIDGET, VERSION_MODIF: VERSION_WIDGET }]);
    }
  }
  var ret = await agir(actions);
  if (!etat.configLigne && ret && ret.retValues) { etat.configLigne = ret.retValues[0]; etat.temoins = { edition: true, param: true, aucun: false }; }
  etat.config = cfg;
}

function tableaux() { return etat.config && etat.config.tableaux ? etat.config.tableaux : []; }
function tableauCourant() {
  var l = tableaux();
  for (var i = 0; i < l.length; i++) { if (l[i].id === etat.tableauId) { return l[i]; } }
  return null;
}

/* === SECTION : DONNEES ===
   Lecture des deux tables du widget (tous les tableaux blancs), et des
   tables liees au tableau courant (fiche liee, source). La signature evite de
   redessiner quand rien n'a change. */
async function chargerDonnees() {
  var te = etat.tables.el, tl = etat.tables.li;
  var t = tableauCourant();
  var liees = [];
  if (t && t.fiche.table && etat.meta.tables[t.fiche.table]) { liees.push(t.fiche.table); }
  if (t && t.source.table && etat.meta.tables[t.source.table] && liees.indexOf(t.source.table) === -1) { liees.push(t.source.table); }
  var lectures = [te ? lireTable(te) : Promise.resolve(null), tl ? lireTable(tl) : Promise.resolve(null)];
  liees.forEach(function (x) { lectures.push(lireTable(x).catch(function (e) { logSecurite('AVERTISSEMENT', 'Table liée illisible : ' + x, e); return null; })); });
  var r = await Promise.all(lectures);
  var signature = JSON.stringify(r) + '|' + liees.join(',');
  if (signature === etat.signature) { return false; }
  etat.signature = signature;
  var de = r[0], dl = r[1];
  var elements = [];
  if (de) {
    for (var i = 0; i < de.id.length; i++) {
      var type = texteCellule(de, 'TYPE', i);
      if (TYPES.indexOf(type) === -1) { type = 'Post-it'; }
      var forme = texteCellule(de, 'FORME', i);
      if (FORMES.indexOf(forme) === -1) { forme = 'Rectangle'; }
      var taille = TAILLES[type];
      elements.push({ id: de.id[i], tableau: texteCellule(de, 'TABLEAU', i), type: type, forme: forme,
        libelle: texteCellule(de, 'LIBELLE', i), description: texteCellule(de, 'DESCRIPTION', i), couleur: nomCouleurSur(texteCellule(de, 'COULEUR', i)),
        x: nombreCellule(de, 'POSITION_X', i, 0), y: nombreCellule(de, 'POSITION_Y', i, 0),
        w: Math.max(20, nombreCellule(de, 'LARGEUR', i, taille[0])), h: Math.max(20, nombreCellule(de, 'HAUTEUR', i, taille[1])),
        ordre: nombreCellule(de, 'ORDRE', i, 0), responsable: texteCellule(de, 'RESPONSABLE', i), statut: texteCellule(de, 'STATUT', i),
        votes: Math.max(0, Math.round(nombreCellule(de, 'VOTES', i, 0))), ficheTable: texteCellule(de, 'FICHE_TABLE', i), ficheLigne: Math.max(0, Math.round(nombreCellule(de, 'FICHE_LIGNE', i, 0))),
        pj: refsCellule(de, 'PIECES_JOINTES', i),
        creeLe: cellule(de, 'CREE_LE', i), creePar: texteCellule(de, 'CREE_PAR', i), majLe: cellule(de, 'MODIFIE_LE', i), majPar: texteCellule(de, 'MODIFIE_PAR', i) });
    }
  }
  var liens = [];
  if (dl) {
    for (var j = 0; j < dl.id.length; j++) {
      var fl = texteCellule(dl, 'FLECHE', j);
      liens.push({ id: dl.id[j], tableau: texteCellule(dl, 'TABLEAU', j), de: refCellule(dl, 'DE', j), vers: refCellule(dl, 'VERS', j),
        libelle: texteCellule(dl, 'LIBELLE', j), style: texteCellule(dl, 'STYLE', j) === 'Pointillés' ? 'Pointillés' : 'Plein', fleche: FLECHES.indexOf(fl) === -1 ? 'Vers la fin' : fl });
    }
  }
  etat.elements = elements;
  etat.liens = liens;
  etat.fiches = {};
  liees.forEach(function (x, k) {
    var d = r[2 + k];
    if (!d) { return; }
    var parId = {};
    for (var n = 0; n < d.id.length; n++) { parId[d.id[n]] = n; }
    etat.fiches[x] = { d: d, parId: parId };
  });
  indexer();
  return true;
}

function indexer() {
  etat.parId = {}; etat.lienParId = {};
  etat.elements.forEach(function (e) { etat.parId[e.id] = e; });
  etat.liens.forEach(function (l) { etat.lienParId[l.id] = l; });
  etat.selection = etat.selection.filter(function (id) { return etat.parId[id] && etat.parId[id].tableau === etat.tableauId; });
  if (etat.lienSel && !etat.lienParId[etat.lienSel]) { etat.lienSel = null; }
  if (etat.fiche && !etat.parId[etat.fiche]) { etat.fiche = null; }
}

function elementsDuTableau() {
  var id = etat.tableauId;
  return etat.elements.filter(function (e) { return e.tableau === id; });
}

function liensDuTableau() {
  var id = etat.tableauId;
  return etat.liens.filter(function (l) { return l.tableau === id && etat.parId[l.de] && etat.parId[l.vers] && etat.parId[l.de].tableau === id && etat.parId[l.vers].tableau === id; });
}

/* Texte d'une ligne liee : colonne choisie dans le reglage du tableau, ou
   premiere colonne de texte. */
function texteLigneLiee(tid, ligne, colonne) {
  var f = etat.fiches[tid];
  if (!f || f.parId[ligne] === undefined) { return ''; }
  var col = colonne && f.d[colonne] ? colonne : colonneParDefaut(tid);
  return texteLisible(f.d[col] ? f.d[col][f.parId[ligne]] : '');
}

function ligneLieeExiste(e) {
  return !!(e.ficheTable && e.ficheLigne && etat.fiches[e.ficheTable] && etat.fiches[e.ficheTable].parId[e.ficheLigne] !== undefined);
}

function colonneAffichee(tid) {
  var t = tableauCourant();
  if (t && t.fiche.table === tid && t.fiche.colonne) { return t.fiche.colonne; }
  if (t && t.source.table === tid && t.source.colonne) { return t.source.colonne; }
  return colonneParDefaut(tid);
}

function libelleAffiche(e) {
  if (e.libelle) { return e.libelle; }
  if (e.ficheTable && e.ficheLigne) { return texteLigneLiee(e.ficheTable, e.ficheLigne, colonneAffichee(e.ficheTable)); }
  return '';
}

function libelleCourt(e) {
  var l = libelleAffiche(e).replace(/\s+/g, ' ').trim();
  return l ? (l.length > 60 ? l.slice(0, 57) + '…' : l) : (e.type === 'Section' ? 'Section sans titre' : e.type + ' sans texte');
}

/* Sens d'une couleur dans la legende du tableau courant. */
function sensCouleur(c) {
  var t = tableauCourant();
  if (!t) { return ''; }
  for (var i = 0; i < t.legende.length; i++) { if (t.legende[i].couleur === c) { return t.legende[i].libelle; } }
  return '';
}

function libelleCouleur(c) { var s = sensCouleur(c); return s ? s + ' (' + nomCouleur(c) + ')' : nomCouleur(c); }

/* Section qui contient le centre d'un element : la plus petite. */
function sectionDe(e, liste) {
  var cx = e.x + e.w / 2, cy = e.y + e.h / 2;
  var meilleure = null;
  (liste || elementsDuTableau()).forEach(function (s) {
    if (s.type !== 'Section' || s.id === e.id) { return; }
    if (cx >= s.x && cx <= s.x + s.w && cy >= s.y && cy <= s.y + s.h) {
      if (!meilleure || s.w * s.h < meilleure.w * meilleure.h) { meilleure = s; }
    }
  });
  return meilleure;
}

/* Elements entierement contenus dans une section (emportes avec elle). */
function contenusDe(s, liste) {
  return (liste || elementsDuTableau()).filter(function (e) {
    return e.id !== s.id && e.x >= s.x && e.y >= s.y && e.x + e.w <= s.x + s.w && e.y + e.h <= s.y + s.h;
  });
}

/* === SECTION : FILTRES ===
   Sur la toile, un element ecarte par les filtres est estompe (le schema
   reste lisible) ; dans la liste, il est retire. */
function filtresActifs() {
  var f = etat.filtres;
  var n = 0;
  if (f.texte.trim()) { n++; }
  if (f.section) { n++; }
  if (f.responsable) { n++; }
  if (f.statut) { n++; }
  if (Object.keys(f.masquees).some(function (k) { return f.masquees[k]; })) { n++; }
  return n;
}

function passeFiltres(e, liste) {
  if (e.type === 'Section') { return true; }
  var f = etat.filtres;
  if (f.masquees[e.couleur]) { return false; }
  if (f.texte.trim()) {
    var q = normaliserTexte(f.texte);
    var t = normaliserTexte(libelleAffiche(e) + ' ' + e.description + ' ' + e.responsable);
    if (q.split(' ').some(function (m) { return t.indexOf(m) === -1; })) { return false; }
  }
  if (f.section) { var s = sectionDe(e, liste); if (!s || String(s.id) !== f.section) { return false; } }
  if (f.responsable && (f.responsable === '__vide__' ? e.responsable : e.responsable !== f.responsable)) { return false; }
  if (f.statut && (f.statut === '__vide__' ? e.statut : e.statut !== f.statut)) { return false; }
  return true;
}

function clePref(nom) { return 'diploworkflow:' + (etat.nomDoc || 'document') + ':' + nom; }

  try { var v = window.localStorage.getItem(clePref(nom)); return v === null ? defaut : JSON.parse(v); } catch (e) { return defaut; }

function ecrirePref(nom, valeur) {
  try { window.localStorage.setItem(clePref(nom), JSON.stringify(valeur)); } catch (e) { logSecurite('INFO', 'Préférence non retenue par le navigateur : ' + nom, e); }
}

/* === SECTION : ONGLETS DES TABLEAUX BLANCS ===
   Onglets du systeme de design, comme Diploverse et Diplokanban : un onglet
   par tableau blanc, puis « Nouveau tableau blanc » (icone +), actif pendant
   la creation. Fleches, Debut et Fin passent d'un onglet a l'autre. */
function rendreOnglets() {
  var nav = document.getElementById('wOnglets');
  if (!nav) { return; }
  vider(nav);
  var l = tableaux();
  var creation = etat.vue === 'creation';
  var visible = (etat.vue === 'principal' || etat.vue === 'parametrage' || creation) && (l.length || etat.peutParametrer);
  nav.hidden = !visible;
  if (!visible) { return; }
  var ul = creer('ul', { classe: 'fr-tabs__list', attrs: { role: 'tablist', 'aria-label': 'Tableaux blancs du document' } });
  var onglets = [], activer = [];
  l.forEach(function (t, i) {
    var actif = !creation && t.id === etat.tableauId;
    onglets.push(creer('button', { classe: 'fr-tabs__tab w-onglet', id: 'wOnglet' + i, texte: t.nom,
      attrs: { role: 'tab', 'aria-selected': actif ? 'true' : 'false', 'aria-controls': 'contenu', tabindex: actif ? '0' : '-1' } }));
    activer.push(function () {
      if (creation) { etat.creation = null; }
      choisirTableau(t.id); etat.param = null; etat.vue = 'principal';
      etat.signature = '';
      relayer(chargerDonnees().then(rendrePrincipal), 'Changement de tableau');
    });
  });
  if (etat.peutParametrer) {
    onglets.push(creer('button', { classe: 'fr-tabs__tab fr-tabs__tab--icon-left fr-icon-add-line w-onglet', id: 'wOngletNouveau', texte: 'Nouveau tableau blanc',
      attrs: { role: 'tab', 'aria-selected': creation ? 'true' : 'false', 'aria-controls': 'contenu', tabindex: creation ? '0' : '-1' } }));
    activer.push(function () { if (!creation) { ouvrirCreation(); } });
  }
  if (!onglets.some(function (b) { return b.getAttribute('tabindex') === '0'; }) && onglets.length) { onglets[0].setAttribute('tabindex', '0'); }
  onglets.forEach(function (b, i) {
    b.addEventListener('click', function () { activer[i](); var f = document.getElementById(b.id); if (f) { f.focus(); } });
    b.addEventListener('keydown', function (e) {
      var n = onglets.length;
      var k = { ArrowRight: (i + 1) % n, ArrowLeft: (i + n - 1) % n, Home: 0, End: n - 1 }[e.key];
      if (k === undefined) { return; }
      e.preventDefault();
      onglets[k].focus();
      activer[k]();
    });
    ul.appendChild(creer('li', { attrs: { role: 'presentation' } }, [b]));
  });
  nav.appendChild(ul);
}

/* Blocs du volet reconstruits apres chaque changement ; le focus est repose

    if (t.filtres.section && sections.length) {
      var selS = liste('vSection', sections.map(function (s) { return { valeur: String(s.id), libelle: libelleCourt(s) }; }), etat.filtres.section, { vide: 'Toutes' });
      selS.addEventListener('change', function () { etat.filtres.section = selS.value; majVolet(); majApresFiltre(); });
      bf.appendChild(groupeListe('Section', selS));

      nonSections.forEach(function (e) { if (e.responsable && resp.indexOf(e.responsable) === -1) { resp.push(e.responsable); } });

        var selR = liste('vResponsable', opts, etat.filtres.responsable, { vide: 'Tous' });
        selR.addEventListener('change', function () { etat.filtres.responsable = selR.value; majVolet(); majApresFiltre(); });
        bf.appendChild(groupeListe('Responsable', selR));

  }

/* Dessin de tout le contenu du tableau. */

/* Forme dessinee en SVG a la taille reelle de l'element : le trait garde
   son epaisseur quelle que soit la taille. */
function dessinForme(forme, w, h) {
  var ns = 'http://www.w3.org/2000/svg';
  var s = document.createElementNS(ns, 'svg');
  s.setAttribute('class', 'w-el__fond');
  s.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
  s.setAttribute('preserveAspectRatio', 'none');
  s.setAttribute('aria-hidden', 'true');
  var m = 1;
  var f;
  if (forme === 'Ovale') {
    f = document.createElementNS(ns, 'ellipse');
    f.setAttribute('cx', String(w / 2)); f.setAttribute('cy', String(h / 2)); f.setAttribute('rx', String(Math.max(1, w / 2 - m))); f.setAttribute('ry', String(Math.max(1, h / 2 - m)));
  } else if (forme === 'Losange') {
    f = document.createElementNS(ns, 'polygon');
    f.setAttribute('points', [w / 2, m, w - m, h / 2, w / 2, h - m, m, h / 2].join(' '));
  } else if (forme === 'Parallélogramme') {
    var d = Math.min(w * 0.18, 30);
    f = document.createElementNS(ns, 'polygon');
    f.setAttribute('points', [d, m, w - m, m, w - d, h - m, m, h - m].join(' '));
  } else {
    f = document.createElementNS(ns, 'rect');
    f.setAttribute('x', String(m)); f.setAttribute('y', String(m)); f.setAttribute('width', String(Math.max(1, w - 2 * m))); f.setAttribute('height', String(Math.max(1, h - 2 * m)));
    if (forme === 'Pilule') { var r = Math.max(1, (Math.min(w, h) - 2 * m) / 2); f.setAttribute('rx', String(r)); f.setAttribute('ry', String(r)); }
  }
  f.style.fill = 'var(--fond-el)';
  f.style.stroke = 'var(--bord-el)';
  f.style.strokeWidth = '1.5';
  s.appendChild(f);
  return s;
}

function construireElement(e, estompe) {
  var classes = 'w-el w-el--' + (e.type === 'Post-it' ? 'postit' : e.type.toLowerCase()) + (estompe ? ' w-el--estompe' : '');
  var texte = libelleAffiche(e);
  var nomType = e.type === 'Forme' ? e.forme : e.type;
  var desc = [nomType, sensCouleur(e.couleur)].filter(Boolean).join(', ');
  var div = creer('div', { classe: classes, attrs: { 'data-id': String(e.id), tabindex: '0', role: 'button', 'aria-roledescription': nomType,
    'aria-label': (texte || 'sans texte') + (desc ? ' (' + desc + ')' : '') + (e.ficheLigne ? ', relié à une fiche' : '') + (etat.affichage.votes && e.votes ? ', ' + pluriel(e.votes, 'vote', 'votes') : '') } });
  placerDiv(div, e);
  appliquerCouleur(div, e.couleur);
  if (e.type === 'Section' && e.couleur !== 'blanc') { div.style.setProperty('--fond-section', 'var(--background-alt-' + e.couleur + ', transparent)'); }
  if (e.type === 'Forme') { div.appendChild(dessinForme(e.forme, e.w, e.h)); }
  div.appendChild(creer('span', { classe: 'w-el__texte', texte: texte || (e.type === 'Section' ? 'Section' : '') }));
  if (e.type === 'Post-it' && ((etat.affichage.votes && e.votes) || e.responsable)) {
    var pied = creer('span', { classe: 'w-el__pied', attrs: { 'aria-hidden': 'true' } }, [creer('span', { texte: e.responsable || '' })]);
    if (etat.affichage.votes && e.votes) {
      var v = creer('span', { classe: 'w-votes' });
      for (var k = 0; k < Math.min(e.votes, 8); k++) { v.appendChild(creer('span', { classe: 'w-vote' })); }
      if (e.votes > 8) { v.appendChild(creer('span', { texte: '+' + (e.votes - 8) })); }
      pied.appendChild(v);
    }
    div.appendChild(pied);
  }
  var badges = [];
  if (etat.affichage.votes && e.votes && e.type !== 'Post-it' && e.type !== 'Section') { badges.push(creer('span', { classe: 'w-el__badge', texte: String(e.votes) })); }
  if (e.ficheLigne) { badges.push(creer('span', { classe: 'w-el__badge w-el__badge--fiche' }, [iconeSvg('fiche', 12)])); }
  if (e.pj.length) { badges.push(creer('span', { classe: 'w-el__badge w-el__badge--fiche', texte: String(e.pj.length) })); }
  if (badges.length) { div.appendChild(creer('span', { classe: 'w-el__badges', attrs: { 'aria-hidden': 'true' } }, badges)); }
  return div;
}

function placerDiv(div, e) {
  div.style.left = e.x + 'px';
  div.style.top = e.y + 'px';
  div.style.width = e.w + 'px';
  div.style.height = e.h + 'px';
}

function divElement(id) { var m = document.getElementById('vMonde'); return m ? m.querySelector('.w-el[data-id="' + Number(id) + '"]') : null; }

/* Point du bord d'un element dans la direction d'un autre point. */
function pointBord(e, tx, ty) {
  var cx = e.x + e.w / 2, cy = e.y + e.h / 2;
  var dx = tx - cx, dy = ty - cy;
  if (!dx && !dy) { return { x: cx, y: cy }; }
  var hw = e.w / 2, hh = e.h / 2, t;
  if (e.type === 'Forme' && e.forme === 'Ovale') { t = 1 / Math.sqrt((dx * dx) / (hw * hw) + (dy * dy) / (hh * hh)); }
  else if (e.type === 'Forme' && e.forme === 'Losange') { t = 1 / (Math.abs(dx) / hw + Math.abs(dy) / hh); }
  else { t = Math.min(dx ? hw / Math.abs(dx) : Infinity, dy ? hh / Math.abs(dy) : Infinity); }
  return { x: cx + dx * t, y: cy + dy * t };
}

function geometrieLien(l) {
  var a = etat.parId[l.de], b = etat.parId[l.vers];
  var p1 = pointBord(a, b.x + b.w / 2, b.y + b.h / 2);
  var p2 = pointBord(b, a.x + a.w / 2, a.y + a.h / 2);
  return { x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y, mx: (p1.x + p2.x) / 2, my: (p1.y + p2.y) / 2 };
}

function dessinerLiens() {
  var calque = document.getElementById('vLiens');
  var monde = document.getElementById('vMonde');
  if (!calque || !monde) { return; }
  Array.prototype.slice.call(calque.querySelectorAll('g')).forEach(function (g) { calque.removeChild(g); });
  Array.prototype.slice.call(monde.querySelectorAll('.w-lien-libelle')).forEach(function (n) { monde.removeChild(n); });
  var ns = 'http://www.w3.org/2000/svg';
  liensDuTableau().forEach(function (l) {
    var g = geometrieLien(l);
    var sel = etat.lienSel === l.id;
    var grp = document.createElementNS(ns, 'g');
    var d = 'M' + g.x1 + ' ' + g.y1 + 'L' + g.x2 + ' ' + g.y2;
    var p = document.createElementNS(ns, 'path');
    p.setAttribute('d', d);
    p.setAttribute('class', 'w-lien' + (sel ? ' w-lien--select' : ''));

    var z = document.createElementNS(ns, 'path');
    z.setAttribute('d', d);
    z.setAttribute('class', 'w-lien-zone');
    z.setAttribute('data-lien', String(l.id));
    grp.appendChild(p); grp.appendChild(z);

}

/* === SECTION : CAMERA === */
function appliquerCamera() {
  var monde = document.getElementById('vMonde');
  var toile = document.getElementById('vToile');
  if (!monde || !toile || !etat.cam) { return; }
  var c = etat.cam;
  monde.style.transform = 'translate(' + c.x + 'px,' + c.y + 'px) scale(' + c.z + ')';
  if (etat.affichage.grille) {
    var pas = PAS_GRILLE * c.z;
    toile.style.backgroundSize = pas + 'px ' + pas + 'px';
    toile.style.backgroundPosition = c.x + 'px ' + c.y + 'px';
    toile.style.backgroundImage = '';
  } else {
    toile.style.backgroundImage = 'none';
  }
  var z = document.getElementById('vZoom');
  if (z) { z.textContent = Math.round(c.z * 100) + ' %'; }
  majMinicarte();
  placerCtx();
}

var _minuterieCam = null;
function memoriserCamera() {
  clearTimeout(_minuterieCam);
  _minuterieCam = setTimeout(function () { if (etat.cam && etat.tableauId) { ecrirePref('camera:' + etat.tableauId, etat.cam); } }, 400);
}

function tailleToile() {
  var t = document.getElementById('vToile');
  return t ? { w: t.clientWidth, h: t.clientHeight } : { w: 800, h: 500 };
}

function zoomerEn(facteur, sx, sy) {
  var c = etat.cam;
  var nz = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, c.z * facteur));
  var wx = (sx - c.x) / c.z, wy = (sy - c.y) / c.z;
  c.x = sx - wx * nz; c.y = sy - wy * nz; c.z = nz;
  appliquerCamera();
  memoriserCamera();
}

function zoomerCentre(f) { var t = tailleToile(); zoomerEn(f, t.w / 2, t.h / 2); }

function boiteDe(liste) {
  if (!liste.length) { return null; }
  var b = { x1: Infinity, y1: Infinity, x2: -Infinity, y2: -Infinity };
  liste.forEach(function (e) { b.x1 = Math.min(b.x1, e.x); b.y1 = Math.min(b.y1, e.y); b.x2 = Math.max(b.x2, e.x + e.w); b.y2 = Math.max(b.y2, e.y + e.h); });
  return b;
}

/* Recentrer : tout le contenu du tableau dans la vue, sans agrandir au-dela
   de 100 %. */
function recentrer(silencieux) {
  var t = tailleToile();
  var b = boiteDe(elementsDuTableau());
  if (!b) { etat.cam = { x: t.w / 2 - 100, y: t.h / 2 - 60, z: 1 }; }
  else {
    var marge = 60;
    var z = Math.min(1, (t.w - 2 * marge) / Math.max(1, b.x2 - b.x1), (t.h - 2 * marge) / Math.max(1, b.y2 - b.y1));
    z = Math.max(ZOOM_MIN, z);
    etat.cam = { z: z, x: (t.w - (b.x2 - b.x1) * z) / 2 - b.x1 * z, y: (t.h - (b.y2 - b.y1) * z) / 2 - b.y1 * z };
  }
  appliquerCamera();
  memoriserCamera();
  if (!silencieux) { annoncer('Vue recentrée.'); }
}

function centrerSur(e) {
  var t = tailleToile();
  if (etat.cam.z < 0.6) { etat.cam.z = 0.8; }
  etat.cam.x = t.w / 2 - (e.x + e.w / 2) * etat.cam.z;
  etat.cam.y = t.h / 2 - (e.y + e.h / 2) * etat.cam.z;
  appliquerCamera();
  memoriserCamera();
}

var _indexRecherche = -1;
function centrerSurSuivant() {
  if (etat.vueType !== 'toile') { return; }
  var tous = elementsDuTableau();
  var res = tous.filter(function (e) { return e.type !== 'Section' && passeFiltres(e, tous); }).sort(function (a, b) { return a.y - b.y || a.x - b.x; });
  if (!res.length || !etat.filtres.texte.trim()) { annoncer('Aucun résultat.'); return; }
  _indexRecherche = (_indexRecherche + 1) % res.length;
  var e = res[_indexRecherche];
  etat.selection = [e.id]; etat.lienSel = null;
  centrerSur(e);
  majSelectionVisuelle();
  annoncer('Résultat ' + (_indexRecherche + 1) + ' sur ' + res.length + ' : ' + libelleCourt(e) + '.');
}

/* === SECTION : MINI-CARTE === */
function majMinicarte() {
  var mini = document.getElementById('vMini');
  if (!mini) { return; }
  var tous = elementsDuTableau();
  mini.hidden = !etat.affichage.minicarte || !tous.length;
  if (mini.hidden) { return; }
  Array.prototype.slice.call(mini.querySelectorAll('span')).forEach(function (n) { if (!n.classList.contains('fr-sr-only')) { mini.removeChild(n); } });
  var b = boiteDe(tous);
  var t = tailleToile();
  var c = etat.cam;
  var vue = { x1: -c.x / c.z, y1: -c.y / c.z, x2: (t.w - c.x) / c.z, y2: (t.h - c.y) / c.z };
  var x1 = Math.min(b.x1, vue.x1), y1 = Math.min(b.y1, vue.y1), x2 = Math.max(b.x2, vue.x2), y2 = Math.max(b.y2, vue.y2);
  var mw = mini.clientWidth || 160, mh = mini.clientHeight || 104;
  var k = Math.min((mw - 8) / Math.max(1, x2 - x1), (mh - 8) / Math.max(1, y2 - y1));
  var ox = 4 - x1 * k + ((mw - 8) - (x2 - x1) * k) / 2, oy = 4 - y1 * k + ((mh - 8) - (y2 - y1) * k) / 2;
  mini._echelle = { k: k, ox: ox, oy: oy };
  tous.forEach(function (e) {
    var n = creer('span', { classe: 'w-minicarte__el' + (e.type === 'Section' ? ' w-minicarte__el--section' : ''), attrs: { 'aria-hidden': 'true' } });
    n.style.left = (ox + e.x * k) + 'px'; n.style.top = (oy + e.y * k) + 'px';
    n.style.width = Math.max(2, e.w * k) + 'px'; n.style.height = Math.max(2, e.h * k) + 'px';
    mini.appendChild(n);
  });
  var v = creer('span', { classe: 'w-minicarte__vue', attrs: { 'aria-hidden': 'true' } });
  v.style.left = (ox + vue.x1 * k) + 'px'; v.style.top = (oy + vue.y1 * k) + 'px';
  v.style.width = ((vue.x2 - vue.x1) * k) + 'px'; v.style.height = ((vue.y2 - vue.y1) * k) + 'px';
  mini.appendChild(v);
}

function clicMinicarte(ev) {
  var mini = document.getElementById('vMini');
  if (!mini || !mini._echelle) { return; }
  var r = mini.getBoundingClientRect();
  var s = mini._echelle;
  var wx = (ev.clientX - r.left - s.ox) / s.k, wy = (ev.clientY - r.top - s.oy) / s.k;
  if (!ev.clientX && !ev.clientY) { recentrer(); return; }
  var t = tailleToile();
  etat.cam.x = t.w / 2 - wx * etat.cam.z;
  etat.cam.y = t.h / 2 - wy * etat.cam.z;
  appliquerCamera();
  memoriserCamera();
}

/* === SECTION : SELECTION === */
function majSelectionVisuelle() {
  var monde = document.getElementById('vMonde');
  if (!monde) { return; }
  Array.prototype.slice.call(monde.querySelectorAll('.w-poignee-taille')).forEach(function (n) { n.parentNode.removeChild(n); });
  Array.prototype.slice.call(monde.querySelectorAll('.w-el')).forEach(function (d) {
    var id = Number(d.getAttribute('data-id'));
    var sel = etat.selection.indexOf(id) !== -1;
    d.classList.toggle('w-el--select', sel);
    d.setAttribute('aria-pressed', sel ? 'true' : 'false');
    var trouve = !!etat.filtres.texte.trim() && etat.parId[id] && etat.parId[id].type !== 'Section' && passeFiltres(etat.parId[id]);
    d.classList.toggle('w-el--trouve', trouve);
  });
  if (etat.selection.length === 1 && etat.peutModifier) {
    var d1 = divElement(etat.selection[0]);
    if (d1) { d1.appendChild(creer('span', { classe: 'w-poignee-taille', attrs: { 'aria-hidden': 'true', 'data-poignee': '1' } })); }
  }
  dessinerLiens();
  placerCtx();
}

function selectionner(ids, sansFocus) {
  etat.selection = ids.slice();
  etat.lienSel = null;
  fermerPop();
  majSelectionVisuelle();
  if (etat.fiche && ids.length === 1 && ids[0] !== etat.fiche) { ouvrirFiche(ids[0], true); }
  if (!sansFocus && ids.length === 1) { var d = divElement(ids[0]); if (d && document.activeElement !== d) { d.focus({ preventScroll: true }); } }
}

function elementsSelectionnes() { return etat.selection.map(function (id) { return etat.parId[id]; }).filter(Boolean); }

/* === SECTION : BARRE D'ACTIONS ET MENUS ===
   Au-dessus de la selection, a taille constante quel que soit le zoom. */
function placerCtx() {
  var toile = document.getElementById('vToile');
  if (!toile) { return; }
  var ancien = document.getElementById('vCtx');
  if (ancien) { ancien.parentNode.removeChild(ancien); }
  if (etat.geste || etat.edition) { return; }
  var c = etat.cam;
  var boite = null, items = [];
  var sel = elementsSelectionnes();
  var t = tableauCourant();
  if (sel.length) {
    var b = boiteDe(sel);
    boite = { x: b.x1 * c.z + c.x, y: b.y1 * c.z + c.y, w: (b.x2 - b.x1) * c.z, h: (b.y2 - b.y1) * c.z };
    var un = sel.length === 1 ? sel[0] : null;
    if (etat.peutModifier) {
      items.push(bouton('Couleur', 'discret', null, function (ev) { ouvrirPop('couleur', ev.currentTarget); }, { svg: 'couleur', id: 'cCouleur', attrs: { 'aria-haspopup': 'true' } }));
      if (sel.every(function (e) { return e.type === 'Forme'; })) { items.push(bouton('Forme', 'discret', null, function (ev) { ouvrirPop('forme', ev.currentTarget); }, { svg: 'forme', id: 'cForme', attrs: { 'aria-haspopup': 'true' } })); }
      if (un) { items.push(bouton('Modifier le texte (Entrée)', 'discret', null, function () { editerLibelle(un.id); }, { svg: 'libelle', id: 'cLibelle' })); }
      if (un && t && t.fiche.table && un.type !== 'Section') { items.push(bouton(un.ficheLigne ? 'Changer la fiche liée' : 'Relier à une fiche', 'discret', null, function (ev) { ouvrirPop('fiche', ev.currentTarget); }, { svg: 'fiche', id: 'cRelier', attrs: { 'aria-haspopup': 'true' } })); }
    }
    if (un) { items.push(bouton('Ouvrir la fiche', 'discret', null, function () { ouvrirFiche(un.id); }, { svg: 'ouvrir', id: 'cOuvrir' })); }
    if (etat.peutModifier) {
      if (un && etat.affichage.votes && un.type !== 'Section') {
        items.push(creer('span', { classe: 'w-ctx__sep' }));
        items.push(bouton('Voter', 'discret', null, function () { return voter(un, 1); }, { svg: 'vote', id: 'cVoter' }));
        if (un.votes) { items.push(bouton('Retirer un vote', 'discret', null, function () { return voter(un, -1); }, { svg: 'devote', id: 'cDevoter' })); }
      }
      items.push(creer('span', { classe: 'w-ctx__sep' }));
      items.push(bouton('Dupliquer (Ctrl+D)', 'discret', null, function () { return dupliquerSelection(); }, { svg: 'dupliquer', id: 'cDupliquer' }));
      items.push(bouton('Premier plan', 'discret', null, function () { return premierPlan(); }, { svg: 'premier', id: 'cPremier' }));
      items.push(bouton('Supprimer (Suppr)', 'discret', null, function () { return supprimerSelection(); }, { svg: 'corbeille', id: 'cSupprimer', classe: 'w-bulle--droite' }));
    }
  } else if (etat.lienSel && etat.lienParId[etat.lienSel]) {
    var l = etat.lienParId[etat.lienSel];
    var g = geometrieLien(l);
    boite = { x: g.mx * c.z + c.x - 20, y: g.my * c.z + c.y - 10, w: 40, h: 20 };
    if (etat.peutModifier) {
      items.push(bouton('Libellé du connecteur', 'discret', null, function () { editerLibelleLien(l.id); }, { svg: 'libelle', id: 'cLienLibelle' }));
      items.push(bouton(l.style === 'Pointillés' ? 'Trait plein' : 'Trait en pointillés', 'discret', null, function () { return modifierLien(l, { STYLE: l.style === 'Pointillés' ? 'Plein' : 'Pointillés' }); }, { svg: 'pointilles', id: 'cLienStyle' }));
      items.push(bouton('Sens : ' + l.fleche + ' (changer)', 'discret', null, function () { return modifierLien(l, { FLECHE: FLECHES[(FLECHES.indexOf(l.fleche) + 1) % FLECHES.length] }); }, { svg: 'sens', id: 'cLienSens' }));
      items.push(bouton('Supprimer le connecteur (Suppr)', 'discret', null, function () { return supprimerLien(l); }, { svg: 'corbeille', id: 'cLienSupprimer', classe: 'w-bulle--droite' }));
    }
  }
  if (!boite || !items.length) { return; }

  var tw = toile.clientWidth, cw = ctx.offsetWidth, ch = ctx.offsetHeight;
  var x = Math.max(4, Math.min(tw - cw - 4, boite.x + boite.w / 2 - cw / 2));
  var y = boite.y - ch - 10;
  if (y < 4) { y = boite.y + boite.h + 10; }
  y = Math.max(4, Math.min(toile.clientHeight - ch - 4, y));
  ctx.style.left = x + 'px';
  ctx.style.top = y + 'px';
}

function fermerPop(rendreFocus) {
  var p = document.getElementById('vPop');

}

function ouvrirPop(genre, ancre) {

        clic: function () { fermerPop(true); return modifierSelection({ COULEUR: x[0] }, 'Couleur changée.'); } });
      appliquerCouleur(b, x[0]);

    });

        clic: function () { fermerPop(true); return modifierSelection({ FORME: f }, 'Forme changée.'); } }, [ico, f]));
    });
  } else if (genre === 'fiche') {
    var un = sel[0];
    var tid = t.fiche.table;

    pop.appendChild(creer('p', { classe: 'w-pop__titre', texte: 'Relier à une ligne de « ' + libelleTable(tid) + ' »' }));
    var champ = saisie('pFicheRech', '', { type: 'search', indice: 'Rechercher une ligne' });

    listeL.style.maxHeight = '14rem'; listeL.style.overflowY = 'auto';

      var q = normaliserTexte(champ.value);

      f.d.id.forEach(function (rid) {

        listeL.appendChild(creer('button', { classe: 'w-pop__item', attrs: { role: 'option', 'aria-selected': un.ficheLigne === rid && un.ficheTable === tid ? 'true' : 'false', 'aria-pressed': un.ficheLigne === rid && un.ficheTable === tid ? 'true' : 'false' },
          texte: lib, clic: function () { fermerPop(true); return relierFiche(un, tid, rid); } }));
      });
      if (!listeL.childNodes.length) { listeL.appendChild(creer('p', { classe: 'w-mention', texte: 'Aucune ligne.' })); }
    };

    if (un.ficheLigne) { pop.appendChild(bouton('Retirer le lien', 'secondaire', 'close-line', function () { fermerPop(true); return relierFiche(un, '', 0); }, { petit: true, id: 'pRetirerFiche' })); }
  }
  pop.addEventListener('keydown', function (e) { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); fermerPop(true); } });
  pop.addEventListener('pointerdown', function (e) { e.stopPropagation(); });

  var r = ancre.getBoundingClientRect(), rt = toile.getBoundingClientRect();
  var x = Math.max(4, Math.min(toile.clientWidth - pop.offsetWidth - 4, r.left - rt.left));
  var y = r.bottom - rt.top + 6;
  if (y + pop.offsetHeight > toile.clientHeight - 4) { y = Math.max(4, r.top - rt.top - pop.offsetHeight - 6); }

  pop.style.top = y + 'px';
  var premier = pop.querySelector('input, button');
  if (premier) { premier.focus(); }
