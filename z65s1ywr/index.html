/* === SECTION : GESTES SUR LA TOILE ===
   Pointeur unique pour la souris, le stylet et le doigt ; deux doigts pour
   zoomer. Un clic se distingue d'un glisser par une tolerance de 4 px. */
var _pointeurs = {};

function pointToile(ev) {
  var t = document.getElementById('vToile');
  var r = t.getBoundingClientRect();
  return { x: ev.clientX - r.left, y: ev.clientY - r.top };
}

function versMonde(p) { var c = etat.cam; return { x: (p.x - c.x) / c.z, y: (p.y - c.y) / c.z }; }

function aimanter(v) { return etat.affichage.grille ? Math.round(v / PAS_GRILLE) * PAS_GRILLE : Math.round(v); }

function brancherToile(toile) {
  toile.addEventListener('pointerdown', surPointeurBas);
  toile.addEventListener('pointermove', surPointeurBouge);
  toile.addEventListener('pointerup', surPointeurHaut);
  toile.addEventListener('pointercancel', surPointeurHaut);
  toile.addEventListener('dblclick', function (ev) {
    if (!etat.peutModifier || etat.outil !== 'selection') { return; }
    var d = ev.target.closest ? ev.target.closest('.w-el') : null;
    if (d) { ev.preventDefault(); editerLibelle(Number(d.getAttribute('data-id'))); return; }
    var z = ev.target.closest ? ev.target.closest('.w-lien-zone') : null;
    if (z) { ev.preventDefault(); editerLibelleLien(Number(z.getAttribute('data-lien'))); }
  });
  toile.addEventListener('wheel', function (ev) {
    if (ev.target.closest && ev.target.closest('.w-pop')) { return; }
    ev.preventDefault();
    if (ev.ctrlKey || ev.metaKey) {
      var p = pointToile(ev);
      zoomerEn(Math.exp(-ev.deltaY * 0.0025), p.x, p.y);
    } else {
      var k = ev.deltaMode === 1 ? 16 : 1;
      etat.cam.x -= (ev.shiftKey ? ev.deltaY : ev.deltaX) * k;
      etat.cam.y -= (ev.shiftKey ? 0 : ev.deltaY) * k;
      appliquerCamera();
      memoriserCamera();
    }
  }, { passive: false });
  toile.addEventListener('keydown', surToucheToile);
  toile.addEventListener('focusin', function (ev) {
    var d = ev.target.classList && ev.target.classList.contains('w-el') ? ev.target : null;
    if (!d || etat.geste) { return; }
    var id = Number(d.getAttribute('data-id'));
    if (etat.selection.indexOf(id) === -1) { selectionner([id], true); }
  });
}

function surPointeurBas(ev) {
  var cible = ev.target;
  if (cible.closest('.w-outils, .w-ctx, .w-pop, .w-minicarte, .w-edition')) { return; }
  if (etat.pop) { fermerPop(); }
  if (etat.edition) { terminerEdition(true); }
  var toile = document.getElementById('vToile');
  var p = pointToile(ev);
  _pointeurs[ev.pointerId] = p;
  var ids = Object.keys(_pointeurs);
  if (ids.length === 2) {
    var a = _pointeurs[ids[0]], b = _pointeurs[ids[1]];
    annulerGesteVisuel();
    etat.geste = { type: 'pincer', d0: Math.hypot(a.x - b.x, a.y - b.y), m0: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, cam0: Object.assign({}, etat.cam) };
    return;
  }
  if (ids.length > 2) { return; }
  try { toile.setPointerCapture(ev.pointerId); } catch (e) { logSecurite('INFO', 'Capture du pointeur impossible', e); }
  var d = cible.closest('.w-el');
  var poignee = cible.closest('[data-poignee]');
  var zoneLien = cible.closest('.w-lien-zone');
  var w = versMonde(p);
  if (d) { d.focus({ preventScroll: true }); } else { toile.focus({ preventScroll: true }); }
  if (ev.button === 1 || etat.outil === 'main' || (ev.button === 0 && ev.altKey)) {
    ev.preventDefault();
    etat.geste = { type: 'vue', p0: p, cam0: Object.assign({}, etat.cam) };
    toile.classList.add('w-toile--glisse');
    return;
  }
  if (ev.button !== 0 && ev.pointerType === 'mouse') { return; }
  var outil = etat.outil;
  if (['Post-it', 'Forme', 'Texte', 'Section'].indexOf(outil) !== -1) {
    etat.geste = { type: 'creer', p0: p, w0: w, bouge: false };
    return;
  }
  if (outil === 'connecteur') {
    if (!d) { etat.sourceLien = null; majSource(); return; }
    var id = Number(d.getAttribute('data-id'));
    if (etat.sourceLien && etat.sourceLien !== id) { var src = etat.sourceLien; etat.sourceLien = null; majSource(); relayer(creerLien(src, id), 'Connecteur'); return; }
    etat.geste = { type: 'lier', source: id, p0: p, bouge: false };
    return;
  }
  /* Outil Selectionner */
  if (poignee && etat.selection.length === 1 && etat.peutModifier) {
    var e1 = etat.parId[etat.selection[0]];
    etat.geste = { type: 'taille', id: e1.id, p0: p, w0: e1.w, h0: e1.h, bouge: false };
    return;
  }
  if (d) {
    var idEl = Number(d.getAttribute('data-id'));
    var ajout = ev.shiftKey || ev.ctrlKey || ev.metaKey;
    if (ajout) {
      var s = etat.selection.slice();
      var k = s.indexOf(idEl);
      if (k === -1) { s.push(idEl); } else { s.splice(k, 1); }
      selectionner(s, true);
      if (k !== -1) { return; }
    } else if (etat.selection.indexOf(idEl) === -1) {
      selectionner([idEl], true);
    } else { etat.lienSel = null; }
    if (!etat.peutModifier) { return; }
    /* Deplacement : la selection, plus le contenu des sections choisies. */
    var aDeplacer = {};
    var tous = elementsDuTableau();
    elementsSelectionnes().forEach(function (e) {
      aDeplacer[e.id] = true;
      if (e.type === 'Section') { contenusDe(e, tous).forEach(function (x) { aDeplacer[x.id] = true; }); }
    });
    var depart = {};
    Object.keys(aDeplacer).forEach(function (k2) { var x = etat.parId[k2]; depart[k2] = { x: x.x, y: x.y }; });
    etat.geste = { type: 'deplacer', p0: p, depart: depart, ref: idEl, bouge: false };
    return;
  }
  if (zoneLien) {
    etat.selection = [];
    etat.lienSel = Number(zoneLien.getAttribute('data-lien'));
    majSelectionVisuelle();
    return;
  }
  etat.geste = { type: 'lasso', p0: p, ajout: ev.shiftKey || ev.ctrlKey || ev.metaKey };
}

function surPointeurBouge(ev) {
  if (_pointeurs[ev.pointerId]) { _pointeurs[ev.pointerId] = pointToile(ev); }
  var g = etat.geste;
  if (!g) { return; }
  var p = pointToile(ev);
  if (g.type === 'pincer') {
    var ids = Object.keys(_pointeurs);
    if (ids.length < 2) { return; }
    var a = _pointeurs[ids[0]], b = _pointeurs[ids[1]];
    var d = Math.hypot(a.x - b.x, a.y - b.y);
    var m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    var c0 = g.cam0;
    var z = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, c0.z * (d / Math.max(1, g.d0))));
    var wx = (g.m0.x - c0.x) / c0.z, wy = (g.m0.y - c0.y) / c0.z;
    etat.cam = { z: z, x: m.x - wx * z, y: m.y - wy * z };
    appliquerCamera();
    return;
  }
  var dx = p.x - g.p0.x, dy = p.y - g.p0.y;
  if (!g.bouge && Math.abs(dx) + Math.abs(dy) > 4) { g.bouge = true; }
  if (g.type === 'vue') {
    etat.cam.x = g.cam0.x + dx; etat.cam.y = g.cam0.y + dy;
    appliquerCamera();
    return;
  }
  if (!g.bouge) { return; }
  var z = etat.cam.z;
  if (g.type === 'deplacer') {
    var ref = g.depart[g.ref];
    var ddx = aimanter(ref.x + dx / z) - ref.x, ddy = aimanter(ref.y + dy / z) - ref.y;
    g.delta = { x: ddx, y: ddy };
    Object.keys(g.depart).forEach(function (k) {
      var e = etat.parId[k];
      e.x = g.depart[k].x + ddx; e.y = g.depart[k].y + ddy;
      var div = divElement(k);
      if (div) { placerDiv(div, e); }
    });
    fermerCtx();
    dessinerLiens();
    return;
  }
  if (g.type === 'taille') {
    var e1 = etat.parId[g.id];
    var min = e1.type === 'Section' ? 80 : 30;
    e1.w = Math.max(min, aimanter(e1.x + g.w0 + dx / z) - e1.x);
    e1.h = Math.max(min / 2, aimanter(e1.y + g.h0 + dy / z) - e1.y);
    var div1 = divElement(g.id);
    if (div1) {
      placerDiv(div1, e1);
      if (e1.type === 'Forme') { var ancien = div1.querySelector('.w-el__fond'); if (ancien) { div1.replaceChild(dessinForme(e1.forme, e1.w, e1.h), ancien); } }
    }
    fermerCtx();
    dessinerLiens();
    return;
  }
  if (g.type === 'lasso' || g.type === 'creer') {
    var toile = document.getElementById('vToile');
    var lasso = document.getElementById('vLasso');
    if (!lasso) { lasso = creer('div', { classe: 'w-lasso', id: 'vLasso' }); toile.appendChild(lasso); }
    lasso.style.left = Math.min(p.x, g.p0.x) + 'px'; lasso.style.top = Math.min(p.y, g.p0.y) + 'px';
    lasso.style.width = Math.abs(dx) + 'px'; lasso.style.height = Math.abs(dy) + 'px';
    return;
  }
  if (g.type === 'lier') {
    var calque = document.getElementById('vLiens');
    if (!calque) { return; }
    var tmp = document.getElementById('vLienTmp');
    if (!tmp) {
      tmp = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      tmp.setAttribute('id', 'vLienTmp');
      tmp.setAttribute('class', 'w-lien');
      tmp.style.stroke = 'var(--border-action-high-blue-france)';
      tmp.setAttribute('stroke-dasharray', '4 4');
      tmp.setAttribute('marker-end', 'url(#wFlSel)');
      calque.appendChild(tmp);
    }
    var s = etat.parId[g.source];
    var w = versMonde(p);
    var depart = pointBord(s, w.x, w.y);
    tmp.setAttribute('d', 'M' + depart.x + ' ' + depart.y + 'L' + w.x + ' ' + w.y);
  }
}

function annulerGesteVisuel() {
  var l = document.getElementById('vLasso'); if (l) { l.parentNode.removeChild(l); }
  var t = document.getElementById('vLienTmp'); if (t) { t.parentNode.removeChild(t); }
  var toile = document.getElementById('vToile'); if (toile) { toile.classList.remove('w-toile--glisse'); }
}

function fermerCtx() { var c = document.getElementById('vCtx'); if (c) { c.parentNode.removeChild(c); } }

function surPointeurHaut(ev) {
  delete _pointeurs[ev.pointerId];
  var g = etat.geste;
  if (!g) { return; }
  if (g.type === 'pincer') {
    if (Object.keys(_pointeurs).length < 2) { etat.geste = null; memoriserCamera(); placerCtx(); }
    return;
  }
  etat.geste = null;
  var p = pointToile(ev);
  annulerGesteVisuel();
  if (g.type === 'vue') { memoriserCamera(); placerCtx(); return; }
  if (g.type === 'deplacer') {
    if (!g.bouge || !g.delta || (!g.delta.x && !g.delta.y)) { placerCtx(); return; }
    relayer(enregistrerPositions(g.depart, 'Déplacement'), 'Déplacement');
    return;
  }
  if (g.type === 'taille') {
    if (!g.bouge) { placerCtx(); return; }
    var e1 = etat.parId[g.id];
    var avant = { LARGEUR: g.w0, HAUTEUR: g.h0 };
    majSelectionVisuelle();
    relayer(ecrire([['UpdateRecord', etat.tables.el, e1.id, { LARGEUR: e1.w, HAUTEUR: e1.h }]], 'Taille enregistrée.', function () {
      return [['UpdateRecord', etat.tables.el, e1.id, avant]];
    }), 'Redimensionnement');
    return;
  }
  if (g.type === 'lasso') {
    if (!g.bouge) { if (!g.ajout) { etat.selection = []; etat.lienSel = null; fermerPop(); majSelectionVisuelle(); } return; }
    var a = versMonde(g.p0), b = versMonde(p);
    var r = { x1: Math.min(a.x, b.x), y1: Math.min(a.y, b.y), x2: Math.max(a.x, b.x), y2: Math.max(a.y, b.y) };
    var pris = elementsDuTableau().filter(function (e) {
      if (e.type === 'Section') { return e.x >= r.x1 && e.y >= r.y1 && e.x + e.w <= r.x2 && e.y + e.h <= r.y2; }
      return e.x < r.x2 && e.x + e.w > r.x1 && e.y < r.y2 && e.y + e.h > r.y1;
    }).map(function (e) { return e.id; });
    var s = g.ajout ? etat.selection.concat(pris.filter(function (x) { return etat.selection.indexOf(x) === -1; })) : pris;
    selectionner(s, true);
    annoncer(pluriel(s.length, 'élément sélectionné', 'éléments sélectionnés') + '.');
    return;
  }
  if (g.type === 'creer') {
    var type = etat.outil;
    var w0 = g.w0, w1 = versMonde(p);
    var taille = TAILLES[type];
    var champs;
    if (type === 'Section' && g.bouge && Math.abs(w1.x - w0.x) > 40 && Math.abs(w1.y - w0.y) > 40) {
      champs = { x: aimanter(Math.min(w0.x, w1.x)), y: aimanter(Math.min(w0.y, w1.y)), w: aimanter(Math.abs(w1.x - w0.x)), h: aimanter(Math.abs(w1.y - w0.y)) };
    } else {
      champs = { x: aimanter(w0.x - taille[0] / 2), y: aimanter(w0.y - taille[1] / 2), w: taille[0], h: taille[1] };
    }
    choisirOutil('selection');
    relayer(creerElement(type, champs, true), 'Création');
    return;
  }
  if (g.type === 'lier') {
    var sous = document.elementFromPoint(ev.clientX, ev.clientY);
    var cible = sous && sous.closest ? sous.closest('.w-el') : null;
    var idCible = cible ? Number(cible.getAttribute('data-id')) : 0;
    if (g.bouge && idCible && idCible !== g.source) { relayer(creerLien(g.source, idCible), 'Connecteur'); return; }
    if (!g.bouge) { etat.sourceLien = g.source; majSource(); annoncer('Départ choisi. Cliquez sur l\'élément d\'arrivée.'); }
  }
}

/* === SECTION : CLAVIER SUR LA TOILE === */
var _deplacementClavier = null;

function surToucheToile(ev) {
  if (etat.edition || (ev.target.closest && ev.target.closest('.w-pop, .w-ctx, .w-outils'))) {
    if (ev.key === 'Escape' && etat.pop) { ev.preventDefault(); fermerPop(true); }
    return;
  }
  var mod = ev.ctrlKey || ev.metaKey;
  var k = ev.key;
  var sel = elementsSelectionnes();
  if (k === 'Escape') {
    if (etat.sourceLien) { etat.sourceLien = null; majSource(); }
    else if (etat.outil !== 'selection') { choisirOutil('selection'); }
    else if (etat.selection.length || etat.lienSel) { etat.selection = []; etat.lienSel = null; majSelectionVisuelle(); var t = document.getElementById('vToile'); if (t) { t.focus(); } }
    else { return; }
    ev.preventDefault(); return;
  }
  if (mod && (k === 'z' || k === 'Z')) { ev.preventDefault(); relayer(annulerDerniere(), 'Annuler'); return; }
  if (mod && (k === 'a' || k === 'A')) { ev.preventDefault(); selectionner(elementsDuTableau().map(function (e) { return e.id; }), true); annoncer('Tout est sélectionné.'); return; }
  if (mod && (k === 'd' || k === 'D')) { ev.preventDefault(); if (etat.peutModifier && sel.length) { relayer(dupliquerSelection(), 'Dupliquer'); } return; }
  if ((k === 'Delete' || k === 'Backspace') && etat.peutModifier) {
    if (sel.length) { ev.preventDefault(); relayer(supprimerSelection(), 'Supprimer'); }
    else if (etat.lienSel) { ev.preventDefault(); relayer(supprimerLien(etat.lienParId[etat.lienSel]), 'Supprimer'); }
    return;
  }
  if ((k === 'Enter' || k === 'F2') && sel.length === 1) {
    ev.preventDefault();
    if (etat.peutModifier && !ev.shiftKey) { editerLibelle(sel[0].id); } else { ouvrirFiche(sel[0].id); }
    return;
  }
  if (k.indexOf('Arrow') === 0) {
    ev.preventDefault();
    var pas = ev.shiftKey ? 1 : (etat.affichage.grille ? PAS_GRILLE : 10);
    var dx = k === 'ArrowLeft' ? -pas : (k === 'ArrowRight' ? pas : 0), dy = k === 'ArrowUp' ? -pas : (k === 'ArrowDown' ? pas : 0);
    if (sel.length && etat.peutModifier) { deplacerAuClavier(dx, dy); }
    else { etat.cam.x -= dx * 4; etat.cam.y -= dy * 4; appliquerCamera(); memoriserCamera(); }
    return;
  }
  if (mod || ev.altKey) { return; }
  if (k === '+' || k === '=') { ev.preventDefault(); zoomerCentre(1.2); return; }
  if (k === '-') { ev.preventDefault(); zoomerCentre(1 / 1.2); return; }
  if (k === '0') { ev.preventDefault(); recentrer(); return; }
  var o = OUTILS.filter(function (x) { return x && x.touche.toLowerCase() === String(k).toLowerCase(); })[0];
  if (o && (!o.edition || etat.peutModifier)) { ev.preventDefault(); choisirOutil(o.cle); }
}

/* Deplacement aux fleches : affiche aussitot, ecrit apres une courte pause
   (une seule ecriture et un seul « Annuler » pour une rafale de touches). */
function deplacerAuClavier(dx, dy) {
  var tous = elementsDuTableau();
  var aDeplacer = {};
  elementsSelectionnes().forEach(function (e) {
    aDeplacer[e.id] = true;
    if (e.type === 'Section') { contenusDe(e, tous).forEach(function (x) { aDeplacer[x.id] = true; }); }
  });
  if (!_deplacementClavier) {
    var depart = {};
    Object.keys(aDeplacer).forEach(function (k) { depart[k] = { x: etat.parId[k].x, y: etat.parId[k].y }; });
    _deplacementClavier = { depart: depart, minuterie: null };
  }
  Object.keys(aDeplacer).forEach(function (k) {
    var e = etat.parId[k];
    if (!_deplacementClavier.depart[k]) { _deplacementClavier.depart[k] = { x: e.x, y: e.y }; }
    e.x += dx; e.y += dy;
    var d = divElement(k); if (d) { placerDiv(d, e); }
  });
  dessinerLiens();
  placerCtx();
  clearTimeout(_deplacementClavier.minuterie);
  _deplacementClavier.minuterie = setTimeout(function () {
    var dep = _deplacementClavier.depart;
    _deplacementClavier = null;
    relayer(enregistrerPositions(dep, 'Déplacement'), 'Déplacement au clavier');
  }, DELAI_SAUVEGARDE_MS);
}

/* === SECTION : ECRITURES ===
   Chaque ecriture met d'abord a jour l'affichage, puis le document ; un
   refus est explique et l'affichage est relu. « Annuler » reste propose
   quelques secondes en bas a droite (et Ctrl+Z). */
async function ecrire(actions, message, inverse) {
  try {
    var r = await agir(actions);
    if (message || inverse) { proposerAnnulation(message || 'Enregistré.', inverse || null); }
    planifierRafraichissement(300);
    return r;
  } catch (e) {
    erreurEcriture(e, 'La modification n\'a pas abouti.');
    etat.signature = '';
    await rafraichir(true);
    return null;
  }
}

function erreurEcriture(e, message) {
  if (estRefusDroits(e)) {
    etat.peutModifier = false; etat.peutParametrer = false;
    afficherErreur('Vos droits sur ce document ne permettent pas cette modification. Diploworkflow passe en consultation seule.', e);
    if (etat.vue === 'principal') { rendrePrincipal(); }
    return;
  }
  afficherErreur(message, e);
}

/* inverse : fonction qui rend les actions d'annulation (ou une promesse). */
function proposerAnnulation(message, inverse) {
  if (!inverse) { etat.annulation = null; afficherToast(message); return; }
  var jeton = {};
  etat.annulation = { fn: inverse, jeton: jeton };
  var b = bouton('Annuler', 'secondaire', 'arrow-go-back-line', function () { return annulerDerniere(); }, { petit: true, id: 'tAnnuler' });
  afficherToast(message, [b], DELAI_ANNULER_MS);
  setTimeout(function () { if (etat.annulation && etat.annulation.jeton === jeton) { etat.annulation = null; } }, DELAI_ANNULER_MS);
}

async function annulerDerniere() {
  var x = etat.annulation;
  etat.annulation = null;
  masquerToast();
  if (!x) { annoncer('Rien à annuler.'); return; }
  try {
    var actions = await x.fn();
    if (actions && actions.length) { await agir(actions); }
    etat.signature = '';
    await rafraichir(true);
    afficherToast('Modification annulée.');
  } catch (e) { erreurEcriture(e, 'L\'annulation n\'a pas abouti.'); }
}

async function enregistrerPositions(depart, quoi) {
  var ids = Object.keys(depart).map(Number).filter(function (id) { return etat.parId[id]; });
  if (!ids.length) { return; }
  majSelectionVisuelle();
  majMinicarte();
  var actions = [['BulkUpdateRecord', etat.tables.el, ids, { POSITION_X: ids.map(function (id) { return etat.parId[id].x; }), POSITION_Y: ids.map(function (id) { return etat.parId[id].y; }) }]];
  await ecrire(actions, quoi === 'Déplacement' ? pluriel(ids.length, 'élément déplacé', 'éléments déplacés') + '.' : null, function () {
    return [['BulkUpdateRecord', etat.tables.el, ids, { POSITION_X: ids.map(function (id) { return depart[id].x; }), POSITION_Y: ids.map(function (id) { return depart[id].y; }) }]];
  });
}

function ordreMax() { return elementsDuTableau().reduce(function (m, e) { return Math.max(m, e.ordre || 0); }, 0); }

function couleurParDefaut(type) {
  var t = tableauCourant();
  if (type === 'Section') { return 'blanc'; }
  if (type === 'Texte') { return 'blanc'; }
  var leg = t ? t.legende : [];
  if (type === 'Post-it') {
    /* Un jaune de la legende (le dernier : « Commentaire » d'un logigramme),
       sinon sa premiere couleur. */
    var jaunes = leg.filter(function (x) { return x.couleur.indexOf('yellow') === 0; });
    if (jaunes.length) { return jaunes[jaunes.length - 1].couleur; }
    var autre = leg.filter(function (x) { return x.couleur !== 'blanc'; })[0];
    return autre ? autre.couleur : 'yellow-tournesol';
  }
  var blanc = leg.filter(function (x) { return x.couleur === 'blanc'; })[0];
  return blanc ? 'blanc' : (leg[0] ? leg[0].couleur : 'blanc');
}

async function creerElement(type, pos, editer, autres) {
  if (!etat.peutModifier) { return null; }
  var champs = Object.assign({ TABLEAU: etat.tableauId, TYPE: type, FORME: type === 'Forme' ? 'Rectangle' : '', LIBELLE: '', COULEUR: couleurParDefaut(type),
    POSITION_X: pos.x, POSITION_Y: pos.y, LARGEUR: pos.w, HAUTEUR: pos.h, ORDRE: type === 'Section' ? 0 : ordreMax() + 1 }, autres || {});
  try {
    var r = await agir([['AddRecord', etat.tables.el, null, champs]]);
    var id = r && r.retValues ? r.retValues[0] : null;
    etat.signature = '';
    await rafraichir(true);
    if (id && etat.parId[id]) {
      selectionner([id]);
      proposerAnnulation(type + ' ajouté' + (type === 'Section' ? 'e' : '') + '.', function () { return supprimerActions([id]); });
      if (editer) { editerLibelle(id); }
    }
    return id;
  } catch (e) { erreurEcriture(e, 'L\'ajout n\'a pas abouti.'); return null; }
}

/* Bouton « Ajouter un element » du volet : au centre de la vue, post-it
   (ou forme pour un logigramme ou une carte mentale). */
async function ajouterAuCentre() {
  var t = tableauCourant();
  if (etat.vueType !== 'toile') { changerVue('toile'); }
  var type = t && (t.modele === 'logigramme' || t.modele === 'mentale') ? 'Forme' : 'Post-it';
  var taille = TAILLES[type];
  var ts = tailleToile();
  var c = versMonde({ x: ts.w / 2, y: ts.h / 2 });
  var n = elementsDuTableau().length % 5;
  return creerElement(type, { x: aimanter(c.x - taille[0] / 2 + n * 20), y: aimanter(c.y - taille[1] / 2 + n * 20), w: taille[0], h: taille[1] }, true);
}

async function modifierSelection(champs, message) {
  var sel = elementsSelectionnes();
  if (!sel.length || !etat.peutModifier) { return; }
  var avant = sel.map(function (e) { var a = {}; Object.keys(champs).forEach(function (k) { a[k] = valeurElement(e, k); }); return a; });
  sel.forEach(function (e) { appliquerLocal(e, champs); });
  rendreMonde();
  if (etat.fiche) { rendreFiche(); }
  var ids = sel.map(function (e) { return e.id; });
  await ecrire(sel.map(function (e) { return ['UpdateRecord', etat.tables.el, e.id, champs]; }), message, function () {
    return ids.map(function (id, i) { return ['UpdateRecord', etat.tables.el, id, avant[i]]; });
  });
}

function valeurElement(e, col) {
  var m = { TYPE: e.type, FORME: e.forme, LIBELLE: e.libelle, DESCRIPTION: e.description, COULEUR: e.couleur, POSITION_X: e.x, POSITION_Y: e.y, LARGEUR: e.w, HAUTEUR: e.h,
    ORDRE: e.ordre, RESPONSABLE: e.responsable, STATUT: e.statut || null, VOTES: e.votes, FICHE_TABLE: e.ficheTable, FICHE_LIGNE: e.ficheLigne || 0, TABLEAU: e.tableau };
  return m[col];
}

function appliquerLocal(e, champs) {
  var m = { TYPE: 'type', FORME: 'forme', LIBELLE: 'libelle', DESCRIPTION: 'description', COULEUR: 'couleur', POSITION_X: 'x', POSITION_Y: 'y', LARGEUR: 'w', HAUTEUR: 'h',
    ORDRE: 'ordre', RESPONSABLE: 'responsable', STATUT: 'statut', VOTES: 'votes', FICHE_TABLE: 'ficheTable', FICHE_LIGNE: 'ficheLigne' };
  Object.keys(champs).forEach(function (k) { if (m[k]) { e[m[k]] = champs[k] === null ? '' : champs[k]; } });
}

async function voter(e, sens) {
  var n = Math.max(0, e.votes + sens);
  var avant = e.votes;
  e.votes = n;
  rendreMonde();
  majBarre();
  annoncer(pluriel(n, 'vote', 'votes') + '.');
  await ecrire([['UpdateRecord', etat.tables.el, e.id, { VOTES: n }]], null, null);
  if (sens < 0 && !n) { placerCtx(); }
  logSecurite('INFO', 'Vote : ' + avant + ' -> ' + n);
}

async function premierPlan() {
  var sel = elementsSelectionnes().filter(function (e) { return e.type !== 'Section'; });
  if (!sel.length) { annoncer('Les sections restent toujours sous les autres éléments.'); return; }
  var base = ordreMax();
  var avant = sel.map(function (e) { return e.ordre; });
  sel.forEach(function (e, i) { e.ordre = base + 1 + i; });
  rendreMonde();
  await ecrire(sel.map(function (e) { return ['UpdateRecord', etat.tables.el, e.id, { ORDRE: e.ordre }]; }), 'Passé au premier plan.', function () {
    return sel.map(function (e, i) { return ['UpdateRecord', etat.tables.el, e.id, { ORDRE: avant[i] }]; });
  });
}

/* Duplication : les elements choisis (decales) et les connecteurs entre
   eux. */
async function dupliquerSelection() {
  var sel = elementsSelectionnes();
  if (!sel.length) { return; }
  var base = ordreMax();
  var lignes = sel.map(function (e, i) {
    return { TABLEAU: e.tableau, TYPE: e.type, FORME: e.forme, LIBELLE: e.libelle, DESCRIPTION: e.description, COULEUR: e.couleur, POSITION_X: e.x + 40, POSITION_Y: e.y + 40,
      LARGEUR: e.w, HAUTEUR: e.h, ORDRE: e.type === 'Section' ? e.ordre : base + 1 + i, RESPONSABLE: e.responsable, STATUT: e.statut || null, FICHE_TABLE: e.ficheTable, FICHE_LIGNE: e.ficheLigne || 0 };
  });
  try {
    var r = await agir([actionAjoutLot(etat.tables.el, lignes)]);
    var nouveaux = r && r.retValues ? r.retValues[0] : [];
    var corresp = {};
    sel.forEach(function (e, i) { corresp[e.id] = nouveaux[i]; });
    var liens = liensDuTableau().filter(function (l) { return corresp[l.de] && corresp[l.vers]; });
    if (liens.length) {
      await agir([actionAjoutLot(etat.tables.li, liens.map(function (l) { return { TABLEAU: l.tableau, DE: corresp[l.de], VERS: corresp[l.vers], LIBELLE: l.libelle, STYLE: l.style, FLECHE: l.fleche }; }))]);
    }
    etat.signature = '';
    await rafraichir(true);
    selectionner(nouveaux.filter(function (id) { return etat.parId[id]; }));
    proposerAnnulation(pluriel(nouveaux.length, 'élément dupliqué', 'éléments dupliqués') + '.', function () { return supprimerActions(nouveaux); });
  } catch (e) { erreurEcriture(e, 'La duplication n\'a pas abouti.'); }
}

/* Lot de lignes : un BulkAddRecord avec les colonnes de toutes les lignes. */
function actionAjoutLot(tid, lignes) {
  var cols = {};
  lignes.forEach(function (l) { Object.keys(l).forEach(function (k) { cols[k] = true; }); });
  var vals = {};
  Object.keys(cols).forEach(function (k) { vals[k] = lignes.map(function (l) { return k in l ? l[k] : null; }); });
  return ['BulkAddRecord', tid, lignes.map(function () { return null; }), vals];
}

/* Suppression d'elements avec leurs connecteurs, d'un seul envoi. */
function supprimerActions(ids) {
  var liens = etat.liens.filter(function (l) { return ids.indexOf(l.de) !== -1 || ids.indexOf(l.vers) !== -1; }).map(function (l) { return l.id; });
  var a = [];
  if (liens.length) { a.push(['BulkRemoveRecord', etat.tables.li, liens]); }
  a.push(['BulkRemoveRecord', etat.tables.el, ids.filter(function (id) { return etat.parId[id]; })]);
  return a;
}

async function supprimerSelection() {
  var sel = elementsSelectionnes();
  if (!sel.length || !etat.peutModifier) { return; }
  var ids = sel.map(function (e) { return e.id; });
  var liens = etat.liens.filter(function (l) { return ids.indexOf(l.de) !== -1 || ids.indexOf(l.vers) !== -1; });
  if (sel.length > 5 || sel.some(function (e) { return e.pj.length; })) {
    var ok = await confirmer('Supprimer ' + pluriel(sel.length, 'élément', 'éléments') + ' ?', (liens.length ? pluriel(liens.length, 'connecteur est aussi supprimé', 'connecteurs sont aussi supprimés') + '. ' : '') + 'Vous pourrez l\'annuler pendant quelques secondes' + (sel.some(function (e) { return e.pj.length; }) ? ', sauf pour les pièces jointes.' : '.'), 'Supprimer');
    if (!ok) { return; }
  }
  var copies = sel.map(function (e) {
    return { TABLEAU: e.tableau, TYPE: e.type, FORME: e.forme, LIBELLE: e.libelle, DESCRIPTION: e.description, COULEUR: e.couleur, POSITION_X: e.x, POSITION_Y: e.y, LARGEUR: e.w, HAUTEUR: e.h,
      ORDRE: e.ordre, RESPONSABLE: e.responsable, STATUT: e.statut || null, VOTES: e.votes, FICHE_TABLE: e.ficheTable, FICHE_LIGNE: e.ficheLigne || 0 };
  });
  var copiesLiens = liens.map(function (l) { return { de: ids.indexOf(l.de), vers: ids.indexOf(l.vers), deId: l.de, versId: l.vers, l: l }; });
  var actions = supprimerActions(ids);
  etat.selection = [];
  if (etat.fiche && ids.indexOf(etat.fiche) !== -1) { fermerFiche(); }
  etat.elements = etat.elements.filter(function (e) { return ids.indexOf(e.id) === -1; });
  etat.liens = etat.liens.filter(function (l) { return liens.indexOf(l) === -1; });
  indexer();
  rendreMonde(); majBarre(); majVolet();
  await ecrire(actions, pluriel(ids.length, 'élément supprimé', 'éléments supprimés') + '.', async function () {
    /* Recreation : nouveaux identifiants, puis connecteurs remis sur eux. */
    var r = await agir([actionAjoutLot(etat.tables.el, copies)]);
    var nouveaux = r && r.retValues ? r.retValues[0] : [];
    var lot = copiesLiens.map(function (x) {
      return { TABLEAU: x.l.tableau, DE: x.de !== -1 ? nouveaux[x.de] : x.deId, VERS: x.vers !== -1 ? nouveaux[x.vers] : x.versId, LIBELLE: x.l.libelle, STYLE: x.l.style, FLECHE: x.l.fleche };
    });
    return lot.length ? [actionAjoutLot(etat.tables.li, lot)] : [];
  });
  var t = document.getElementById('vToile'); if (t) { t.focus(); }
}

async function creerLien(de, vers) {
  if (!etat.peutModifier || de === vers) { return; }
  if (liensDuTableau().some(function (l) { return l.de === de && l.vers === vers; })) { annoncer('Ces éléments sont déjà reliés.'); return; }
  try {
    var r = await agir([['AddRecord', etat.tables.li, null, { TABLEAU: etat.tableauId, DE: de, VERS: vers, LIBELLE: '', STYLE: 'Plein', FLECHE: 'Vers la fin' }]]);
    var id = r && r.retValues ? r.retValues[0] : null;
    etat.signature = '';
    await rafraichir(true);
    if (id) {
      etat.selection = []; etat.lienSel = id; majSelectionVisuelle();
      proposerAnnulation('Connecteur ajouté.', function () { return [['RemoveRecord', etat.tables.li, id]]; });
    }
  } catch (e) { erreurEcriture(e, 'Le connecteur n\'a pas pu être ajouté.'); }
}

async function modifierLien(l, champs) {
  var avant = { LIBELLE: l.libelle, STYLE: l.style, FLECHE: l.fleche };
  var a = {};
  Object.keys(champs).forEach(function (k) { a[k] = avant[k]; });
  if ('LIBELLE' in champs) { l.libelle = champs.LIBELLE; }
  if ('STYLE' in champs) { l.style = champs.STYLE; }
  if ('FLECHE' in champs) { l.fleche = champs.FLECHE; }

var _jetonComplet = false;
async function obtenirJeton(complet) {
  var j = await gristAvecTimeout(grist.docApi.getAccessToken({ readOnly: !complet }), 10000);
  return j;
}

async function telechargerPj(id, nom) {
  try {
    var j = await obtenirJeton(_jetonComplet);
    var rep = await fetch(j.baseUrl + '/attachments/' + id + '/download?auth=' + encodeURIComponent(j.token));
    if ((rep.status === 401 || rep.status === 403) && !_jetonComplet) {
      _jetonComplet = true;
      j = await obtenirJeton(true);
      rep = await fetch(j.baseUrl + '/attachments/' + id + '/download?auth=' + encodeURIComponent(j.token));
    }
    if (!rep.ok) { throw new Error('Téléchargement refusé : ' + rep.status); }
    var blob = await rep.blob();
    telechargerBlob(blob, nom);
  } catch (e) { afficherErreur('Le fichier n\'a pas pu être téléchargé.', e); }
}

function telechargerBlob(blob, nom) {
  var url = URL.createObjectURL(blob);
  var a = creer('a', { attrs: { href: url, download: nom } });
  a.hidden = true;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
}

async function envoyerPj(e, fichiers) {
  for (var i = 0; i < fichiers.length; i++) {
    var f = fichiers[i];
    var ext = String(f.name || '').split('.').pop().toLowerCase();
    if (EXTENSIONS_REFUSEES.indexOf(ext) !== -1) { signalerSaisie('« ' + f.name + ' » : ce type de fichier n\'est pas accepté.'); return; }
    if (f.size > TAILLE_MAX_PJ) { signalerSaisie('« ' + f.name + ' » dépasse ' + tailleLisible(TAILLE_MAX_PJ) + '.'); return; }
  }
  afficherLoader('Envoi des fichiers…');
  try {
    var ids = [];
    for (var k = 0; k < fichiers.length; k++) {
      var j = await obtenirJeton(true);
      var form = new FormData();
      form.append('upload', fichiers[k], fichiers[k].name);
      var rep = await fetch(j.baseUrl + '/attachments?auth=' + encodeURIComponent(j.token), { method: 'POST', body: form, headers: { 'X-Requested-With': 'XMLHttpRequest' } });
      if (!rep.ok) { throw new Error('Envoi refusé : ' + rep.status); }
      var r = await rep.json();
      (Array.isArray(r) ? r : []).forEach(function (x) { if (typeof x === 'number') { ids.push(x); } });
    }
    var tous = e.pj.concat(ids.filter(function (x) { return e.pj.indexOf(x) === -1; }));
    await agir([['UpdateRecord', etat.tables.el, e.id, { PIECES_JOINTES: ['L'].concat(tous) }]]);
    masquerLoader();
    await lireInfosPj();
    etat.signature = '';
    await rafraichir(true);
    afficherToast(pluriel(ids.length, 'fichier joint', 'fichiers joints') + '.');
  } catch (err) { masquerLoader(); erreurEcriture(err, 'L\'envoi des fichiers n\'a pas abouti.'); }
}

async function retirerPj(e, pid, nom) {
  var ok = await confirmer('Retirer le fichier « ' + nom + ' » ?', 'Le fichier est retiré de l\'élément.', 'Retirer le fichier');
  if (!ok) { return; }
  var avant = e.pj.slice();
  var apres = e.pj.filter(function (x) { return x !== pid; });
  e.pj = apres;
  rendreFiche();
  await ecrire([['UpdateRecord', etat.tables.el, e.id, { PIECES_JOINTES: ['L'].concat(apres) }]], 'Fichier retiré.', function () { return [['UpdateRecord', etat.tables.el, e.id, { PIECES_JOINTES: ['L'].concat(avant) }]]; });
}

/* === SECTION : VUE LISTE ===
   Meme contenu que la toile, au clavier et au lecteur d'ecran : un clic sur

function rendreListe() {

  var tb = creer('tbody');

    var cel = [creer('td', {}, [creer('button', { classe: 'w-lien-texte', texte: libelleCourt(e), attrs: { 'aria-label': 'Ouvrir la fiche de ' + libelleCourt(e) }, clic: function () { ouvrirFiche(e.id); } })]),
      creer('td', { texte: e.type === 'Forme' ? e.forme : e.type }),

      creer('td', { texte: s ? libelleCourt(s) : '' })];

    if (t.champs.statut) { cel.push(creer('td', {}, [e.statut ? badge(e.statut, BADGE_STATUT[e.statut] || null) : null])); }
    if (etat.affichage.votes) { cel.push(creer('td', { texte: String(e.votes) })); }
    if (t.fiche.table) { cel.push(creer('td', { texte: e.ficheLigne ? (texteLigneLiee(e.ficheTable, e.ficheLigne, colonneAffichee(e.ficheTable)) || 'Ligne ' + e.ficheLigne) : '' })); }

/* === SECTION : SORTIES ===
   Impression et PDF par la fenetre d'impression (feuille A4 a l'italienne,
   toile ajustee a la page) ; image PNG construite a partir d'un SVG ; CSV des
   elements. */
function imprimer(pdf) {
  var t = tableauCourant();
  var p = document.getElementById('vPapier');
  if (p) { p.textContent = (t ? t.nom + ' - ' : '') + 'imprimé le ' + aujourdhui() + '. ' + (filtresActifs() ? 'Filtres appliqués : éléments estompés ou retirés.' : ''); }
  var style = document.getElementById('wStylePage');
  if (!style) { style = creer('style', { id: 'wStylePage' }); document.head.appendChild(style); }
  style.textContent = '@page { size: A4 landscape; margin: 10mm; }';
  var camAvant = etat.cam ? Object.assign({}, etat.cam) : null;
  var toile = document.getElementById('vToile');
  if (toile && etat.vueType === 'toile') {
    var b = boiteDe(elementsDuTableau());
    var lw = 1050, lh = 640;
    if (b) {
      var z = Math.min(1.2, lw / Math.max(1, b.x2 - b.x1 + 40), lh / Math.max(1, b.y2 - b.y1 + 40));
      etat.cam = { z: z, x: -b.x1 * z + 20 * z, y: -b.y1 * z + 30 * z };
    }
    toile.style.width = lw + 'px'; toile.style.height = lh + 'px'; toile.style.flex = 'none';
    appliquerCamera();
  }
  var fin = function () {
    window.removeEventListener('afterprint', fin);
    if (toile) { toile.style.width = ''; toile.style.height = ''; toile.style.flex = ''; }
    if (camAvant) { etat.cam = camAvant; appliquerCamera(); }
  };
  window.addEventListener('afterprint', fin);
  if (pdf) { afficherToast('Dans la fenêtre d\'impression, choisissez « Enregistrer au format PDF ».', null, 8000); }
  setTimeout(function () { window.print(); setTimeout(fin, 1500); }, pdf ? 400 : 50);
}

function champCsv(v) {
  var s = String(v === null || v === undefined ? '' : v);
  /* Une cellule qui commence par = + - @ tabulation ou retour chariot est
     neutralisee (injection de formule a l'ouverture dans un tableur), sauf
     un nombre pur. */
  if (/^[=+\-@\t\r]/.test(s) && !/^[-+]?\d+([.,]\d+)?$/.test(s)) { s = '\'' + s; }
  return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function nomFichier(ext) {
  var t = tableauCourant();
  var base = normaliserTexte(t ? t.nom : 'tableau blanc').replace(/ /g, '_') || 'tableau_blanc';
  return base + '_' + new Date().toISOString().slice(0, 10) + '.' + ext;
}

function exporterCsv() {
  var t = tableauCourant();
  var tous = elementsDuTableau();
  var lignes = [['Texte', 'Type', 'Forme', 'Couleur', 'Sens de la couleur', 'Section', 'Responsable', 'Statut', 'Votes', 'Fiche liée', 'Description', 'Connecteurs sortants'].join(';')];
  tous.filter(function (e) { return e.type !== 'Section'; }).sort(function (a, b) { return a.y - b.y || a.x - b.x; }).forEach(function (e) {
    var s = sectionDe(e, tous);
    var sortants = liensDuTableau().filter(function (l) { return l.de === e.id; }).map(function (l) { return (l.libelle ? l.libelle + ' : ' : '') + libelleCourt(etat.parId[l.vers]); }).join(' | ');
    lignes.push([libelleAffiche(e), e.type, e.type === 'Forme' ? e.forme : '', nomCouleur(e.couleur), sensCouleur(e.couleur), s ? libelleCourt(s) : '', e.responsable, e.statut, e.votes,
      e.ficheLigne ? texteLigneLiee(e.ficheTable, e.ficheLigne, colonneAffichee(e.ficheTable)) : '', e.description, sortants].map(champCsv).join(';'));
  });
  telechargerBlob(new Blob(['﻿' + lignes.join('\r\n')], { type: 'text/csv;charset=utf-8' }), nomFichier('csv'));
  afficherToast(pluriel(lignes.length - 1, 'élément exporté', 'éléments exportés') + ' en CSV' + (t ? ' (« ' + t.nom + ' »)' : '') + '.');
}

/* Couleur calculee d'une variable du systeme de design : l'image PNG ne
   lit pas var(). */
function couleurResolue(expr) {
  var sonde = document.createElement('span');
  sonde.style.color = expr;
  sonde.hidden = true;
  document.body.appendChild(sonde);
  var c = getComputedStyle(sonde).color;
  document.body.removeChild(sonde);
  return c || 'rgb(0,0,0)';
}

function echapperXml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

/* Coupe un texte en lignes pour une largeur donnee (approximation de la
   largeur moyenne d'un caractere). */
function couperTexte(texte, largeur, taille) {
  var max = Math.max(4, Math.floor(largeur / (taille * 0.55)));
  var lignes = [];
  String(texte || '').split('\n').forEach(function (para) {
    var cour = '';
    para.split(/\s+/).forEach(function (m) {
      if (!m) { return; }
      if ((cour + ' ' + m).trim().length > max && cour) { lignes.push(cour); cour = m; } else { cour = (cour + ' ' + m).trim(); }
    });
    lignes.push(cour);
  });
  return lignes;
}

function construireSvgExport() {
  var tous = elementsDuTableau();
  var b = boiteDe(tous);
  if (!b) { return null; }
  var m = 30;
  var W = Math.ceil(b.x2 - b.x1 + 2 * m), H = Math.ceil(b.y2 - b.y1 + 2 * m);
  var ox = m - b.x1, oy = m - b.y1;
  var texte = couleurResolue('var(--text-default-grey)');
  var fondPage = couleurResolue('var(--background-alt-grey)');
  var parts = ['<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" font-family="Marianne, Arial, sans-serif">',
    '<rect width="' + W + '" height="' + H + '" fill="' + fondPage + '"/>',
    '<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="' + texte + '"/></marker></defs>'];
  var tries = tous.slice().sort(function (a, c) { return (a.type === 'Section' ? -1e9 : 0) + a.ordre - ((c.type === 'Section' ? -1e9 : 0) + c.ordre) || a.id - c.id; });
  var textes = [];
  tries.forEach(function (e) {
    var x = e.x + ox, y = e.y + oy, fond = couleurResolue(fondCouleur(e.couleur)), bord = couleurResolue(bordCouleur(e.couleur));
    if (e.type === 'Section') {
      parts.push('<rect x="' + x + '" y="' + y + '" width="' + e.w + '" height="' + e.h + '" fill="none" stroke="' + bord + '" stroke-width="2" stroke-dasharray="8 6"/>');
      textes.push('<text x="' + (x + 12) + '" y="' + (y - 6) + '" font-size="14" font-weight="700" fill="' + texte + '">' + echapperXml(libelleAffiche(e) || 'Section') + '</text>');
      return;
    }
    if (e.type === 'Post-it') { parts.push('<rect x="' + x + '" y="' + y + '" width="' + e.w + '" height="' + e.h + '" fill="' + fond + '"/>'); }
    if (e.type === 'Forme') {
      if (e.forme === 'Ovale') { parts.push('<ellipse cx="' + (x + e.w / 2) + '" cy="' + (y + e.h / 2) + '" rx="' + (e.w / 2) + '" ry="' + (e.h / 2) + '" fill="' + fond + '" stroke="' + bord + '" stroke-width="1.5"/>'); }
      else if (e.forme === 'Losange') { parts.push('<polygon points="' + [x + e.w / 2, y, x + e.w, y + e.h / 2, x + e.w / 2, y + e.h, x, y + e.h / 2].join(' ') + '" fill="' + fond + '" stroke="' + bord + '" stroke-width="1.5"/>'); }
      else if (e.forme === 'Parallélogramme') { var d = Math.min(e.w * 0.18, 30); parts.push('<polygon points="' + [x + d, y, x + e.w, y, x + e.w - d, y + e.h, x, y + e.h].join(' ') + '" fill="' + fond + '" stroke="' + bord + '" stroke-width="1.5"/>'); }
      else { var r = e.forme === 'Pilule' ? Math.min(e.w, e.h) / 2 : 0; parts.push('<rect x="' + x + '" y="' + y + '" width="' + e.w + '" height="' + e.h + '" rx="' + r + '" fill="' + fond + '" stroke="' + bord + '" stroke-width="1.5"/>'); }
    }
    var taille = e.type === 'Texte' ? 16 : 14;
    var lignes = couperTexte(libelleAffiche(e), e.w - 16, taille).slice(0, Math.max(1, Math.floor((e.h - 8) / (taille * 1.3))));
    var gauche = e.type === 'Post-it';
    var y0 = gauche ? y + 10 + taille : y + e.h / 2 - (lignes.length - 1) * taille * 0.65 + taille * 0.35;
    lignes.forEach(function (l, k) {
      textes.push('<text x="' + (gauche ? x + 12 : x + e.w / 2) + '" y="' + (y0 + k * taille * 1.3) + '" font-size="' + taille + '" text-anchor="' + (gauche ? 'start' : 'middle') + '" fill="' + texte + '">' + echapperXml(l) + '</text>');
    });
  });
  liensDuTableau().forEach(function (l) {
    var g = geometrieLien(l);
    var att = l.fleche !== 'Sans flèche' ? ' marker-end="url(#f)"' : '';
    if (l.fleche === 'Dans les deux sens') { att += ' marker-start="url(#f)"'; }
    parts.push('<path d="M' + (g.x1 + ox) + ' ' + (g.y1 + oy) + 'L' + (g.x2 + ox) + ' ' + (g.y2 + oy) + '" stroke="' + texte + '" stroke-width="1.5" fill="none"' + (l.style === 'Pointillés' ? ' stroke-dasharray="6 5"' : '') + att + '/>');
    if (l.libelle) {
      var lw = l.libelle.length * 7.5 + 8;
      parts.push('<rect x="' + (g.mx + ox - lw / 2) + '" y="' + (g.my + oy - 10) + '" width="' + lw + '" height="20" fill="' + fondPage + '"/>');
      textes.push('<text x="' + (g.mx + ox) + '" y="' + (g.my + oy + 5) + '" font-size="13" font-weight="700" text-anchor="middle" fill="' + texte + '">' + echapperXml(l.libelle) + '</text>');
    }
  });
  return { svg: parts.concat(textes).join('') + '</svg>', w: W, h: H };
}

async function exporterImage() {
  var r = construireSvgExport();
  if (!r) { signalerSaisie('Le tableau blanc est vide : rien à exporter.'); return; }
  afficherLoader('Préparation de l\'image…');
  try {
    var echelle = Math.min(2, 8000 / Math.max(r.w, r.h));
    var url = URL.createObjectURL(new Blob([r.svg], { type: 'image/svg+xml' }));
    var img = new Image();
    await new Promise(function (ok, ko) { img.onload = ok; img.onerror = function () { ko(new Error('Image illisible')); }; img.src = url; });
    var cv = document.createElement('canvas');
    cv.width = Math.round(r.w * echelle); cv.height = Math.round(r.h * echelle);
    var ctx = cv.getContext('2d');
    ctx.scale(echelle, echelle);
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);
    var blob = await new Promise(function (ok) { cv.toBlob(ok, 'image/png'); });
    masquerLoader();
    if (!blob) { throw new Error('Image non produite'); }
    telechargerBlob(blob, nomFichier('png'));
    afficherToast('Image téléchargée.');
  } catch (e) { masquerLoader(); afficherErreur('L\'image n\'a pas pu être produite.', e); }
}

/* Plein ecran, ou « Agrandir » quand la plateforme le refuse. */
function basculerPleinEcran() {
  var dedans = !!document.fullscreenElement || etat.agrandi;
  if (dedans) {
    if (document.fullscreenElement && document.exitFullscreen) { relayer(document.exitFullscreen(), 'Plein écran'); }
    etat.agrandi = false;
    document.body.classList.remove('w-agrandi');
  } else {
    var ok = false;
    try { if (document.documentElement.requestFullscreen && document.fullscreenEnabled) { relayer(document.documentElement.requestFullscreen(), 'Plein écran'); ok = true; } }
    catch (e) { logSecurite('INFO', 'Plein écran refusé', e); }
    if (!ok) { etat.agrandi = true; document.body.classList.add('w-agrandi'); }
  }
  setTimeout(function () {
    var b = document.getElementById('bPlein');
    var actif = !!document.fullscreenElement || etat.agrandi;
    if (b) { b.setAttribute('data-bulle', actif ? 'Quitter le plein écran' : 'Plein écran'); var sr = b.querySelector('.fr-sr-only'); if (sr) { sr.textContent = actif ? 'Quitter le plein écran' : 'Plein écran'; } }
    appliquerCamera();
  }, 200);
}

/* === SECTION : CONFIRMATION ===
   Confirmation dans la page. Resout true ou false. */
function elementsFocusables(racine) {
  return Array.prototype.filter.call(racine.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'),
    function (n) { return !n.disabled && n.offsetParent !== null; });
}

function fabriquerPiege(racine, fermer) {
  return function (e) {
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); fermer(); return; }
    if (e.key !== 'Tab') { return; }
    var f = elementsFocusables(racine);
    if (!f.length) { return; }
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  };
}

function confirmer(titre, message, libelleOui) {
  return new Promise(function (resolve) {
    var ov = document.getElementById('wConfirmOverlay');
    if (_confirm.resolution) { _confirm.resolution(false); }
    _confirm.resolution = resolve;
    document.getElementById('wConfirmTitre').textContent = titre;
    document.getElementById('wConfirmMsg').textContent = message || '';
    document.getElementById('wConfirmOui').textContent = libelleOui || 'Confirmer';
    _confirm.retour = document.activeElement;
    ov.classList.add('actif');
    void ov.offsetHeight;
    if (_confirm.pieger) { ov.removeEventListener('keydown', _confirm.pieger); }
    _confirm.pieger = fabriquerPiege(ov, function () { terminerConfirmation(false); });
    ov.addEventListener('keydown', _confirm.pieger);
    document.getElementById('wConfirmNon').focus();
  });
}

function terminerConfirmation(oui) {
  var ov = document.getElementById('wConfirmOverlay');
  ov.classList.remove('actif');
  if (_confirm.pieger) { ov.removeEventListener('keydown', _confirm.pieger); _confirm.pieger = null; }
  var r = _confirm.retour;
  _confirm.retour = null;
  if (r && document.body.contains(r) && typeof r.focus === 'function') { r.focus(); }
  var res = _confirm.resolution;
  _confirm.resolution = null;
  if (res) { res(!!oui); }
}

/* === SECTION : FIL D'ARIANE ===
   Composant commun : barre d'etapes, « Etape N sur M », coches, etapes
   cliquables, et en bas « Etape precedente » et « Continuer ». */
function filAriane(noms, n, aller, idTitre) {
  var d = creer('div', { classe: 'fr-stepper' });
  d.appendChild(creer('h2', { classe: 'fr-stepper__title', id: idTitre || 'titreVue', attrs: { tabindex: '-1' } }, [noms[n],
    creer('span', { classe: 'fr-stepper__state', texte: 'Étape ' + (n + 1) + ' sur ' + noms.length })]));
  var ol = creer('ol', { classe: 'w-etapes', attrs: { 'aria-label': 'Étapes' } });
  noms.forEach(function (nom, i) {
    var et = i < n ? 'faite' : (i === n ? 'en-cours' : 'a-venir');
    var contenuEtape = [creer('span', { classe: 'w-etapes__segment', attrs: { 'aria-hidden': 'true' } }),
      creer('span', { classe: 'w-etapes__ligne' }, [et === 'faite' ? creer('span', { classe: 'fr-icon-checkbox-circle-fill fr-icon--sm w-etapes__coche', attrs: { 'aria-hidden': 'true' } }) : null,
        creer('span', { classe: 'w-etapes__nom', texte: nom })]),
      creer('span', { classe: 'fr-sr-only', texte: et === 'faite' ? ' (terminée)' : (et === 'en-cours' ? ' (en cours)' : ' (à venir)') })];
    var li = creer('li', { classe: 'w-etapes__item w-etapes__item--' + et, attrs: { 'aria-current': et === 'en-cours' ? 'step' : null } },
      aller && i !== n ? [creer('button', { classe: 'w-etapes__bouton', clic: function () { aller(i); } }, contenuEtape)] : contenuEtape);
    ol.appendChild(li);
  });
  d.appendChild(ol);
  return d;
}

function navEtapes(noms, n, aller, finale) {
  var nav = creer('div', { classe: 'w-nav-etapes' });
  nav.appendChild(n > 0 ? bouton('Étape précédente : ' + noms[n - 1], 'secondaire', 'arrow-left-line', function () { aller(n - 1); }, { id: 'nPrecedent' }) : creer('span'));
  if (n < noms.length - 1) { nav.appendChild(bouton('Continuer : ' + noms[n + 1], null, 'arrow-right-line', function () { aller(n + 1); }, { id: 'nSuivant', iconeDroite: true, classe: 'w-pousse' })); }
  else if (finale) { nav.appendChild(finale); }
  return nav;
}

/* === SECTION : EDITEURS PARTAGES (creation et parametrage) ===
   Chaque editeur modifie l'objet « cible » (reglage en cours de creation ou
   tableau existant) puis appelle « apres » (enregistrement automatique en
   parametrage). */
function editeurLegende(cible, apres, idBase) {
  var bloc = creer('div', { classe: 'w-colonne' });
  var redessiner = function (focusId) {
    var neuf = editeurLegende(cible, apres, idBase);
    bloc.parentNode.replaceChild(neuf, bloc);
    var f = focusId ? document.getElementById(focusId) : null;
    if (f) { f.focus(); }
  };
  bloc.appendChild(titreColonne('Légende des couleurs', idBase + 'Titre', 'Le sens de chaque couleur : il s\'affiche dans le volet, la fiche et la liste, et sert de filtre. On choisit la couleur d\'un élément dans sa barre d\'actions.'));

    etat.config = normaliserConfig(etat.config || {});
    etat.config.tableaux.push(t);
    await ecrireConfig();
    try { await semer(t, c); }
    catch (eSem) {
      logSecurite('AVERTISSEMENT', 'Contenu de départ non ajouté', eSem);
      if (!etat.tables.el || !etat.tables.li) { throw eSem; }
    }
    etat.creation = null;
    masquerLoader();
    choisirTableau(id);
    etat.signature = '';
    try { await chargerDonnees(); }
    catch (eL) { logSecurite('INFO', 'Tables nouvelles pas encore lisibles dans cette session', eL); rendreMessage('recharger'); return; }
    etat.cam = null;
    rendrePrincipal();
    afficherToast('Tableau blanc « ' + t.nom + ' » créé.');
  } catch (e) {
    masquerLoader();
    erreurEcriture(e, 'La création n\'a pas abouti. Rien n\'a été supprimé : vous pouvez réessayer.');
  }
}

/* Contenu de depart : elements du modele et leurs connecteurs, ou une ligne
   de la table source par post-it, en grille. */
async function semer(t, c) {
  if (c.depart === 'donnees') {
    var d = await lireTable(c.source.table);
    var info = c.source.couleur ? infoColonne(c.source.table, c.source.couleur) : null;
    var parValeur = {};
    t.legende.forEach(function (x) { parValeur[x.libelle] = x.couleur; });
    var defaut = t.legende[0] ? t.legende[0].couleur : 'yellow-tournesol';
    var lignes = d.id.map(function (rid, i) {
      var v = info ? texteLisible(d[c.source.couleur] ? d[c.source.couleur][i] : '') : '';
      return { TABLEAU: t.id, TYPE: 'Post-it', FORME: '', LIBELLE: '', COULEUR: parValeur[v] || defaut, POSITION_X: (i % 6) * 200, POSITION_Y: Math.floor(i / 6) * 160,
        LARGEUR: 170, HAUTEUR: 130, ORDRE: i + 1, FICHE_TABLE: c.source.table, FICHE_LIGNE: rid };
    });
    if (lignes.length) { await agir([actionAjoutLot(etat.tables.el, lignes)]); }
    return;
  }
  var m = MODELES.filter(function (x) { return x.cle === c.modele; })[0];
  if (!m || !m.elements.length) { return; }
  var lot = m.elements.map(function (e, i) {
    return { TABLEAU: t.id, TYPE: e.t, FORME: e.f || '', LIBELLE: e.l, COULEUR: e.c, POSITION_X: e.x, POSITION_Y: e.y, LARGEUR: e.w, HAUTEUR: e.h, ORDRE: e.t === 'Section' ? 0 : i + 1 };
  });
  var r = await agir([actionAjoutLot(etat.tables.el, lot)]);
  var ids = r && r.retValues ? r.retValues[0] : [];
  if (m.liens.length && ids.length === lot.length) {
    await agir([actionAjoutLot(etat.tables.li, m.liens.map(function (l) { return { TABLEAU: t.id, DE: ids[l[0]], VERS: ids[l[1]], LIBELLE: l[2] || '', STYLE: 'Plein', FLECHE: l[3] || 'Vers la fin' }; }))]);
  }
}

async function ajouterNouvellesLignes(t) {
  try {

    var nouvelles = d.id.filter(function (rid) { return !deja[rid]; });
    if (!nouvelles.length) { afficherToast('Toutes les lignes sont déjà sur le tableau.'); return; }
    var b = boiteDe(elementsDuTableau());
    var y0 = b ? b.y2 + 60 : 0;
    var defaut = t.legende[0] ? t.legende[0].couleur : 'yellow-tournesol';
    var base = ordreMax();
    var lignes = nouvelles.map(function (rid, i) {
      return { TABLEAU: t.id, TYPE: 'Post-it', LIBELLE: '', COULEUR: defaut, POSITION_X: (i % 6) * 200, POSITION_Y: y0 + Math.floor(i / 6) * 160, LARGEUR: 170, HAUTEUR: 130, ORDRE: base + i + 1, FICHE_TABLE: t.source.table, FICHE_LIGNE: rid };

async function supprimerTableau(t) {

  afficherLoader('Suppression…');
  try {
    var ids = etat.elements.filter(function (e) { return e.tableau === t.id; }).map(function (e) { return e.id; });
    var lids = etat.liens.filter(function (l) { return l.tableau === t.id || ids.indexOf(l.de) !== -1 || ids.indexOf(l.vers) !== -1; }).map(function (l) { return l.id; });
    var actions = [];
    if (lids.length) { actions.push(['BulkRemoveRecord', etat.tables.li, lids]); }
    if (ids.length) { actions.push(['BulkRemoveRecord', etat.tables.el, ids]); }
    if (actions.length) { await agir(actions); }
    etat.config.tableaux = etat.config.tableaux.filter(function (x) { return x.id !== t.id; });
    await ecrireConfig();
    masquerLoader();
    etat.param = null;
    etat.signature = '';

    if (reste.length) { choisirTableau(reste[0].id); await chargerDonnees(); rendrePrincipal(); }

/* Saisie refusee : message sous le champ, relie par aria-describedby. */
function marquerInvalide(id, message) {
  var n = document.getElementById(id);
  logSecurite('INFO', 'Saisie refusée : ' + message);
  if (!n) { signalerSaisie(message); return; }
  var idMsg = id + '_erreur';
  var ancien = document.getElementById(idMsg);
  if (ancien) { ancien.parentNode.removeChild(ancien); }
  var msg = creer('p', { classe: 'fr-error-text', id: idMsg, texte: message });
  var groupe = n.closest ? n.closest('.fr-input-group, .fr-select-group') : null;
  if (groupe) { groupe.classList.add(groupe.classList.contains('fr-select-group') ? 'fr-select-group--error' : 'fr-input-group--error'); groupe.appendChild(msg); }
  else if (n.parentNode) { n.parentNode.insertBefore(msg, n.nextSibling); }
  n.setAttribute('aria-invalid', 'true');
  n.setAttribute('aria-describedby', idMsg);
  var effacer = function () {
    n.removeAttribute('aria-invalid');
    n.removeAttribute('aria-describedby');
    if (groupe) { groupe.classList.remove('fr-input-group--error'); groupe.classList.remove('fr-select-group--error'); }
    if (msg.parentNode) { msg.parentNode.removeChild(msg); }
    n.removeEventListener('input', effacer);
  };
  n.addEventListener('input', effacer);
  n.focus();
  annoncer(message);
}

    corps.appendChild(creer('ul', {}, ['Logigramme : début, étapes, décisions et fin, reliés par des connecteurs avec un libellé (Oui, Non).', 'Atelier : post-it par colonnes, couleurs par thème, votes.'].map(function (t) { return creer('li', { texte: t }); })));
    corps.appendChild(creer('h3', { texte: 'Fonctionnalités' }));
    corps.appendChild(creer('ul', {}, ['Toile sans limite : déplacement, zoom, grille magnétique, mini-carte.', 'Formes, post-it, textes et sections ; une section emporte son contenu quand on la déplace.',
      'Fiche de chaque élément : description, responsable, statut, pièces jointes, ligne liée d\'une autre table.', 'Plusieurs tableaux blancs par document, en onglets ; vue toile et vue liste.',
      'Travail à plusieurs : les ajouts des autres apparaissent dès qu\'ils sont enregistrés.', 'Impression, PDF, image et export CSV.'].map(function (t) { return creer('li', { texte: t }); })));
    corps.appendChild(creer('h3', { texte: 'Raccourcis sur la toile' }));
    var dl = creer('dl', { classe: 'w-raccourcis' });
    [['V, H', 'Sélectionner, déplacer la vue'], ['N, R, T, S', 'Post-it, forme, texte, section'], ['L', 'Connecteur'], ['Entrée', 'Modifier le texte'], ['Flèches', 'Déplacer la sélection'],
      ['Suppr', 'Supprimer'], ['Ctrl+D', 'Dupliquer'], ['Ctrl+Z', 'Annuler'], ['Ctrl+molette', 'Zoomer'], ['0', 'Recentrer'], ['Échap', 'Désélectionner']].forEach(function (x) {
      dl.appendChild(creer('dt', { texte: x[0] })); dl.appendChild(creer('dd', { texte: x[1] }));
    });
    corps.appendChild(dl);
    corps.appendChild(creer('h3', { texte: 'Avant de commencer' }));
    corps.appendChild(creer('p', { texte: 'Le widget a besoin d\'un accès complet au document. À la première ouverture, l\'assistant crée les tables nécessaires.' }));
    var t = tableauCourant();
    if (t && t.legende.length && etat.vue === 'principal') {
      corps.appendChild(creer('h3', { texte: 'Légende de « ' + t.nom + ' »' }));
      corps.appendChild(creer('ul', {}, t.legende.map(function (x) { return creer('li', {}, [pastilleCouleur(x.couleur), ' ', x.libelle || nomCouleur(x.couleur)]); })));
    }
  } else if (etat.aide.onglet === 1) {
    var courante = etapeAideCourante();
    var fiches = FICHES_AIDE.filter(function (f) { return etat.vue === 'creation' ? f.cle.indexOf('creation') === 0 : f.cle.indexOf('creation') !== 0; });
    var rang = -1;
    fiches.forEach(function (f, i) { if (f.cle === courante) { rang = i; } });
    fiches.forEach(function (f, i) {
      var cour = f.cle === courante;
      var faite = etat.vue === 'creation' && rang !== -1 && i < rang;
      corps.appendChild(creer('section', { classe: 'w-fiche-etape' + (cour ? ' w-fiche-etape--courante' : ''), attrs: { 'aria-current': cour ? 'step' : null } }, [
        creer('h4', {}, [faite ? creer('span', { classe: 'fr-icon-check-line fr-icon--sm', attrs: { 'aria-hidden': 'true' } }) : null, f.titre, cour ? creer('span', { classe: 'fr-sr-only', texte: ' (étape en cours)' }) : null]),
        creer('p', { texte: f.texte })]));
    });
  } else {
    var q = [['Je ne vois pas les outils pour dessiner.', 'Vos droits sur ce document ne le permettent pas, ou ils ont été réservés. Vous pouvez tout de même parcourir la toile et ouvrir les fiches.'],
      ['Puis-je voir les autres personnes travailler en direct ?', 'Leurs ajouts et modifications apparaissent dès qu\'ils sont enregistrés, après quelques secondes. Les curseurs des autres personnes ne sont pas affichés.'],
      ['Comment relier une forme à une démarche, un projet... ?', 'Dans les paramétrages, étape « La fiche », choisissez la table. Puis sélectionnez la forme et cliquez sur « Relier à une fiche » dans sa barre d\'actions.'],
      ['Comment déplacer une section avec ce qu\'elle contient ?', 'Faites glisser la section : les éléments entièrement à l\'intérieur suivent.'],
      ['Comment déplacer un élément sans souris ?', 'Tab jusqu\'à l\'élément, puis les flèches (Maj+flèche pour un déplacement fin). La vue liste donne aussi accès à chaque élément.'],
      ['J\'ai supprimé un élément par erreur.', 'Cliquez sur « Annuler » en bas à droite, ou Ctrl+Z, dans les secondes qui suivent.'],
      ['Où sont rangées les données ?', 'Dans les tables « ' + DEF_EL.titre + ' » et « ' + DEF_LI.titre + ' », visibles dans Données source.']];
    q.forEach(function (x) { corps.appendChild(creer('h3', { texte: x[0] })); corps.appendChild(creer('p', { texte: x[1] })); });
  }
  p.appendChild(corps);
}

/* === SECTION : ECRANS DE MESSAGE === */
function rendreMessage(vue) {
  etat.vue = vue;
  rendreOnglets();
  var zone = contenu();
  vider(zone);
  zone.className = 'w-contenu';
  var textes = {
    acces: ['Accès au document nécessaire', 'Ce widget a besoin d\'un accès complet au document pour lire et enregistrer les tableaux blancs. Accordez-le dans le panneau de configuration du widget, à droite (niveau d\'accès « Accès complet au document »).'],
    hors: ['Widget à ajouter dans un document', 'Ce widget s\'utilise dans un document : ajoutez-le à une page en tant que vue personnalisée.'],
    recharger: ['Le tableau blanc est créé', 'Les nouvelles tables seront lisibles après un rechargement du widget.'],
    aucun: ['Aucun tableau blanc pour l\'instant', etat.peutParametrer ? 'Créez un premier tableau blanc : un logigramme, un atelier post-it, ou vos données placées sur une toile.' : 'Une personne qui peut paramétrer le document doit d\'abord créer un tableau blanc.'],
    echec: ['Chargement impossible', 'Les données du document n\'ont pas pu être lues. Réessayez dans un instant.']
  };
  var t = textes[vue] || textes.echec;
  var bloc = creer('div', { classe: 'w-vide' }, [creer('h2', { classe: 'fr-h4 w-titre-vue', id: 'titreVue', texte: t[0], attrs: { tabindex: '-1' } }), creer('p', { classe: 'w-texte', texte: t[1] })]);
  if (vue === 'aucun' && etat.peutParametrer) { bloc.appendChild(bouton('Créer un tableau blanc', null, 'add-line', ouvrirCreation, { id: 'mCreer' })); }
  if (vue === 'recharger') { bloc.appendChild(bouton('Recharger le widget', null, 'refresh-line', function () { window.location.reload(); }, { id: 'mRecharger' })); }
  if (vue === 'echec' || vue === 'acces') { bloc.appendChild(bouton('Réessayer', null, 'refresh-line', function () { return chargerTout(); }, { id: 'mReessayer' })); }
  zone.appendChild(bloc);
}

/* === SECTION : CHARGEMENT ET RAFRAICHISSEMENT === */
async function chargerTout() {
  afficherLoader('Chargement des tableaux blancs…');
  etat.enCours = true;
  try {
    await chargerMeta();
    await lireCentrale();
    majDroits();
    resoudreTables();
    if (!etat.config) { etat.config = normaliserConfig({}); }
    var l = tableaux();
    if (!l.length) {
      masquerLoader();
      etat.enCours = false;
      if (etat.peutParametrer && (etat.niveauAcces === null || etat.niveauAcces === 'full')) { ouvrirCreation(); }
      else { rendreMessage('aucun'); }
      return;
    }
    var pref = lirePref('tableau', null);
    choisirTableau(l.some(function (t) { return t.id === pref; }) ? pref : l[0].id);
    etat.signature = '';
    await chargerDonnees();
    await lireInfosPj();
    masquerLoader();
    etat.enCours = false;
    rendrePrincipal();
    var t = document.getElementById('vToile'); if (t) { t.focus({ preventScroll: true }); }
  } catch (e) {
    masquerLoader();
    etat.enCours = false;
    var m = String((e && (e.message || e)) || '');
    rendreMessage(/access|permission|full/i.test(m) ? 'acces' : 'echec');
    logSecurite('ERREUR', 'Chargement impossible', e);
  }
}

function planifierRafraichissement(delai) {
  clearTimeout(etat.minuterieRafraichir);
  etat.minuterieRafraichir = setTimeout(function () { relayer(rafraichir(false), 'Rafraîchissement'); }, delai || 500);
}

/* Relecture sans gener la personne : jamais pendant un geste, une saisie
   sur la toile ou une ecriture ; l'ecran n'est redessine que si les
   donnees ont change. */
async function rafraichir(force) {
  if (etat.vue !== 'principal' && etat.vue !== 'parametrage') { return; }
  if (!etat.tables.el) { return; }
  if (!force && (etat.enCours || etat.geste || etat.edition || etat.ecrituresEnCours || _deplacementClavier)) { etat.attente = true; return; }
  etat.attente = false;
  etat.enCours = true;
  try {
    if (force) { etat.signature = ''; }
    var change = await chargerDonnees();
    if (change && etat.vue === 'principal') {
      if (etat.vueType === 'toile') { rendreMonde(); } else { rendreListe(); }
      majVolet();
      majBarre();
      var f = document.getElementById('wFiche');
      if (etat.fiche && f && !f.contains(document.activeElement)) { rendreFiche(); }
      if (!etat.fiche && f && !f.hidden) { f.hidden = true; vider(f); }
    }
  } catch (e) {
    logSecurite('AVERTISSEMENT', 'Relecture des tableaux blancs impossible', e);
  } finally {
    etat.enCours = false;
  }
}

/* === SECTION : DEMARRAGE === */
async function initialiser() {
  if (_initialise) { return; }
  _initialise = true;
  try { etat.nomDoc = await gristAvecTimeout(grist.docApi.getDocName(), 5000); } catch (e) { etat.nomDoc = null; }
  var pa = lirePref('aide', null);
  if (pa) { etat.aide.onglet = typeof pa.onglet === 'number' ? pa.onglet : 0; }
  await chargerTout();
  if (pa && pa.ouverte) { etat.aide.ouverte = true; var p = document.getElementById('wAide'); if (p) { p.hidden = false; rendreAide(); } var b = document.getElementById('bAide'); if (b) { b.setAttribute('aria-expanded', 'true'); b.classList.remove('fr-btn--secondary'); } }
  relayer(chargerLogo(), 'Logo du bandeau');
}

function brancherSocle() {
  var v = document.getElementById('bandeauVersion');
  if (v) { v.textContent = 'v' + VERSION_WIDGET; }
  var h = document.getElementById('bandeauHomologue');
  if (h) { h.hidden = !HOMOLOGUE; }
  document.getElementById('wErreurFermer').addEventListener('click', masquerErreur);
  document.getElementById('wConfirmOui').addEventListener('click', function () { terminerConfirmation(true); });
  document.getElementById('wConfirmNon').addEventListener('click', function () { terminerConfirmation(false); });
  document.getElementById('bAide').addEventListener('click', function () { ouvrirAide(!etat.aide.ouverte); });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' || document.getElementById('wConfirmOverlay').classList.contains('actif')) { return; }
    if (etat.aide.ouverte && document.getElementById('wAide').contains(document.activeElement)) { ouvrirAide(false); return; }
    var f = document.getElementById('wFiche');
    if (etat.fiche && f && f.contains(document.activeElement)) { fermerFiche(); return; }
    if (etat.voletMobile) { ouvrirVoletMobile(false); }
  });
  document.addEventListener('pointerdown', function (e) {
    if (etat.pop && !(e.target.closest && e.target.closest('.w-pop, .w-ctx'))) { fermerPop(); }
  });
  window.addEventListener('resize', function () { if (etat.vue === 'principal' && etat.vueType === 'toile') { appliquerCamera(); } });
  document.addEventListener('fullscreenchange', function () { setTimeout(appliquerCamera, 100); });
}

function demarrer() {
  brancherSocle();
  if (typeof grist === 'undefined') {
    afficherLogoRepli();
    rendreMessage('hors');
    return;
  }
  grist.ready({ requiredAccess: 'full', allowSelectBy: false });
  if (typeof grist.on === 'function') {
    grist.on('message', function (m) {
      if (m && m.settings && m.settings.accessLevel) { etat.niveauAcces = m.settings.accessLevel; }
    });
  }
  grist.onRecords(function () {
    if (!_initialise) { relayer(initialiser(), 'Initialisation'); } else { planifierRafraichissement(); }
  });
  /* Sans table liee, aucun enregistrement n'est envoye : le widget demarre
     seul. */
  setTimeout(function () { relayer(initialiser(), 'Initialisation'); }, DELAI_DEMARRAGE_MS);
  _minuterieActualisation = setInterval(function () {
    if (document.visibilityState === 'visible' && etat.vue === 'principal') { relayer(rafraichir(false), 'Relecture'); }
  }, DELAI_ACTUALISATION_MS);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && etat.vue === 'principal') { planifierRafraichissement(); } });
  setTimeout(function () {
    window.addEventListener('unhandledrejection', function (evt) { logSecurite('ERREUR', 'Promesse rejetée non capturée', evt ? evt.reason : undefined); });
  }, 1500);
}

demarrer();
</script>
