async function jeton() {
    var j = await gristAvecTimeout(grist.docApi.getAccessToken({ readOnly: true }), 15000);
    if (!j || !j.token || !j.baseUrl || !/^https:\/\//i.test(j.baseUrl)) {
        throw new Error('Jeton d\'accès indisponible');
    }
    return j;
}
async function lienVoirEnTantQue(email) {
    var j = await jeton();
    var m = /^(https:\/\/[^/]+(?:\/o\/[^/]+)?)\/api\/docs\/([^/?#]+)/.exec(j.baseUrl);
    if (!m) {
        throw new Error('Adresse du document non reconnue');
    }
    return m[1] + '/' + m[2] + '?aclAsUser_=' + encodeURIComponent(email);
}
function adresseValide(a) { return /^[^\s@<>"']+@[^\s@<>"']+\.[^\s@<>"']+$/.test(String(a || '')) && String(a).length <= 200; }
