async function chargerLogo() {
    var container = document.getElementById('bandeau-logo');
    if (!container) {
        return;
    }
    var logoSvg = null;
    try {
        var centrale = trouverTable('BIBLIOTHEQUE_CENTRALE');
        if (centrale) {
            var data = await lireTable(centrale);
            for (var i = 0; i < data.id.length; i++) {
                if ((data.WIDGET ? data.WIDGET[i] : '') === '__RESSOURCE__' && (data.NOM ? data.NOM[i] : '') === 'LOGO_SVG') {
                    logoSvg = data.CONTENU ? data.CONTENU[i] : '';
                    break;
                }
            }
            if (!logoSvg) {
                logoSvg = genererLogoMEAE();
                try {
                    await agir([['AddRecord', centrale, null, { WIDGET: '__RESSOURCE__', NOM: 'LOGO_SVG', CONTENU: logoSvg }]]);
                    logSecurite('INFO', 'Logo MEAE stocké dans la bibliothèque centrale');
                }
                catch (e) {
                    logSecurite('INFO', 'Stockage logo non possible', e);
                }
            }
        }
    }
    catch (e) {
        logSecurite('INFO', 'Chargement logo depuis biblio non possible', e);
    }
    if (!logoSvg) {
        logoSvg = genererLogoMEAE();
    }
    if (!injecterSvgSecurise(container, logoSvg)) {
        afficherLogoRepli();
    }
}

function creer(tag, o, enfants) {
    var n = document.createElement(tag);
    o = o || {};
    if (o.classe) {
        n.className = o.classe;
    }
    if (o.id) {
        n.id = o.id;
    }
    if (o.texte !== undefined && o.texte !== null) {
        n.textContent = String(o.texte);
    }
    if (o.attrs) {
        Object.keys(o.attrs).forEach(function (k) {
            var v = o.attrs[k];
            if (v === null || v === undefined || v === false) {
                return;
            }
            n.setAttribute(k, v === true ? '' : String(v));
        });
    }
    if (tag === 'button' && !n.hasAttribute('type')) {
        n.setAttribute('type', 'button');
    }
    if (tag === 'input' || tag === 'select' || tag === 'textarea') {
        n.setAttribute('autocomplete', 'off');
    }
    if (o.valeur !== undefined && o.valeur !== null) {
        n.value = String(o.valeur);
    }
    if (o.coche) {
        n.checked = true;
    }
    if (o.clic) {
        n.addEventListener('click', o.clic);
    }
    if (o.change) {
        n.addEventListener('change', o.change);
    }
    if (o.saisie) {
        n.addEventListener('input', o.saisie);
    }
    (enfants || []).forEach(function (e) {
        if (e === null || e === undefined || e === false) {
            return;
        }
        n.appendChild(typeof e === 'string' ? document.createTextNode(e) : e);
    });
    return n;
}
function bouton(libelle, variante, icone, clic, o) {

    for (var j = 0; j < defs.length; j++) {
        var d = defs[j];
        if (b.choixTables[d.cle].mode !== 'existante') {
            continue;
        }
        for (var k = 0; k < d.colonnes.length; k++) {
            var c = d.colonnes[k];
            if (IDS_META.indexOf(c.id) !== -1 || infoColonne(ids[d.cle], c.id)) {
                continue;
            }
            await ajouterColonne(ids[d.cle], c.id, c.type, c.widgetOptions || null, c.description || null);
        }
        await chargerMeta();
    }
    var cols = {};
    for (var m = 0; m < defs.length; m++) {
        var dm = defs[m];
        cols[dm.cle] = {};
        for (var r = 0; r < dm.refs.length; r++) {
            var ref = dm.refs[r];
            if (infoColonne(ids[dm.cle], ref.id)) {
                cols[dm.cle][ref.id] = ref.id;
                continue;
            }
            cols[dm.cle][ref.id] = ref.cible === dm.cle
                ? await ajouterColonneRattachement(ids[dm.cle], ref.id, 'NOM', ref.description)
                : await ajouterColonneRef(ids[dm.cle], ref.id, ids[ref.cible], 'NOM', ref.description);
        }
    }
    await chargerMeta();
    return { ids: ids, cols: cols };
}
async function creerOrganigramme() {
    var b = etat.brouillon;
    var noms = nomsEtapes(b);
    for (var i = 1; i < noms.length; i++) {
        if (!validerEtapeSilencieuse(noms[i])) {
            allerEtape(i);
            validerEtape(noms[i]);
            return;
        }
    }
    if (b.parcours === 'donnees' && !validerEtape('Le rattachement')) {

        await assurerBibliotheque();
        var modeleAgents = b.parcours === 'vierge' && b.modele === 'agents';
        var modeleStructure = b.parcours === 'vierge' && b.modele === 'structure';
        var table = b.table;
        etat.biblioLigne = null;
        etat.cleConfig = nouvelleCle();
        var cfg;
        var T = b.parcours === 'vierge' ? await preparerTablesModele(b) : null;
        if (modeleAgents) {
            cfg = configDepuisBrouillon(Object.assign({}, b, { table: T.ids.entites, colTitre: 'NOM', colParent: T.cols.entites.ENTITE_MERE, colSousTitre: '', colPhoto: '', colCouleur: '',
                champsCarte: [], champsFiche: [], typeOrga: 'entites', colNiveau: 'NIVEAU', niveauxOrdre: NIVEAUX_EXEMPLE.slice(), niveauxCouleurs: {}, colResponsable: T.cols.entites.RESPONSABLE,
                agents: { table: T.ids.agents, colEntite: T.cols.agents.ENTITE, colNom: 'NOM', colPrenom: infoColonne(T.ids.agents, 'PRENOM') ? 'PRENOM' : '', colFonction: 'FONCTION', colPhoto: 'PHOTO', champs: ['EMAIL', 'TELEPHONE'] } }), {});
        }
        else if (modeleStructure) {
            cfg = configDepuisBrouillon(Object.assign({}, b, { table: T.ids.main, colTitre: 'NOM', colParent: T.cols.main.ENTITE_MERE, colSousTitre: '', colPhoto: '', colCouleur: '',
                champsCarte: [], champsFiche: [], typeOrga: 'entites', colNiveau: 'NIVEAU', niveauxOrdre: NIVEAUX_EXEMPLE.slice(), niveauxCouleurs: {}, colResponsable: 'RESPONSABLE',
                agents: agentsVide() }), {});
        }
        else if (b.parcours === 'vierge') {
            cfg = configDepuisBrouillon(Object.assign({}, b, { table: T.ids.main, colTitre: 'NOM', colParent: T.cols.main.RESPONSABLE, colSousTitre: 'FONCTION', colPhoto: 'PHOTO', colCouleur: 'SERVICE',
                champsCarte: [], champsFiche: ['SERVICE', 'EMAIL', 'TELEPHONE'], typeOrga: 'personnes' }), {});
        }
        else {
            var colParent = b.colParent;
            if (colParent === '__ajout__') {
                colParent = await ajouterColonneRattachement(table, b.typeOrga === 'entites' ? 'ENTITE_MERE' : 'RESPONSABLE', b.colTitre, b.typeOrga === 'entites' ? DESCRIPTION_ENTITE_MERE : DESCRIPTION_RESPONSABLE);
            }
            if (b.parcours === 'entites' && b.creerAgents) {
                b.agents = await creerTablePersonnes(table, b.colTitre);
                b.creerAgents = false;
            }
            if (b.agents && b.agents.table && (b.champsAjout || []).length) {
                for (var ca = 0; ca < b.champsAjout.length; ca++) {
                    var reelC = await ajouterColonne(b.agents.table, idChamp(b.champsAjout[ca].nom), b.champsAjout[ca].type, null, b.champsAjout[ca].nom);
                    b.agents.champs = (b.agents.champs || []).concat([reelC]);
                }
                await chargerMeta();
            }
            var colResp = b.colResponsable;
            if (b.parcours === 'entites' && b.agents && b.agents.table && !estLienAgents(b, colResp)) {
                colResp = await assurerColonneResponsable(table, b.agents);
            }
            cfg = configDepuisBrouillon(Object.assign({}, b, { colParent: colParent, colResponsable: colResp }), {});
        }
        await ecrireConfig(cfg);
        await supprimerCreationSauvee();
        var cle = etat.cleConfig;
        etat.orgaSession = cle;
        etat.surAccueil = false;
        etat.ouvrirParamApres = pageAdminOr();
        ecrirePref('dernier', cle, true);
        etat.brouillon = null;
        reinitialiserVue();
        masquerLoader();
        try {
            await chargerMeta();
            await lireOrganigrammes();
            choisirOrganigramme();
            if (!verifierConfig()) {
                throw new Error('Configuration non relue');
            }
            await chargerDonnees();
        }
        catch (eLecture) {
            logSecurite('INFO', 'Nouvelle table pas encore lisible dans cette session', eLecture);
            afficherVue('recharger');
            return;
        }
        if (!(await chargerTout())) {
            return;
        }
        afficherSucces('Votre organigramme « ' + cfg.nom + ' » est prêt.');
    }
    catch (e) {
        masquerLoader();
        afficherErreur(estRefusDroits(e) ? 'Vos droits sur ce document ne permettent pas de créer un organigramme.' : 'La création de l\'organigramme n\'a pas abouti. Rien n\'a été supprimé : vous pouvez réessayer.', e);
    }
}
function majAttente() {
    var b = etat.brouillon;
    majApercu();
    if (b && b.mode === 'personnalisation') {
        planifierSauvegarde();
    }
}
function statutSauvegarde(texte, erreur) {
    var b = etat.brouillon;
    if (b) {
        b.statut = texte;
    }
    var z = document.getElementById('aStatut');
    if (z) {
        z.textContent = texte;
        z.classList.toggle('w-statut--erreur', !!erreur);
    }
}
function planifierSauvegarde() {
    var b = etat.brouillon;
    clearTimeout(b.minuterie);
    statutSauvegarde('Modification en cours…');
    b.minuterie = setTimeout(function () { relayer(sauvegarderBrouillon(), 'Enregistrement automatique'); }, DELAI_AUTOSAVE_MS);
}
function aChange(b) { return JSON.stringify(etatComparable(b)) !== b.initial; }
async function sauvegarderBrouillon() {
    var b = etat.brouillon;
    if (!b || b.mode !== 'personnalisation') {
        return;
    }
    clearTimeout(b.minuterie);
    if (b.enCours) {
        b.encore = true;
        return;
    }
    if (!aChange(b)) {
        statutSauvegarde('');
        return;
    }
    var raison = raisonNonEnregistrable(b);
    if (raison) {
        statutSauvegarde('Non enregistré : ' + raison + '.', true);
        return;
    }
    b.enCours = true;
    statutSauvegarde('Enregistrement…');
    var gel = JSON.parse(JSON.stringify(etatComparable(b)));
    try {
        var cfg = configDepuisBrouillon(b, etat.config);
        await ecrireConfig(cfg);
        await lireOrganigrammes();
        b.initial = JSON.stringify(gel);
        var d = new Date();
        b.dernier = (d.getHours() < 10 ? '0' : '') + d.getHours() + ' h ' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
        statutSauvegarde('Enregistré à ' + b.dernier);
        var t = document.getElementById('aTitrePerso');
        if (t) {
            t.textContent = titreParametrage(cfg.nom);
        }
        if (etat.brouillon === b && etat.vue === 'orga' && pageAdminOr()) {
            await rafraichirApercuOr();
        }
    }
    catch (e) {
        statutSauvegarde('L\'enregistrement n\'a pas abouti.', true);
        afficherErreur('L\'enregistrement automatique n\'a pas abouti.', e);
    }
    b.enCours = false;
    if (b.encore && etat.brouillon === b) {
        b.encore = false;
        await sauvegarderBrouillon();
    }
}
async function sortirParametrages(afficher) {
    var b = etat.brouillon;
    if (b) {
        clearTimeout(b.minuterie);
        var limite = Date.now() + 30000;
        while (b.enCours && Date.now() < limite) {
            await new Promise(function (r) { setTimeout(r, 50); });
        }
        await sauvegarderBrouillon();
        if (aChange(b)) {
            var raison = raisonNonEnregistrable(b);
            var quitter = await confirmerAction('Quitter les paramétrages ?', 'Une modification n\'a pas pu être enregistrée' + (raison ? ' : ' + raison : '') + '. Elle sera perdue.', 'Quitter', { destructif: true });
            if (!quitter) {
                return false;
            }
        }
    }
    etat.brouillon = null;
    etat.editionPage = null;
    etat.signature = '';
    if (afficher) {
        await chargerTout();
    }
    return true;
}
async function supprimerOrganigramme() {
    var c = etat.config;
    if (!c || !etat.biblioLigne) {
        return;
    }
    var nbP = pagesDeLOrganigramme(etat.cleConfig).length;
    var ok = await confirmerAction('Supprimer l\'organigramme « ' + (c.nom || '') + ' » ?', 'L\'organigramme disparaît des onglets. Sa table « ' + libelleTable(c.table) + ' » et ses lignes restent dans le document.'
        + (nbP ? ' ' + (nbP > 1 ? nbP + ' pages de consultation le montrent : elles ne le montreront plus.' : 'Une page de consultation le montre : elle ne le montrera plus.') : '') + ' Cette action est définitive.', 'Supprimer l\'organigramme', { danger: true });
    if (!ok) {
        return;
    }
    afficherLoader('Suppression de l\'organigramme…');
    try {
        await agir([['RemoveRecord', etat.biblio, etat.biblioLigne]]);
        var nom = c.nom;
        etat.brouillon = null;
        etat.orgaSession = null;
        if (pageAdminOr()) {
            etat.surAccueil = true;
        }
        etat.config = null;
        etat.cleConfig = null;
        etat.biblioLigne = null;
        reinitialiserVue();
        ecrirePref('dernier', null, true);
        masquerLoader();
        await chargerTout();
        afficherSucces('L\'organigramme « ' + (nom || '') + ' » a été supprimé.');
    }
    catch (e) {
        masquerLoader();
        afficherErreur('La suppression de l\'organigramme n\'a pas abouti.', e);
    }
}
var _initialise = false;
async function initialiser() {
    if (_initialise) {
        return;
    }
    _initialise = true;
    try {
        etat.nomDoc = await gristAvecTimeout(grist.docApi.getDocName(), 5000);
    }
    catch (e) {
        etat.nomDoc = null;
    }
    await chargerTout();
    relayer(chargerLogo(), 'Logo du bandeau');
}
function brancherSocle() {
    var v = document.getElementById('bandeauVersion');
    if (v) {
        v.textContent = 'v' + VERSION_WIDGET + (ESSAI_WIDGET ? ' · essai ' + ESSAI_WIDGET : '');
    }
    var h = document.getElementById('bandeauHomologue');
    if (h) {
        h.hidden = !HOMOLOGUE;
    }
    document.getElementById('wToastFermer').addEventListener('click', function () { fermerToast(true); });
    document.getElementById('wToast').addEventListener('keydown', function (e) { if (e.key === 'Escape') {
        e.stopPropagation();
        fermerToast(true);
    } });
    document.getElementById('wModaleFermer').addEventListener('click', fermerModale);
    document.getElementById('wConfirmOui').addEventListener('click', function () { terminerConfirmation(true); });
    document.getElementById('wConfirmNon').addEventListener('click', function () { terminerConfirmation(false); });
    brancherAide();
    document.addEventListener('keydown', function (e) {
        if (e.key !== 'Escape' || e.defaultPrevented || etat.modaleOuverte || document.getElementById('wConfirmOverlay').classList.contains('actif')) {
            return;
        }
        if (etat.glisser) {
            annulerGlisser();
            return;
        }
        if (etat.voletMobile) {
            ouvrirVoletMobile(false);
            return;
        }
        if (etat.fiche) {
            if (enSaisie()) {
                annulerSaisie();
            }
            else {
                fermerFiche(true);
            }
        }
    });
    document.addEventListener('touchmove', function (e) { if (etat.glisser && etat.glisser.actif) {
        e.preventDefault();
    } }, { passive: false });
    window.addEventListener('resize', function () {
        if (etat.voletMobile && window.matchMedia('(min-width: 48.01em)').matches) {

        }

}
function demarrer() {
    brancherSocle();
    if (typeof grist === 'undefined') {
        afficherLogoRepli();
        afficherVue('hors');
        return;
    }
    grist.ready({ requiredAccess: 'full', allowSelectBy: true });
    grist.onOptions(function (options, interaction) {
        var badge = badgeValide(options && options.copie);
        if (badge !== etat.badge) {
            etat.badge = badge;
            if (_initialise && etat.vue !== 'assistant' && etat.vue !== 'chargement') {
                etat.orgaSession = null;
                relayer(chargerTout(), 'Changement du réglage de la page');
            }
        }
        var avant = etat.niveauAcces;
        var niveauAccorde = interaction ? interaction.accessLevel : null;
        etat.niveauAcces = niveauAccorde || null;
        _accesRecu();
        var refuse = function (n) { return n === 'none' || n === 'read table'; };
        if (refuse(avant) !== refuse(etat.niveauAcces) && _initialise) {
            relayer(chargerTout(), 'Changement du niveau d\'accès');
        }
    });
    grist.onRecords(function () {
        var lire = typeof grist.getSelectedTableId === 'function' ? grist.getSelectedTableId() : (grist.selectedTable && grist.selectedTable.getTableId ? grist.selectedTable.getTableId() : null);
        Promise.resolve(lire).then(function (tid) { etat.tableLiee = tid || null; }).catch(function () { etat.tableLiee = null; }).then(function () {
            if (!_initialise) {
                relayer(initialiser(), 'Initialisation');
            }
            else {
                planifierRafraichissement();
            }
        });
    });
    grist.onRecord(function (rec) {
        if (!rec || !rec.id || etat.vue !== 'orga' || !etat.config || etat.tableLiee !== etat.config.table) {
            return;
        }
        if (rec.id === etat.curseurPose) {
            etat.curseurPose = null;
            return;
        }
        if (rec.id === etat.choisi || etat.glisser) {
            return;
        }
        if (noeud(rec.id)) {
            reveler(rec.id, { fiche: true });
        }
    });
    setTimeout(function () { relayer(initialiser(), 'Initialisation'); }, 800);
    _minuterieActualisation = setInterval(function () {
        if (document.visibilityState === 'visible' && etat.vue === 'orga') {
            planifierRafraichissement();
        }
    }, DELAI_ACTUALISATION_MS);
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && etat.vue === 'orga') {
        planifierRafraichissement();
    } });
    setTimeout(function () {
        window.addEventListener('unhandledrejection', function (evt) {
            logSecurite('ERREUR', 'Promesse rejetée non capturée', evt ? evt.reason : undefined);
        });
    }, 1500);
}
demarrer();

(function () {
    var cible = document.querySelector('.w-bandeau__titre');
    if (!cible || typeof MutationObserver === 'undefined') {
        return;
    }
    var marquer = function () {
        var marche = document.createTreeWalker(cible, NodeFilter.SHOW_TEXT);
        var n = marche.nextNode();
        while (n) {
            var i = n.parentNode && n.parentNode.classList && n.parentNode.classList.contains('w-wuit') ? -1 : n.nodeValue.search(/Wuit(?=[A-Z])/);
            if (i !== -1) {
                var reste = n.splitText(i);
                reste.nodeValue = reste.nodeValue.slice(4);
                var s = document.createElement('span');
                s.className = 'w-wuit';
                s.textContent = 'Wuit';
                reste.parentNode.insertBefore(s, reste);
                return;
            }
            n = marche.nextNode();
        }
    };
    marquer();
    new MutationObserver(marquer).observe(cible, { childList: true, characterData: true, subtree: true });
})();
